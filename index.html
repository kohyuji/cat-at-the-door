<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat at the Door</title>
<style>
@font-face{font-family:'DungGeunMo';src:url(fonts/DungGeunMo.woff) format('woff');font-weight:400;font-style:normal;font-display:block}
:root{
  --bg:#e7eaf6; --surface:#ffffff; --ink:#24273f; --muted:#64688c; --line:#cfd3e8;
  --lamp:#c4870f; --door:#c9b59a; --door-edge:#8f7a62; --gap:#f6d77e; --paw:#3a3045;
  --bad:#c2453c; --good:#3f7d5c;
  --wall:#dfe2f2; --wall-n:#3b3f66; --floor:#c3c8e0; --floor-n:#2c2f4f; --sky:#4b5287; --moon:#fbe7a1;
  --fur:#e9a35c; --fur-dark:#b9732f; --skin:#f2cfae; --hair:#3b2f2f; --shoe:#2b2735;
  --suit:#2f3350; --suit-d:#1f2238; --shirt:#ffffff; --tie:#5d7fd6; --tee:#f4f4f7; --pants:#6d7088;
  --pj:#a9bde6; --pj-d:#7f95c8; --hoodie:#a3a8bd; --hoodie-d:#858aa3;
  --boss:#8c7a5c; --boss-d:#5e5140; --ceo:#5f7f6a; --ceo-d:#40584a;
  --blanket:#8fa3d9; --sheet:#f4f1fa; --wood:#b08d68; --wood-d:#8a6a4b;
  --day:#f4f0e2; --sun:#ffe9a8; --warm:#f3c48a; --hint:#ffd84d; --think:#eef0ff;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7; --line:#3a3f62;
    --wall:#c9cde3; --day:#e6e1d0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7; --line:#3a3f62;
  --wall:#c9cde3; --day:#e6e1d0;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DungGeunMo',monospace;line-height:1.6;font-size:17px;-webkit-font-smoothing:none;font-synthesis:none}
main{max-width:32rem;margin:0 auto;padding:12px 16px 28px}
.stage{position:relative;width:100%;max-width:min(100%, calc((100vh - 36px) * .75));margin:0 auto;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#14162a;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
@supports (height:100svh){ .stage{max-width:min(100%, calc((100svh - 36px) * .75))} }
.stage svg{display:block;width:100%;height:100%}
.stage text{font-family:'DungGeunMo',monospace}
[data-hit]{cursor:pointer;outline:none}
[data-hit]:focus-visible{outline:3px solid var(--hint)}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;background:rgba(12,14,30,.86);color:#fff;font-size:26px;pointer-events:none;animation:card 2.2s ease forwards}
.card small{font-size:15px;opacity:.75}
@keyframes card{0%,55%{opacity:1}100%{opacity:0;visibility:hidden}}
.fadein{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.stage.out svg{transition:opacity .45s ease;opacity:0}
.stage.through svg{transition:transform 1s ease-in,opacity 1s ease-in;transform:scale(2.6);opacity:0}
.stage.flash::after{content:"";position:absolute;inset:0;background:#fff;animation:flashw .5s ease forwards;pointer-events:none}
@keyframes flashw{from{opacity:.85}to{opacity:0}}
.dim{position:absolute;inset:0;background:#05060d;opacity:0;pointer-events:none}
.dim.on{transition:opacity var(--hes,3s) linear;opacity:.88}
.sepia svg{filter:sepia(.75) saturate(1.3) brightness(1.05)}
/* 그림 속 움직임 */
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.shiver{animation:shiver .18s linear infinite}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.6px)}}
.breath{transform-box:fill-box;transform-origin:50% 100%;animation:breath 3s ease-in-out infinite}
@keyframes breath{50%{transform:scaleY(1.03)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.tapping{animation:tapping .5s ease-in-out infinite}
@keyframes tapping{50%{transform:translate(2px,-5px)}}
.rain line{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
.snow circle{animation:snow 3s linear infinite}
@keyframes snow{from{transform:translateY(-10px)}to{transform:translateY(18px)}}
.mover{transition:transform 1s ease-in-out}
.mover.fast{transition-duration:.45s}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.float{animation:float 1.1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.jump{animation:jump .5s ease-out}
@keyframes jump{45%{transform:translateY(-58px)}}
.shake{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ring-pulse{animation:ringp 1.4s ease-in-out infinite}
@keyframes ringp{0%,100%{opacity:.25}50%{opacity:.95}}
.sway{transform-box:fill-box;transform-origin:50% 0%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.zz{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.lightning{animation:lightning 2.8s steps(1) infinite}
@keyframes lightning{0%,88%,94%,100%{opacity:0}90%,96%{opacity:.85}}
.snowfall circle{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(-30px,510px)}}
.tg{opacity:0;transition:opacity .15s;pointer-events:none}
#sc.dragging .tg{opacity:.8}
.tg.over{opacity:1}
.tg.over rect,.tg.over ellipse{stroke-width:5}
.flutter{transform-box:fill-box;transform-origin:center;animation:flutter .22s ease-in-out infinite alternate}
@keyframes flutter{to{transform:scaleY(.35)}}
.scratching{animation:scratching .28s ease-in-out infinite alternate}
@keyframes scratching{to{transform:translateY(9px)}}
.vib{animation:vib .1s linear infinite}
@keyframes vib{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.blinkR{animation:blinkr 1s steps(1) infinite}
@keyframes blinkr{50%{opacity:.25}}
.knead{animation:knead .35s ease-in-out infinite alternate}
@keyframes knead{to{transform:translateY(3px)}}
.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-22px)}}
.dimmer{transition:opacity 2.6s linear}
.glowring{animation:ringp 1.4s ease-in-out infinite}
.title-sign{font-size:30px}
.typing{animation:typingb .28s ease-in-out infinite alternate}
@keyframes typingb{to{transform:translateY(2px)}}
/* 시범을 보이는 손 */
.gh{pointer-events:none}
.gh .h-tap{animation:htap 1.1s ease-in-out infinite}
@keyframes htap{0%,100%{transform:translate(0,10px)}45%,60%{transform:translate(0,0)}}
.gh .rip{transform-box:fill-box;transform-origin:center;animation:rip 1.1s ease-out infinite}
@keyframes rip{0%,40%{transform:scale(.3);opacity:0}55%{opacity:1}100%{transform:scale(1.8);opacity:0}}
.gh .h-drag{animation:hdrag 2s ease-in-out infinite}
@keyframes hdrag{0%{transform:translate(0,0);opacity:0}12%{transform:translate(0,0);opacity:1}72%{transform:translate(var(--dx),var(--dy));opacity:1}88%,100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.gh .h-rub{animation:hrub .75s ease-in-out infinite alternate}
@keyframes hrub{from{transform:translate(-18px,0) rotate(-8deg)}to{transform:translate(18px,0) rotate(8deg)}}
.gh .h-hold{animation:hhold 2.4s ease-in-out infinite}
@keyframes hhold{0%,100%{transform:translate(0,8px)}15%,85%{transform:translate(0,0)}}
.gh .holdring{stroke-dasharray:100;stroke-dashoffset:100;animation:holdr 2.4s linear infinite}
@keyframes holdr{0%,15%{stroke-dashoffset:100}85%,100%{stroke-dashoffset:0}}
.gh .trail{animation:trail 1s linear infinite}
@keyframes trail{to{stroke-dashoffset:-14}}
.holdbar{stroke-dasharray:100;stroke-dashoffset:100;animation:holdbar var(--hes,3s) linear forwards}
@keyframes holdbar{to{stroke-dashoffset:0}}
/* 아래쪽(타이틀, 엔딩) */
h1{font-size:32px;line-height:1.3;font-weight:400;margin:1rem 0 .2rem;text-align:center}
.names{display:flex;gap:.6rem;margin-top:1rem}
.names label{flex:1;display:flex;flex-direction:column;gap:.3rem;font-size:14px;color:var(--muted)}
.names input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;width:100%;min-width:0}
button{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:.9rem;padding:.8rem 1rem;cursor:pointer;line-height:1.4}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.wide{display:block;width:100%;margin-top:.8rem}
.wide.ghost{background:transparent}
.ending-title{font-size:28px;text-align:center;margin:1rem 0 .2rem}
.end-line{text-align:center;margin:.1rem 0}
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:1rem 0 .3rem}
.strip div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.strip svg{width:100%;height:auto;display:block}
.found{color:var(--muted);font-size:14px;text-align:center;margin-top:1rem}
.quiet{color:var(--muted);font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){
  .wag,.shiver,.breath,.bob,.tapping,.rain line,.snow circle,.pop,.jump,.shake,.ring-pulse,.sway,.zz,.lightning,.card,.fadein,.flutter,.scratching,.vib,.blinkR,.knead,.hop,.glowring{animation:none}
  .snowfall circle{animation-duration:12s!important}
  .card{display:none}
  .mover,.stage.through svg,.stage.out svg{transition:none}
  .gh .h-tap,.gh .h-drag,.gh .h-rub,.gh .h-hold{animation-duration:3s}
}
</style>
</head>
<body>
<main id="app"></main>
<script>
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hasJong(w){ const c = w.charCodeAt(w.length-1); if (c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28 !== 0; }
const J = (w,a,b) => w + (hasJong(w) ? a : b);
let ME = "김신입", CAT = "보리";
const CATi = () => J(CAT,"이","가"), CATe = () => J(CAT,"은","는"), CATo = () => J(CAT,"을","를"), CATw = () => J(CAT,"과","와");
/* ================= Cat at the Door v5 (뼈대부터 다시) =================
   그림이 곧 게임이다. 고르기 버튼은 없다.
   - 문, 이불, 옷, 보리, 노트북을 그림 안에서 직접 끌고, 문지르고, 누른다.
   - 처음 하는 동작은 흰 손이 한 번 시범을 보인다. 한참 가만히 있으면 다시 보여 준다.
   - 글은 편지, 시계, 달력처럼 그림 속 물건에만 있다. 말은 팀장님과 사장님만 가끔 한다.
   - 결과는 숫자 대신 다음 장면의 보리와 내 얼굴로 보인다.
   - 문이 닫히면 카메라가 문을 지나 바닥 높이로 내려가서 보리가 된다.
*/
const VW = 360, VH = 480, FLOOR = 410;
const DAYS = 12;
const WD = ["월","화","수","목","금","토","일","월","화","수","목","금"];
const ACT = d => d <= 5 ? 1 : d <= 9 ? 2 : 3;
let SPEED = 1;                       // 테스트에서 시간을 줄인다
let s, timers = [], ticks = [];
const $app = document.getElementById('app');
const SEEN = {};                     // 이미 시범을 본 동작
function reset(){
  s = { day:0, bond:5, tired:0, face:3, prep:0, lates:0, slept:0, fur:0,
        lastOpen:false, catSpot:null, closetN:0, toys:0, laptopNight:false,
        hoodie:null, bossCat:false, found9:null, meet:null, log:[], finalOpen:null,
        furLeft:0, satWork:0, satPlay:false };
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const bond = d => { s.bond = clamp(s.bond + d, 0, 10); };
const rnd = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(7);
function later(ms, fn){ const t = setTimeout(fn, ms * SPEED); timers.push(t); return t; }
function every(ms, fn){ const t = setInterval(fn, ms * SPEED); ticks.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); ticks.forEach(clearInterval); timers = []; ticks = []; }
function dayLog(){ if (!s.log[s.day]) s.log[s.day] = { open:null, pet:false, play:false, late:false, work:false }; return s.log[s.day]; }
const $ = id => document.getElementById(id);

/* ================= 화면 틀 ================= */
// show: 장면 하나를 그린다. o.card: 날짜 같은 짧은 제목을 잠깐 덮어 보여 준다. o.below: 장면 아래 HTML (타이틀, 엔딩만)
// 키 큰 폰에서는 장면 위아래(벽과 바닥)를 더 보여 줘서 화면을 채운다
let EXT = { top:0, bot:0 };
function computeExt(){
  const W = Math.min(window.innerWidth - 32, 512), H = window.innerHeight - 40;
  if (window.innerWidth >= 700 || W <= 0) return { top:0, bot:0 };
  const E = clamp(Math.round(VW * H / W - VH), 0, 170);
  return { top: Math.round(E * .45), bot: E - Math.round(E * .45) };
}
function show(world, o={}){
  clearTimers(); idleKill(); G = null; HIT = {};
  EXT = o.flat ? { top:0, bot:0 } : computeExt();
  const TH = VH + EXT.top + EXT.bot;
  $app.innerHTML = `<div class="stage ${o.cls||''} fadein" id="sc" style="aspect-ratio:${VW}/${TH};max-width:min(100%, calc((100svh - 36px) * ${(VW/TH).toFixed(4)}))">
      <svg viewBox="0 ${-EXT.top} ${VW} ${TH}" role="img" aria-label="${o.label||''}"><g id="world">${world}</g><g id="fx"></g><g id="ghost" pointer-events="none"></g></svg>
      ${o.card ? `<div class="card">${o.card}</div>` : ""}
    </div>${o.below || ""}`;
  window.scrollTo(0,0);
  bindScene();
}
function world(html){ const w = $('world'); if (w) w.innerHTML = html; }
function putFx(id, html){ const L = $('fx'); if (!L) return; const old = $(id); if (old) old.remove(); L.insertAdjacentHTML('beforeend', html); }
function dropFx(...ids){ ids.forEach(id => { const e = $(id); if (e) e.remove(); }); }
// 장면 전환: 살짝 어두워졌다가 다음 장면
function fadeTo(fn, ms=450){ const st = $('sc'); if (st) st.classList.add('out'); idleKill(); HIT = {}; const t = setTimeout(fn, ms * Math.min(1, SPEED*2)); timers.push(t); }
// 문을 지나 반대편으로: 문 쪽으로 다가가며 어두워진다
function throughDoor(fn, ox="76%", oy="52%"){
  const st = $('sc'); if (!st) return fn(); idleKill(); HIT = {};
  const svg = st.querySelector('svg'); svg.style.transformOrigin = `${ox} ${oy}`;
  st.classList.add('through');
  const t = setTimeout(fn, 1000 * Math.min(1, SPEED*2)); timers.push(t);
}
function moveEl(id, x, y, extra=""){ const e = $(id); if (!e) return; requestAnimationFrame(()=>requestAnimationFrame(()=>{ e.style.transform = `translate(${x}px,${y}px) ${extra}`; })); }

/* ================= 입력: 장면 하나에 이벤트를 걸고 data-hit 이름으로 나눈다 ================= */
// HIT[name] = { tap, rub:{fn,per}, drag:{ghost,targets,miss}, pull:{progress,move,done}, hold:{start,release}, key }
let HIT = {}, G = null;
function hits(m){ HIT = m; }
function addHits(m){ Object.assign(HIT, m); }
const hitA = (name, label) => `data-hit="${name}" tabindex="0" role="button" aria-label="${label}"`;
function svgPt(svg, e){ const r = svg.getBoundingClientRect(); return { x:(e.clientX-r.left)*VW/r.width, y:-EXT.top + (e.clientY-r.top)*(VH+EXT.top+EXT.bot)/r.height }; }
const ptIn = (p, r) => p.x >= r[0] && p.x <= r[0]+r[2] && p.y >= r[1] && p.y <= r[1]+r[3];
function ghost(html){ const g = $('ghost'); if (g) g.innerHTML = html; }
function bindScene(){
  const box = $('sc'); if (!box) return;
  const svg = () => box.querySelector('svg');
  box.addEventListener('pointerdown', e => {
    idlePoke();
    const el = e.target.closest && e.target.closest('[data-hit]');
    const name = el ? el.dataset.hit : null;
    const h = (name && HIT[name]) || HIT._bg;
    if (!h) return;
    e.preventDefault();
    const p = svgPt(svg(), e);
    G = { name, h, p0:p, last:p, moved:0, acc:0, t0:Date.now(), el };
    try { box.setPointerCapture(e.pointerId); } catch(_){}
    if (h.drag){ box.classList.add('dragging'); if (h.drag.from) h.drag.from(true); ghost(h.drag.ghost(p.x, p.y)); }
    if (h.down) h.down(p);
    if (h.hold) h.hold.start();
  });
  box.addEventListener('pointermove', e => {
    const p = svgPt(svg(), e);
    if (HIT._move) HIT._move(p, !!G);
    if (!G) return;
    const d = Math.hypot(p.x - G.last.x, p.y - G.last.y);
    G.moved += d; G.acc += d; G.last = p;
    const h = G.h;
    if (h.drag){ ghost(h.drag.ghost(p.x, p.y)); (h.drag.targets||[]).forEach(t => { const m = $('tg-'+t.key); if (m) m.classList.toggle('over', ptIn(p, t.r)); }); }
    if (h.pull){ const v = clamp(h.pull.progress(G.p0, p), 0, 1); h.pull.move(v); if (v >= 1){ const f = h.pull.done; G = null; f(); return; } }
    if (h.rub && G.acc > (h.rub.per || 60)){ G.acc = 0; h.rub.fn(p); }
    if (h.dragMove) h.dragMove(p);
  });
  const up = (e, cancel) => {
    if (!G) return;
    const g = G; G = null; const h = g.h;
    const p = e ? svgPt(svg(), e) : g.last;
    if (h.drag){
      box.classList.remove('dragging'); ghost(""); if (h.drag.from) h.drag.from(false);
      const t = !cancel && (h.drag.targets||[]).find(t => ptIn(p, t.r));
      (h.drag.targets||[]).forEach(t => { const m = $('tg-'+t.key); if (m) m.classList.remove('over'); });
      if (t) t.fn(); else if (h.drag.miss) h.drag.miss(g.moved < 8);
    }
    if (h.pull && !cancel){ h.pull.move(0); if (g.moved < 8 && h.pull.tapped) h.pull.tapped(); }
    if (h.hold) h.hold.release(Date.now() - g.t0, cancel);
    if (h.rub && g.moved < 8 && !cancel) h.rub.fn(p);
    if (h.tap && g.moved < 14 && !cancel) h.tap(p);
    if (h.up) h.up(p);
  };
  box.addEventListener('pointerup', e => up(e, false));
  box.addEventListener('pointercancel', e => up(e, true));
  box.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const el = e.target.closest && e.target.closest('[data-hit]');
    const h = el && HIT[el.dataset.hit];
    if (!h || !h.key) return;
    e.preventDefault(); idlePoke(); h.key();
  });
}

/* ================= 시범을 보이는 손 ================= */
// 흰 장갑 손. (0,0)이 손가락 끝.
const HAND = `<g>
  <rect x="-10" y="13" width="21" height="19" rx="6" fill="#fff" stroke="#24273f" stroke-width="1.8"/>
  <circle cx="5" cy="14" r="3.6" fill="#fff" stroke="#24273f" stroke-width="1.6"/><circle cx="9.5" cy="16" r="3.4" fill="#fff" stroke="#24273f" stroke-width="1.6"/>
  <rect x="-15.5" y="16" width="8" height="12" rx="4" fill="#fff" stroke="#24273f" stroke-width="1.8" transform="rotate(-25 -11 22)"/>
  <rect x="-4.2" y="0" width="8.4" height="22" rx="4.2" fill="#fff" stroke="#24273f" stroke-width="1.8"/>
  <rect x="-2.6" y="17" width="5.2" height="7" fill="#fff"/></g>`;
// type: tap | drag | rub | hold
function handHint(type, x, y, x2, y2){
  if (type === "drag"){
    const dx = x2 - x, dy = y2 - y;
    return `<g id="gh" class="gh"><line class="trail" x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#fff" stroke-width="3" stroke-dasharray="6 8" opacity=".9"/>
      <circle cx="${x2}" cy="${y2}" r="9" fill="none" stroke="#fff" stroke-width="2.5" opacity=".9"/>

const CLOCKS = {};
function handsAt(C, h, m){
  const P = (a, rr) => [C.cx + Math.sin(a*Math.PI/180)*rr, C.cy - Math.cos(a*Math.PI/180)*rr];
  return [P(((h % 12) + m/60) * 30, C.r * .5), P(m * 6, C.r * .8)];
}
function clockFace(id, cx, cy, r, h, m, o={}){
  const C = { cx, cy, r }; CLOCKS[id] = C;
  const P = (a, rr) => [cx + Math.sin(a*Math.PI/180)*rr, cy - Math.cos(a*Math.PI/180)*rr];
  let g = `<g id="${id}"><circle cx="${cx}" cy="${cy}" r="${r+5}" fill="${o.rim||'var(--wood-d)'}"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffdf6"/>`;
  if (o.red){ const a0 = o.red[0]*6, a1 = o.red[1]*6, p0 = P(a0, r-2), p1 = P(a1, r-2);
    g += `<path id="${id}-red" d="M${cx},${cy} L${p0[0].toFixed(1)},${p0[1].toFixed(1)} A${r-2},${r-2} 0 ${a1-a0>180?1:0},1 ${p1[0].toFixed(1)},${p1[1].toFixed(1)} Z" fill="#ff5a4a" opacity=".5"/>`; }
  for (let i=0;i<12;i++){ const a = i*30, q = P(a, r-3), w = P(a, r - (i%3 ? 7 : 11)); g += `<line x1="${q[0].toFixed(1)}" y1="${q[1].toFixed(1)}" x2="${w[0].toFixed(1)}" y2="${w[1].toFixed(1)}" stroke="#3a3045" stroke-width="${i%3?1.6:3}"/>`; }
  const [hh, mm] = handsAt(C, h, m);
  g += `<line id="${id}-h" x1="${cx}" y1="${cy}" x2="${hh[0].toFixed(1)}" y2="${hh[1].toFixed(1)}" stroke="#3a3045" stroke-width="4.5" stroke-linecap="round"/>
    <line id="${id}-m" x1="${cx}" y1="${cy}" x2="${mm[0].toFixed(1)}" y2="${mm[1].toFixed(1)}" stroke="#3a3045" stroke-width="3" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3.4" fill="#3a3045"/></g>`;
  return g;
}
function setClock(id, h, m){
  const C = CLOCKS[id]; if (!C) return;
  const [hh, mm] = handsAt(C, h, m);
  const eh = $(id+'-h'), em = $(id+'-m');
  if (eh){ eh.setAttribute('x2', hh[0].toFixed(1)); eh.setAttribute('y2', hh[1].toFixed(1)); }

// 서랍장. o.open: 맨 아래 칸이 열림, o.sleeve: 닫힌 서랍 틈으로 후드티 소매, o.fur: 서랍 틈의 주황 털, o.inside: 열린 서랍 속 그림
function dresser(x, y, w, h, o={}){
  const dh = (h - 16) / 3;
  let g = `<g><rect x="${x-6}" y="${y-8}" width="${w+12}" height="12" rx="4" fill="var(--wood-d)"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--wood-d)"/>`;
  for (let i=0;i<2;i++){ const dy = y + 6 + i*(dh+2); g += `<rect x="${x+6}" y="${dy}" width="${w-12}" height="${dh}" rx="3" fill="var(--wood)"/><rect x="${x+w/2-12}" y="${dy+dh/2-3}" width="24" height="6" rx="3" fill="#e9c46a"/>`; }
  const by = y + 6 + 2*(dh+2);
  if (o.open){
    g += `<rect x="${x+6}" y="${by}" width="${w-12}" height="${dh}" fill="#3a2c22"/>${o.inside || ""}
      <rect x="${x-4}" y="${by+dh*.45}" width="${w+8}" height="${dh*.75}" rx="3" fill="var(--wood)" stroke="var(--wood-d)" stroke-width="2"/>
      <rect x="${x+w/2-12}" y="${by+dh*.45+dh*.3}" width="24" height="6" rx="3" fill="#e9c46a"/>`;
  } else {
    g += `<rect x="${x+6}" y="${by}" width="${w-12}" height="${dh}" rx="3" fill="var(--wood)"/><rect x="${x+w/2-12}" y="${by+dh/2-3}" width="24" height="6" rx="3" fill="#e9c46a"/>`;
    if (o.sleeve) g += `<path d="M${x+w*.22},${by+1} q-6,${dh*.5} -2,${dh+4}" stroke="var(--hoodie)" stroke-width="${Math.max(8, w*.07)}" fill="none" stroke-linecap="round"/>`;
    if (o.fur) g += `<path d="M${x+w*.62},${by} l7,-4 M${x+w*.67},${by+1} l8,-2 M${x+w*.58},${by+1} l5,-5" stroke="var(--fur)" stroke-width="2.8" stroke-linecap="round"/>`;
  }
  return g + `</g>`;
}
// 침대 (옆에서 본 모습, 머리는 왼쪽). o.who: 누운 사람 얼굴, o.cover: 이불을 머리끝까지
function bed(x, y, w, o={}){
  const top = y - 46;
  let g = `<g><rect x="${x}" y="${top-34}" width="16" height="${34+46}" rx="4" fill="var(--wood-d)"/>
    <rect x="${x+w-10}" y="${top-6}" width="12" height="52" rx="4" fill="var(--wood-d)"/>
    <rect x="${x+8}" y="${top}" width="${w-12}" height="30" rx="8" fill="var(--sheet)"/>
    <rect x="${x+8}" y="${top+26}" width="${w-12}" height="20" fill="var(--wood)"/>
    <ellipse cx="${x+44}" cy="${top+2}" rx="26" ry="12" fill="#fff" stroke="#d6d9ea" stroke-width="2"/>`;
  if (o.who && !o.cover){ g += `<g transform="translate(${x+48},${top+178}) scale(.82)">${headG({ face:o.face||"sleep" })}</g>`; }
  if (o.who) g += `<path d="M${x+(o.cover?22:62)},${top+(o.cover?-12:-4)} q${o.cover?20:30},-16 ${w-(o.cover?40:76)},-4 q16,2 18,16 v34 h-${w-(o.cover?18:56)} z" fill="var(--blanket)"/>
      <path d="M${x+(o.cover?30:70)},${top+10} q${w*.3},-10 ${w*.6},0" stroke="#7c8fc8" stroke-width="3" fill="none"/>`;
  else g += `<path d="M${x+70},${top+4} q${w*.3},-12 ${w-90},2 v24 h-${w-90} z" fill="var(--blanket)" opacity=".9"/>`;
  return g + `</g>`;
}
// 방 안에서 본 방문 (경첩은 왼쪽). open: 0 닫힘 ~ 1 활짝
function doorIn(x, y, w, h, open=0, o={}){
  const gapC = o.blue ? "#9ec0ff" : "var(--gap)";
  if (open <= 0) return `<g><rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+6}" fill="var(--wood-d)"/>
      <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="3" fill="var(--door)"/>
      <rect x="${x+12}" y="${y+16}" width="${w-24}" height="${h*.36}" rx="3" fill="none" stroke="#b39d80" stroke-width="2.5"/><rect x="${x+12}" y="${y+h*.5}" width="${w-24}" height="${h*.4}" rx="3" fill="none" stroke="#b39d80" stroke-width="2.5"/>
      <circle cx="${x+w-14}" cy="${y+h*.52}" r="6" fill="#e9c46a"/><rect x="${x+w-20}" y="${y+h*.52-2}" width="12" height="4" rx="2" fill="#c9a24a"/>
      <rect x="${x}" y="${y+h-3}" width="${w}" height="5" fill="${gapC}"/>
      ${o.paws ? `<g fill="var(--paw)"><ellipse cx="${x+w*.38}" cy="${y+h+1}" rx="8" ry="3.4"/><ellipse cx="${x+w*.62}" cy="${y+h+1}" rx="8" ry="3.4"/></g>` : ""}
      ${o.hoodie ? `<rect x="${x+w*.25}" y="${y+h-1}" width="${w*.5}" height="4" rx="2" fill="var(--hoodie)"/>` : ""}
      ${o.scratch ? `<path d="M${x+w*.3},${y+h-40} l6,26 M${x+w*.42},${y+h-44} l6,28 M${x+w*.54},${y+h-40} l6,26" stroke="#8a7458" stroke-width="2.2" stroke-linecap="round"/>` : ""}</g>`;
  const ww = Math.max(10, w * (1 - open*.86));
  return `<g><rect x="${x-6}" y="${y-6}" width="${w+12}" height="${h+6}" fill="var(--wood-d)"/>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.beyond || '#1c1f3a'}"/>
    <rect x="${x}" y="${y+h*.72}" width="${w}" height="${h*.28}" fill="#2a2e52"/>
    ${o.inDoor || ""}
    <path d="M${x},${y} L${x+ww},${y+10*open} L${x+ww},${y+h-8*open} L${x},${y+h} Z" fill="var(--door)" stroke="var(--wood-d)" stroke-width="2"/>
    ${ww > 30 ? `<circle cx="${x+ww-12}" cy="${y+h*.52}" r="5.5" fill="#e9c46a"/>` : ""}</g>`;
}

const BLEED = 150;   // 키 큰 폰에서 위아래로 더 보이는 부분까지 칠한다
const wallR = (c, y0=0, y1=330) => { const a = y0 <= 0 ? -BLEED : y0, b = y1 >= VH ? VH + BLEED : y1; return `<rect x="0" y="${a}" width="${VW}" height="${b-a}" fill="${c}"/>`; };
function floorBand(y, c, c2){
  let g = `<rect x="0" y="${y}" width="${VW}" height="${VH+BLEED-y}" fill="${c}"/><rect x="0" y="${y}" width="${VW}" height="5" fill="${c2}"/>`;
  for (let i=1;i<6;i++){ const yy = y + 5 + i*i*4.5; if (yy < VH) g += `<line x1="0" y1="${yy.toFixed(0)}" x2="${VW}" y2="${yy.toFixed(0)}" stroke="${c2}" stroke-width="1.5" opacity=".45"/>`; }
  return g;
}
// 눈
function snowLayer(n=46, seed=11){
  let r = seed, g = `<g class="snowfall" pointer-events="none">`;
  const R = () => (r = (r * 16807) % 2147483647) / 2147483647;
  for (let i=0;i<n;i++){ const x = R()*400, d = (3 + R()*3).toFixed(1), dl = (-R()*6).toFixed(1), rr = (1.6 + R()*2.2).toFixed(1);
    g += `<circle cx="${x.toFixed(0)}" cy="-12" r="${rr}" fill="#fff" opacity=".9" style="animation-duration:${d}s;animation-delay:${dl}s"/>`; }
  return g + `</g>`;
}

  const night = !!o.night, lamp = !!o.lamp;

  const p = $('pname').value.trim(), c = $('cname').value.trim();

/* ================= 프롤로그 1: 2년 전 겨울, 편의점 앞 ================= */
let PS = null;
function p1(){
  PS = { tilt:0, stage:"snow" };
  show(p1World(), { card:"2년 전 겨울", label:"눈 오는 밤, 상자 속 새끼 고양이" });
  p1Hits();
  later(2400, () => teach("drag", 156, 160, 250, 206, { key:"umbrella" }));
}
function p1World(){
  const t = PS.tilt, st = PS.stage;
  const covered = st !== "snow";
  const held = st === "held";
  const hand = [34 + t*44, -170 + t*34];
  const kit = held ? "" : `<g class="${covered ? '' : 'shiver'}">${catSit(262, 402, .72, { sad:!covered, happy:st === "look" })}
      ${covered ? "" : `<circle cx="256" cy="364" r="2.6" fill="#fff"/><circle cx="268" cy="367" r="2.2" fill="#fff"/><circle cx="262" cy="376" r="2" fill="#fff"/>`}</g>`;
  const meSnow = covered ? `<circle cx="112" cy="252" r="2.6" fill="#fff"/><circle cx="126" cy="249" r="2.2" fill="#fff"/><circle cx="104" cy="262" r="2" fill="#fff"/><circle cx="134" cy="258" r="2.2" fill="#fff"/>` : "";
  const me = held
    ? person(150, 436, { wear:"hoodie", face:"happy", pose:"hold", held:`<g transform="translate(0,22)">${catSit(0, 0, .55, { happy:true })}</g>` })
    : person(120, 436, { wear:"hoodie", face: covered ? "soft" : "worry", hands:{ L:[-30,-76], R:hand } });
  const umb = held ? `<g transform="translate(210,430) rotate(100)">${umbrella(0, 0, 0)}</g>`
    : st === "snow" ? `<g ${hitA("umb","우산을 기울이기")}>${umbrella(120 + hand[0], 436 + hand[1], t*40)}<rect x="${86 + t*40}" y="${120 + t*30}" width="140" height="96" fill="transparent"/></g>`
    : umbrella(120 + hand[0], 436 + hand[1], t*40);
  const kitHit = st === "look" ? `<rect ${hitA("kit","고양이를 안기")} x="222" y="364" width="80" height="70" fill="transparent"/>` : "";
  return `${storeStreet()}${snowLayer()}${kit}${cardBox(262, 432)}${me}${meSnow}${umb}${kitHit}
    <g id="tgs"><g class="tg" id="tg-me"><rect x="68" y="236" width="110" height="200" rx="14" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g></g>`;
}
function p1Hits(){
  hits({
    umb: { pull: { progress:(a,b) => (b.x - a.x) / 90, move: v => { PS.tilt = v; world(p1World()); }, done: p1Cover, tapped: p1Cover }, key: p1Cover },
    kit: { drag: { ghost:(x,y) => `<g transform="translate(${x},${y+24})">${catSit(0, 0, .6, {})}</g>`,
                   targets:[{ key:"me", r:[60, 220, 130, 230], fn: p1Hold }], miss: tap => { if (tap) p1Hold(); } }, key: p1Hold }
  });
}
function p1Cover(){
  if (PS.stage !== "snow") return;
  PS.tilt = 1; PS.stage = "look"; world(p1World()); p1Hits();
  later(500, () => sound('nya', '냐아', 300, 372, { fs:15 }));
  later(1300, () => teach("drag", 262, 396, 128, 330, { key:"kitten" }));
}
function p1Hold(){
  if (PS.stage !== "look") return;
  PS.stage = "held"; idleKill(); dropFx('nya');
  world(p1World()); hits({});
  [0, 300, 600].forEach((d, i) => later(d, () => heart(150 + i*8, 300 - i*6)));
  later(2600, () => fadeTo(() => p2(0), 700));
}

/* ================= 프롤로그 2: 그 뒤로 2년. 메일, 불합격, 무릎 위 보리 ================= */
const SEASONS = ["winter", "spring", "summer", "fall", "winter"];
function p2(i){
  PS = { i, stage:"mail", rubs:0 };
  show(p2World(), { label:"책상 앞, 노트북 메일" });
  hits({ mail: { tap: p2Open, key: p2Open } });
  if (i === 0) later(900, () => teach("tap", 250, 300, 0, 0, { key:"mail" }));
  else if (i === 2 || i === 3) later(700, p2Open);
  else teach("tap", 250, 300, 0, 0, { key:"mail" });
}
function p2World(){
  const P = PS, last = P.i === 4, st = P.stage;
  const catSc = .62 + P.i * .1;
  const near = st === "comfort" || st === "better";
  const catX = near ? 240 : 312;
  const face = { mail:"neutral", read: last ? "surprise" : "neutral", sad:"sad", comfort:"sad", better:"soft", cheer:"happy" }[st];
  let hands = { L:[-40,-78], R:[40,-78] };
  if (st === "better") hands = { L:[-40,-78], R:[catX - 176, -70 - 44*catSc] };
  if (st === "cheer") hands = { L:[-48,-188], R:[48,-188] };
  const pose = (st === "sad" || st === "comfort") ? "slump" : "stand";
  const cat = st === "cheer"
    ? `<g class="hop">${catSit(catX, 382, catSc, { flip:true })}</g>`
    : catSit(catX, 382, catSc, { flip: near, happy: st === "better", wag: st === "better" });
  return `${wallR("#e3d6c3", 0, 400)}${win(24, 40, 100, 96, SEASONS[P.i], { curtain:"#cbb08f" })}
    ${calendarW(262, 50, { x: P.i * 5 + (st !== "mail" && !last ? 4 : 0) })}
    ${person(176, 452, { wear:"hoodie", noLegs:true, face, pose, hands })}
    ${deskFront(0, 380, 360)}
    ${laptopBack(166, 382, { glow: st === "mail" })}

function moTeach(){

  if (!M.dressed) return teach("drag", 226, 316, M.mx, 330, { key:"dress" });
  if (M.fur > 0 && ACT(s.day) < 3) return teach("drag", 66, 444, M.mx, 340, { key:"roller" });
  if (M.door === 0) return teach("tap", D.x + D.w - 16, D.y + D.h*.52, 0, 0, { key:"opendoor" });

  if (M.catAt === "door") L.push(["rub", FAREWELL[0], FAREWELL[1] - 40]);
  if (M.fur > 0) L.push(["drag", 66, 444, M.mx, 340]);
  L.push(["tap", D.x + 42, D.y + 120]);

/* ---- 돌돌이: 정장을 크게 본다. 문지르면 털이 롤에 붙는다 ---- */
let RL = null;
function rollScene(){
  const n = MO.fur;
  RL = { st: rlStrands(n), left:n, total:n, x:296, y:430, stuck:0, last:null, done:false };
  show(rlWorld(), { label:"정장에 붙은 고양이 털" });
  const RH = { down: rlDown, dragMove: rlMove, up: () => { RL.last = null; }, key: rlBand };
  hits({ _bg: RH, roll: RH });
  every(1200, moTick);
  later(300, () => teach("rub", 180, 390, 0, 0, { key:"roll" }));
}
function rlStrands(n){
  let seed = s.day * 97 + s.slept * 13 + 7;
  const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  return Array.from({ length:n }, (_, i) => {
    const z = i % 5;
    const x = z < 3 ? 130 + R()*100 : z === 3 ? 100 + R()*20 : 240 + R()*20;
    const y = z < 3 ? 328 + R()*136 : 348 + R()*96;
    return { x, y, a: R()*170, on:true };
  });
}
function rlFace(){ return RL.left === 0 ? "smile" : MO.min >= 60 ? "panic" : "worry"; }
function rlWorld(){
  const strands = RL.st.map((t, i) => t.on ? `<path id="st${i}" d="M${(t.x-6).toFixed(1)},${t.y.toFixed(1)} q6,-5 12,0" transform="rotate(${t.a.toFixed(0)} ${t.x.toFixed(1)} ${t.y.toFixed(1)})" stroke="var(--fur)" stroke-width="3.4" fill="none" stroke-linecap="round"/>` : "").join('');
  return `${wallR("#efe4cf", 0, VH)}${win(-40, 36, 120, 120, s.day === 3 ? "rain" : "day", {})}
    ${clockFace("ck2", 310, 58, 28, 7, MO.min, { red:[0, 15] })}
    <g id="bigme">${person(180, 640, { sc:2.3, wear:"suit", face: rlFace() })}</g>
    <g id="strands">${strands}</g>
    <g id="rl">${rollerG(RL.x, RL.y, 1.25, RL.stuck)}</g>
    <rect ${hitA("roll","돌돌이로 털 떼기")} x="0" y="300" width="${VW}" height="180" fill="transparent"/>`;
}
function rlDown(p){ RL.last = { x:p.x, y:p.y - 34 }; rlPlace(RL.last); rlSweep(RL.last, RL.last); }
function rlMove(p){ const b = { x:p.x, y:p.y - 34 }; if (!RL.last) RL.last = b; rlSweep(RL.last, b); RL.last = b; rlPlace(b); }
function rlPlace(b){ RL.x = b.x; RL.y = b.y; part('rl', rollerG(b.x, b.y, 1.25, RL.stuck)); }
function rlSweep(a, b){
  if (RL.done) return;
  const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(d / 5));
  for (let k=0;k<=n;k++){
    const x = a.x + (b.x - a.x)*k/n, y = a.y + (b.y - a.y)*k/n;
    RL.st.forEach((t, i) => { if (t.on && Math.abs(t.x - x) < 42 && Math.abs(t.y - y) < 18) rlTake(i); });
  }
}
function rlTake(i){
  const t = RL.st[i]; t.on = false; RL.left--; RL.stuck++;
  const e = $('st' + i); if (e) e.remove();
  if (RL.left === 0) return rlClean();
  if (ACT(s.day) === 3 && RL.left <= Math.ceil(RL.total / 3) && !$('nextA')) nextArrow(rlEnough, "이 정도면 됐다");
}
function rlBand(){ const on = RL.st.map((t, i) => [t, i]).filter(([t]) => t.on).sort((p, q) => p[0].y - q[0].y).slice(0, 3); on.forEach(([, i]) => rlTake(i)); }
function rlClean(){
  RL.done = true; dropNext();
  part('bigme', person(180, 640, { sc:2.3, wear:"suit", face:"smile" }));
  sound('ok', '반짝', 180, 300, { fs:18, color:"#ffd84d" });
  MO.fur = 0;
  later(900, () => fadeTo(() => moShow(false), 400));
}
function rlEnough(){ if (RL.done) return; RL.done = true; MO.fur = RL.left; part('bigme', person(180, 640, { sc:2.3, wear:"suit", face:"soft" })); later(500, () => fadeTo(() => moShow(false), 400)); }

// 시계가 6시까지 빨리 돈다. 6시 정각, 팀장님이 일어난다.
function ofToSix(from, then){
  const to = 18 * 60 - 7 * 60;   // 7시 기준 분
  let cur = from;
  const step = Math.max(6, Math.round((to - from) / 40));
  const iv = every(40, () => {
    cur = Math.min(to, cur + step); const [h, m] = hm(cur); setClock("ock", h, m);
    if (cur >= to){
      clearInterval(iv); OF.dusk = true; OF.clock = [18, 0];
      later(300, () => { OF.bossUp = true; world(ofWorld()); sound('six', '6시 정각', 232, 140, { fs:14 }); });
      later(1300, () => { dropFx('six'); walk('bossU', 140, 0, 1, 1300); });
      later(2800, () => fadeTo(then || evening, 600));
    }
  });
}

  lines.push([{ face:"smile", pose:"type" }, { face:"soft", pose:"type" }, "다 잘하는 사람은 없어요. 어디까지 할지 정하는 거지."]);
  const seq = [];
  lines.forEach(([bo, mo, t], i) => {
    seq.push([i === 0 ? 900 : 3000, () => { world(draw(bo, mo)); say('m', t, 250, 262, { maxW:210 }); }]);
  });
  if (s.bossCat) seq.push([3200, () => { world(draw({ face:"happy", pose:"type" }, { face:"smile", pose:"type" }) + person(340, 452, { wear:"ceo", hair:"ceo", face:"happy", pose:"wave", flip:true })); say('m', "호떡이도 6시엔 밥 먹어요!", 320, 262); }]);
  seq.push([3200, () => { dropFx('m'); fadeTo(hoodieEvening, 700); }]);
  beats(seq);
}

/* ================= 9일 저녁: 꺼낸 후드티를 어디에 둘까 ================= */
function hoodieEvening(){

    ${catSit(212, 448, 1, { flip:true, wag:true, happy: st !== "hold" })}
    ${st === "hold" ? `<rect ${hitA("hood","후드티")} x="106" y="320" width="88" height="56" fill="transparent"/>` : ""}

  const put = k => {
    if (s.hoodie) return;
    s.hoodie = k; idleKill(); hits({});
    world(draw(k));
    if (k === "wear"){ [0, 300].forEach((d, i) => later(d, () => heart(206 + i*8, 380))); sound('gol', '골골', 236, 370, { fs:14 }); }
    if (k === "door") sound('ssk', '스윽', D.x + 42, D.y + D.h - 70, { fs:14 });
    if (k === "bed") sound('pok', '폭', 110, 300, { fs:14 });
    later(2600, () => fadeTo(() => night(false), 600));
  };
  hits({ hood: { drag: { ghost:(x,y) => hoodieFold(x-28, y-10, 56), targets:[
    { key:"wear", r:[100, 226, 100, 90], fn: () => put("wear") },

    { key:"bed", r:[40, 290, 130, 90], fn: () => put("bed") } ] }, key: () => put("wear") } });
  later(700, () => teachCycle([["drag", 150, 346, 150, 270], ["drag", 150, 346, D.x + 42, D.y + D.h - 20], ["drag", 150, 346, 100, 336]], { key:"hoodie3", each:2200 }));
}

/* ================= 6일 토요일: 해가 창을 건너는 동안 세 번 ================= */
let SA = null;
function saturday(){
  SA = { block:0, busy:false, did:[] };
  show(saWorld(), { card: dayCard(), label:"토요일 낮. 햇볕 속 고양이, 책상 위 노트북" });
  saHits();
  later(2400, saTeach);
}
function saSky(){ return ["#bfe0f5", "#9fd0f5", "#f0a86e"][SA.block] || "#f0a86e"; }
function saWorld(o={}){
  const sunX = [126, 180, 236][SA.block] || 236, sunY = [118, 70, 120][SA.block] || 120;
  const me = o.me != null ? o.me : person(206, 448, { wear:"tee", face:"neutral" });
  return `${wallR("#efe4cf", 0, 330)}${floorBand(330, "#cdbb9e", "#b5a283")}
    <rect x="106" y="34" width="152" height="124" rx="4" fill="var(--wood-d)"/><rect x="112" y="40" width="140" height="112" fill="${saSky()}"/>
    <circle cx="${sunX}" cy="${sunY}" r="16" fill="${SA.block === 2 ? '#ffd27a' : 'var(--sun)'}"/>
    <path d="M182,40 V152 M112,96 H252" stroke="var(--wood-d)" stroke-width="4"/>
    ${bedSide(0, 410, 150, {})}
    <path d="M${30 + SA.block*24},352 l70,0 l18,30 l-70,0 z" fill="#fff6c9" opacity=".7"/>
    ${o.noCat ? "" : `<g ${hitA("sun", CAT + "와 햇볕 낮잠")}>${catLoaf(70 + SA.block*24, 354, .95, { zz: !o.awake })}<rect x="${30 + SA.block*24}" y="318" width="100" height="44" fill="transparent"/></g>`}
    ${deskFront(236, 360, 124)}${laptopBack(298, 362, { glow:true })}
    <rect ${hitA("lap","노트북")} x="246" y="290" width="110" height="80" fill="transparent"/>
    ${o.noCup ? "" : `<g ${hitA("wand","낚싯대")}>${toyCup(150, 466)}<rect x="124" y="342" width="62" height="130" fill="transparent"/></g>`}
    <g id="sme">${me}</g>
    <g id="sfx"></g>`;
}
function saHits(){
  hits({ lap: { tap: saWork, key: saWork }, sun: { tap: saNap, key: saNap },
         wand: { drag: { ghost:(x,y) => wand(206, 340, x, y), targets:[{ key:"cat", r:[0, 260, 230, 160], fn: saPlay }], miss: () => saPlay() }, key: saPlay } });
}
function saTeach(){ teachCycle([["tap", 298, 330], ["drag", 166, 380, 90, 330], ["tap", 92 + SA.block*24, 340]], { key:"sat", each:2000 }); }
function saNext(){
  SA.block++; SA.busy = false;
  if (SA.block >= 3){ s.tired = clamp(s.tired - 1, 0, 3); return later(600, () => fadeTo(() => night(false), 700)); }
  world(saWorld()); saHits(); later(400, () => armIdle());
}
function saWork(){
  if (SA.busy) return; SA.busy = true; idleKill(); hits({});
  s.prep++; s.satWork++; SA.did.push("work");
  world(saWorld({ me:"", awake:true }) + `${person(298, 446, { wear:"tee", noLegs:true, face:"neutral", pose:"type" })}${deskFront(236, 360, 124)}${laptopBack(298, 362, { glow:true })}`);
  let k = 0; const iv = every(500, () => { sound('tk', '타닥', 270 + (k++ % 3) * 20, 270, { fs:13 }); });
  later(2400, () => { clearInterval(iv); dropFx('tk'); saNext(); });
}
function saPlay(){
  if (SA.busy) return; SA.busy = true; idleKill(); hits({});
  SA.did.push("play"); s.satPlay = true;
  let n = 0;
  const frame = () => {
    const fx = 70 + Math.sin(n) * 50, fy = 250 + Math.cos(n*1.7) * 30;
    world(saWorld({ noCat:true, noCup:true, me: person(206, 448, { wear:"tee", face:"happy", pose:"wave" }) }) + wand(254, 274, fx, fy) + (n % 2 ? catLeap(fx - 10, fy + 80, 1.1) : catSit(100, 400, 1, { wag:true, happy:true })));
    if (n % 2) heart(fx, fy - 10);
    n++;
  };
  frame(); const iv = every(450, frame);
  later(2800, () => { clearInterval(iv); bond(1); dayLog().play = true; saNext(); });
}
function saNap(){
  if (SA.busy) return; SA.busy = true; idleKill(); hits({});
  SA.did.push("nap"); bond(1); s.tired = clamp(s.tired - 1, 0, 3);
  world(saWorld({ noCat:true, me:"" }) + `<g transform="translate(${92 + SA.block*24},350) scale(.95) translate(0,168)">${headG({ face:"sleep" })}</g>
    <path d="M${110 + SA.block*24},346 q30,-14 60,0 v12 h-60 z" fill="var(--tee)"/>${catLoaf(150 + SA.block*24, 352, .9, { zz:true })}`);
  sound('zz', 'z z', 140, 290, { fs:16 });
  later(2600, () => { dropFx('zz'); saNext(); });
}

/* ================= 7일 일요일: 보리의 낮. 보리가 되어 나를 본다 ================= */
let SU = null;
function sunday(){
  const busy = s.satWork >= 2;
  SU = { busy, acts:0, at:"start", lock:false, mouse:true };
  show(suWorld(), { card: dayCard(), label:"일요일. 고양이 높이에서 본 나" });
  suHits();
  later(2400, () => teachCycle([["tap", 250, 260], ["drag", 66, 446, 230, 360], ["tap", 120, 440]], { key:"sun", each:2000 }));
}
function suMe(o={}){
  const B = SU.busy;
  return person(262, 468, Object.assign({ sc:1.45, wear:"hoodie", noLegs:true, face: B ? "tired" : "smile", pose: B ? "type" : "hold", held: B ? "" : phone(0, -6, { screen:"#cfe0ff" }) }, o));
}
function suWorld(meO, catHTML){
  return `${catWorldBg({ day:true })}
    ${bigDresser({ sleeve:false })}
    <g id="sume">${suMe(meO)}</g>
    <rect x="176" y="376" width="184" height="18" rx="4" fill="var(--wood)"/><rect x="186" y="394" width="164" height="12" fill="var(--wood-d)"/>
    ${SU.busy ? laptopBack(262, 378, { glow:true }) : `<rect x="214" y="364" width="46" height="12" rx="3" fill="#8f6ad8"/>`}
    <rect ${hitA("sunp","햇볕 자리")} x="40" y="406" width="160" height="74" fill="transparent"/>
    ${SU.mouse ? `<g ${hitA("mouse","쥐 인형")}>${mouseToy(66, 452, 1.5)}<rect x="22" y="418" width="84" height="48" fill="transparent"/></g>` : ""}
    <rect ${hitA("me","나에게")} x="180" y="150" width="170" height="250" fill="transparent"/>
    <g id="bori" class="mover" pointer-events="none" style="transform:translate(150px,476px) scale(1.9)">${catHTML || catAway(0, 0, 1)}</g>`;
}
function suHits(){
  hits({ me: { tap: suMeTap, key: suMeTap }, sunp: { tap: suSun, key: suSun },
         mouse: { drag: { ghost:(x,y) => mouseToy(x, y+8, 1.5), targets:[{ key:"me", r:[170, 140, 190, 270], fn: suMouse }] }, key: suMouse } });
}
function suAct(){ SU.acts++; SU.lock = false; if (SU.acts >= 2) later(1400, () => fadeTo(() => night(false), 700)); else { world(suWorld()); suHits(); armIdle(); } }
function suMeTap(){
  if (SU.lock) return; SU.lock = true; idleKill();
  walk('bori', 250, 400, 1.3, 900);
  later(950, () => {
    if (SU.busy){
      part('bori', catLoaf(0, 0, 1, { awake:true }));
      later(600, () => {
        if (s.bond >= 6){ part('sume', suMe({ face:"happy", pose:"pet" })); heart(260, 330); bond(1); }
        else { part('sume', suMe({ face:"soft", pose:"reach" })); bond(0); }
      });
      later(2200, () => { if (s.bond < 6){ walk('bori', 150, 470, 1.8, 700); part('bori', catSit(0, 0, 1, {})); } suAct(); });
    } else {
      part('bori', catLoaf(0, 0, 1, { zz:true }));
      part('sume', suMe({ face:"happy", pose:"hold", held:"" }));
      [0, 300, 600].forEach((d, i) => later(d, () => heart(250 + i*6, 330 - i*6)));
      bond(2);
      later(2200, suAct);
    }
  });
}
function suMouse(){
  if (SU.lock || !SU.mouse) return; SU.lock = true; SU.mouse = false; idleKill();
  world(suWorld()); hits({});
  walk('bori', 230, 440, 1.6, 700);
  later(800, () => {
    part('sume', suMe({ face: SU.busy ? "neutral" : "happy", pose:"wave" }));
    putFx('flyM', `<g id="flyM" style="transition:transform ${800*SPEED}ms ease-out">${mouseToy(230, 360, 1.3)}</g>`);
    later(60, () => { const m = $('flyM'); if (m) m.style.transform = 'translate(-170px,90px)'; });
    later(400, () => { walk('bori', 70, 466, 1.8, 600); part('bori', catLeap(0, 0, 1)); });
    later(1200, () => { dropFx('flyM'); part('bori', catSit(0, 0, 1, { happy:true, wag:true })); bond(1); });
    later(2200, suAct);
  });
}
function suSun(){
  if (SU.lock) return; SU.lock = true; idleKill();
  walk('bori', 110, 452, 1.7, 800);
  later(850, () => { part('bori', catLoaf(0, 0, 1, { zz:true })); sound('zz', '골골', 110, 380, { fs:14 }); });
  later(2600, () => { dropFx('zz'); SU.acts = 2; suAct(); });
}

/* ================= 12일 금요일: 첫 월급 ================= */
function paydayEvening(){
  const D = BR.door;
  const draw = (st) => `${bedroomBg({ night:true, lamp:true })}${clockFace("ck", BR.clock[0], BR.clock[1], BR.clock[2], 7, 30)}
    ${doorIn(D.x, D.y, D.w, D.h, 0, { hoodie: s.hoodie === "door" })}${bedSide(0, 410, 156, { hoodie: s.hoodie === "bed" })}
    ${st === "box" ? person(150, 448, { wear: s.hoodie === "wear" ? "hoodie" : "tee", face:"happy", pose:"hold", held:`<g transform="translate(0,30)">${cardBox(0, 0, 70, 40)}<path d="M-35,-20 h70 M0,-40 v40" stroke="#e5484d" stroke-width="4"/></g>` })
      : person(150, 448, { wear: s.hoodie === "wear" ? "hoodie" : "tee", face:"happy", pose: st === "laugh" ? "cheer" : "stand" })}
    ${st === "box" ? "" : `<g>${cardBox(240, 452, 84, 46)}${st === "in" || st === "laugh" ? `<g transform="translate(240,420)">${catSit(0, 0, .9, { happy:true })}</g>${cardBox(240, 452, 84, 30)}` : ""}</g>`}
    ${st === "box" ? catSit(232, 448, 1, { flip:true, wag:true }) : ""}
    ${st === "box" ? `<rect ${hitA("gift","선물 상자")} x="110" y="330" width="80" height="70" fill="transparent"/>` : ""}
    <g class="tg" id="tg-cat"><rect x="190" y="370" width="90" height="84" rx="10" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g>`;
  show(draw("box"), { label:"월급날 저녁. 선물 상자" });
  const give = () => {
    idleKill(); hits({});
    world(draw("open")); sound('rip', '부욱', 240, 380, { fs:15 });
    later(1200, () => { world(draw("in")); sound('nya', '냥!', 250, 336, { fs:17 }); });
    later(2600, () => { dropFx('nya'); world(draw("laugh")); sound('ha', '하하', 150, 236, { fs:15 }); });
    later(4400, () => fadeTo(() => night(true), 700));
  };
  hits({ gift: { drag: { ghost:(x,y) => cardBox(x, y+20, 70, 40), targets:[{ key:"cat", r:[180, 340, 120, 140], fn: give }] }, key: give } });
  later(600, () => teach("drag", 150, 360, 236, 410, { key:"gift" }));
}
function payPhone(arrive){
  part('fx', "");
  putFx('ph', `<g id="ph" class="vib" ${hitA("phone","휴대폰")}>${phone(110, 362, { screen:"#cfe0ff", inner:`<text x="0" y="6" text-anchor="middle" font-size="22">₩</text>` })}<rect x="80" y="310" width="60" height="104" fill="transparent"/></g>`);
  sound('zing', '징-', 140, 300, { fs:14 });
  addHits({ phone: { tap: () => payOpen(arrive), key: () => payOpen(arrive) } });
  teach("tap", 110, 362, 0, 0, { key:"pay" });
}
function payOpen(arrive){
  if (!$('ph')) return;
  dropFx('ph', 'zing'); idleKill(); delete HIT.phone;
  putFx('pay', `<g id="pay" class="pop" pointer-events="none"><rect x="0" y="-150" width="${VW}" height="${VH+300}" fill="#0b0d1c" opacity=".45"/>
    <rect x="96" y="80" width="168" height="290" rx="22" fill="#24273f"/><rect x="108" y="102" width="144" height="246" rx="6" fill="#fff"/>
    <text x="180" y="150" text-anchor="middle" font-size="16" fill="#64688c">급여 입금</text>
    <text x="180" y="200" text-anchor="middle" font-size="24" fill="#2f9e6a">첫 월급</text>
    <path d="M128,226 h104" stroke="#d6dbef" stroke-width="4"/></g>`);
  later(1900, () => { dropFx('pay'); OF.mePose = "cheer"; OF.meFace = "happy"; part('me', ofMe()); });
  later(3300, () => { OF.mePose = "stand"; part('me', ofMe()); ofToSix(arrive); });
}

/* ================= 엔딩: 좋고 나쁨이 아니라 균형의 모양 ================= */
const ENDINGS = {
  lost:   { t:"나를 잃은 열이틀" }, far: { t:"닿지 않는 문" }, hotteok:{ t:"호떡이 친구" },
  night:  { t:"밤의 사람" }, morning:{ t:"아침의 사람" }, evening:{ t:"저녁의 사람" },
  hoodie: { t:"후드티의 사람" }, all: { t:"모든 시간의 사람" }
};
const TOTAL_ENDINGS = Object.keys(ENDINGS).length;
function tally(){ let n = 0, m = 0, e = 0; for (let d=0; d<=12; d++){ const L = s.log[d]; if (!L) continue; if (L.open) n++; if (L.pet) m++; if (L.play) e++; } return { n, m, e }; }
function endingKey(){
  const { n, m, e } = tally();
  if (s.face <= 0 || s.lates >= 5) return "lost";
  if (s.bond <= 1) return "far";
  if (n >= 3 && m >= 3 && e >= 3 && s.lates <= 2) return "all";
  if (s.bossCat && s.bond >= 7 && s.meet === "good") return "hotteok";
  if (s.hoodie === "door" && n <= 3) return "hoodie";
  const best = Math.max(n, m, e);
  return best === n ? "night" : best === m ? "morning" : "evening";
}
function endingLines(k){
  const { n, m, e } = tally();
  return {
    lost:   ["수습 기간이 연장됐다.", n >= 6 ? `${CATe()} 매일 밤 옆에 있었다.` : `${CATe()} 매일 밤 문 앞에 있었다.`],
    far:    ["이름을 불렀다.", "거실 어딘가에서, 아주 작게 대답했다."],
    hotteok:["사장님께 보낼 사진을 고른다.", `호떡이랑 ${CAT}, 같은 색.`],
    night:  [`같이 잔 밤 ${n}번.`, "아침은 늘 조금 늦었다."],
    morning:[`나가기 전 쓰다듬은 아침 ${m}번.`, "문 앞에서 꼬리가 흔들렸다."],
    evening:[`같이 논 저녁 ${e}번.`, "낚싯대 끝이 다 닳았다."],
    hoodie: ["문은 닫혀 있다.", `문 앞의 후드티 위에서, ${CATi()} 잔다.`],
    all:    ["밤에도, 아침에도, 저녁에도.", "피곤하지만, 나쁘지 않다."]
  }[k];
}
function ending(){
  const k = endingKey(); saveFound(k);
  const open = s.finalOpen;
  let pic;
  if (open){
    pic = `${wallR("#363b63", 0, 300)}${floorBand(300, "#2a2d4c", "#22243d")}${win(20, 46, 90, 90, "night", { curtain:"#5c6290" })}
      ${doorIn(ND.x, ND.y, ND.w, ND.h, 1, { beyond:"#141629" })}
      <rect x="0" y="292" width="20" height="160" rx="4" fill="var(--wood-d)"/><rect x="16" y="382" width="250" height="64" rx="8" fill="var(--sheet)"/><rect x="16" y="430" width="250" height="40" fill="var(--wood)"/>
      <ellipse cx="62" cy="372" rx="48" ry="17" fill="#fff" stroke="#d6d9ea" stroke-width="2"/>
      <g transform="translate(62,352) scale(1.15) translate(0,168)">${headG({ face:"sleep" })}</g>
      <path d="M86,378 Q175,360 264,388 V446 H86 Z" fill="${s.hoodie === 'wear' ? 'var(--hoodie)' : 'var(--blanket)'}"/>
      ${k === "far" ? "" : catLoaf(146, 384, 1.05, { zz:true })}`;
  } else {
    pic = `${catWorldBg()}${bigDresser({ sleeve: s.hoodie == null })}${bigDoor({ gap:"dark", hoodie: s.hoodie === "door" })}
      ${k === "far" ? `<g transform="translate(40,470) scale(1.2)">${catLoaf(0, 0, 1, { zz:true })}</g>` : `<g transform="translate(222,420) scale(1.5)">${catLoaf(0, 0, 1, { zz:true })}</g>`}`;
  }
  const strip = Array.from({ length:13 }, (_, i) => `<div>${stripIcon(s.log[i])}<span>${i === 0 ? "전" : i}</span></div>`).join('');
  show(pic, { flat:true, label:"엔딩", below: `
    <p class="ending-title">${ENDINGS[k].t}</p>
    ${endingLines(k).map(t => `<p class="end-line">${t}</p>`).join('')}
    <div class="strip" aria-label="열이틀의 기록">${strip}</div>
    <p class="quiet">처음 문을 닫던 밤과 마지막 밤. 같은 문이었다.</p>
    <button class="wide" id="again">처음부터</button>
    ${foundLine()}` });
  $('again').onclick = goTitle;
}
function getFound(){ try { return JSON.parse(localStorage.getItem('catgame5-found') || '[]'); } catch(e){ return []; } }
function saveFound(k){ try { const f = getFound(); if (!f.includes(k)){ f.push(k); localStorage.setItem('catgame5-found', JSON.stringify(f)); } } catch(e){} }
function foundLine(){ const f = getFound(); return f.length ? `<p class="found">찾은 엔딩 ${f.length} / ${TOTAL_ENDINGS}</p>` : ''; }

goTitle();
</script>

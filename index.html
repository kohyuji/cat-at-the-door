<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat at the Door</title>
<style>
@font-face{font-family:'DungGeunMo';src:url(fonts/DungGeunMo.woff) format('woff');font-weight:400;font-style:normal;font-display:block}
:root{
  --bg:#e7eaf6; --surface:#ffffff; --ink:#24273f; --muted:#64688c;
  --lamp:#c4870f; --door:#c9b59a; --door-edge:#8f7a62; --gap:#f6d77e; --paw:#3a3045;
  --line:#cfd3e8; --bad:#b2433b; --good:#3f7d5c;
  --wall:#d9ddef; --floor:#c3c8e0; --sky:#4b5287; --moon:#fbe7a1;
  --fur:#e9a35c; --fur-dark:#b9732f; --skin:#f2cfae; --hair:#3b2f2f; --suit:#2f3350;
  --blanket:#8fa3d9; --sheet:#f4f1fa; --bowl:#7d8fd1; --kibble:#a9703c; --shirt:#ffffff;
  --hoodie:#a3a8bd; --shade:#0d0f1f;
  --cat:#d9822b; --cat-bg:#fbeedd; --life:#3d6fc4; --life-bg:#e3ecfb;
  --warm:#f3c48a; --day:#f4f0e2; --sun:#ffe9a8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7;
    --lamp:#f3c969; --door:#6b5a4c; --door-edge:#443930; --gap:#f3c969; --paw:#151321;
    --line:#3a3f62; --bad:#ef8a80; --good:#8fd1aa;
    --wall:#2b2f4d; --floor:#23263f; --sky:#141629; --moon:#f3dc8f;
    --blanket:#4f5f99; --sheet:#c9c6d9; --suit:#151729; --shirt:#d9d6e8;
    --hoodie:#6f7494; --shade:#05060d;
    --cat:#f0a65a; --cat-bg:#3a2e26; --life:#7ea6ec; --life-bg:#253252;
    --warm:#8a6a45; --day:#3a3d58; --sun:#d9c27a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7;
  --lamp:#f3c969; --door:#6b5a4c; --door-edge:#443930; --gap:#f3c969; --paw:#151321;
  --line:#3a3f62; --bad:#ef8a80; --good:#8fd1aa;
  --wall:#2b2f4d; --floor:#23263f; --sky:#141629; --moon:#f3dc8f;
  --blanket:#4f5f99; --sheet:#c9c6d9; --suit:#151729; --shirt:#d9d6e8;
  --hoodie:#6f7494; --shade:#05060d;
  --cat:#f0a65a; --cat-bg:#3a2e26; --life:#7ea6ec; --life-bg:#253252;
  --warm:#8a6a45; --day:#3a3d58; --sun:#d9c27a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DungGeunMo',monospace;line-height:1.7;font-size:18px;-webkit-font-smoothing:none;font-synthesis:none}
main{max-width:34rem;margin:0 auto;padding:1rem 16px 3rem}
.top{display:flex;justify-content:space-between;align-items:center;font-size:15px;color:var(--muted);min-height:2.2rem;gap:.5rem}
.hud{display:flex;gap:.8rem;align-items:center}
.hud span{display:flex;align-items:center;gap:.25rem}
.batt{display:inline-flex;gap:2px;border:1.5px solid var(--muted);border-radius:3px;padding:2px}
.batt i{display:block;width:5px;height:9px;background:var(--good)}
.batt i.off{background:transparent}
.batt.low i{background:var(--bad)}
.batt i.off,.batt.low i.off{background:transparent}
.scene{position:relative;margin:.6rem 0 1rem;border-radius:1.2rem;overflow:hidden;border:1.5px solid var(--line);background:var(--wall);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.scene svg{display:block;width:100%;height:auto}
.scene text{font-family:'DungGeunMo',monospace}
.scene .hit{cursor:pointer}
.scene .hit:hover .glow,.scene .hit:focus .glow{opacity:.9}
.glow{opacity:.45;transition:opacity .2s}
.line{text-align:center;margin:.2rem 0 .4rem;min-height:1.7em}
.line.quiet{color:var(--muted);font-size:15px}
.picks{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-top:.8rem}
.picks.one{grid-template-columns:1fr}
.picks.three{grid-template-columns:1fr 1fr 1fr}
button{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:.9rem;padding:.8rem .9rem;cursor:pointer;text-align:center;line-height:1.4}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
button small{display:block;color:var(--muted);font-size:13px}
.pick{display:flex;flex-direction:column;align-items:center;gap:.2rem}
.pick .ic{font-size:22px;line-height:1}
.pick.cat{border-color:var(--cat);background:var(--cat-bg)}
.pick.life{border-color:var(--life);background:var(--life-bg)}
.pick.cat:hover:not(:disabled){box-shadow:0 0 0 3px var(--cat)}
.pick.life:hover:not(:disabled){box-shadow:0 0 0 3px var(--life)}
.next{width:100%;margin-top:.8rem}
h1{font-size:34px;line-height:1.3;font-weight:400;margin:1.2rem 0 .2rem;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 1rem;font-size:16px}
.names{display:flex;flex-direction:column;gap:.6rem;margin-top:1rem}
.names label{display:flex;flex-direction:column;gap:.3rem;font-size:14px;color:var(--muted)}
.names input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.6rem;padding:.6rem .9rem}
.legend{display:flex;justify-content:center;gap:1rem;font-size:14px;color:var(--muted);margin:.4rem 0}
.legend b{font-weight:400}
.legend .c{color:var(--cat)} .legend .l{color:var(--life)}
.ending-title{font-size:28px;text-align:center;margin:.6rem 0 .2rem}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:1rem 0}
.strip div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.strip svg{width:100%;height:auto;display:block}
.found{color:var(--muted);font-size:14px;text-align:center;margin-top:1.2rem}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:.6rem}
.slot{display:flex;flex-direction:column;align-items:center;gap:.2rem;min-height:5.2rem;justify-content:center}
.slot.cat{border-color:var(--cat);background:var(--cat-bg)}
.slot.life{border-color:var(--life);background:var(--life-bg)}
.slot .ic{font-size:22px}
.roll-left{font-size:15px;color:var(--muted);text-align:center;margin:-.5rem 0 0;min-height:1.7em}
.suit .strand{transition:opacity .25s ease}
.suit .strand.gone{opacity:0}
.shade{position:absolute;inset:0;background:var(--shade);opacity:0;pointer-events:none}
.shade.on{transition:opacity var(--hes,3s) ease-in;opacity:.85}
.fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rain line{animation:rain .8s linear infinite}
@keyframes rain{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
.snow circle{animation:snow 3s linear infinite}
@keyframes snow{from{transform:translateY(-8px)}to{transform:translateY(14px)}}
.mover{transition:transform .9s ease-in-out}
.heart{animation:heart 1s ease-out forwards}
@keyframes heart{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-22px)}}
.jump{animation:jump .45s ease-out}
@keyframes jump{50%{transform:translateY(-26px)}}
.blur svg{filter:blur(1.2px)}
.blur2 svg{filter:blur(2.2px)}
.late{color:var(--bad)}
.flash{animation:flash 1.8s ease forwards}
@keyframes flash{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.fade,.wag,.blink,.rain line,.snow circle,.heart,.jump,.flash{animation:none}.mover,.shade.on,.suit .strand{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>

/* ================= drawing kit ================= */
const V = (body, h=200) => `<svg viewBox="0 0 320 ${h}" role="img">${body}</svg>`;

// 앉은 고양이 (정면)
function catSit(x, y, sc=1, opts={}){
  const eyes = opts.closed
    ? `<path d="M-8,-45 q3,3 6,0 M2,-45 q3,3 6,0" stroke="var(--paw)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="-5" cy="-45" rx="2.2" ry="3" fill="var(--paw)"/><ellipse cx="5" cy="-45" rx="2.2" ry="3" fill="var(--paw)"/>`;
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <path class="${opts.wag?'wag':''}" d="M14,-6 q26,-2 18,-30" stroke="var(--fur)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-18" rx="18" ry="20" fill="var(--fur)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="12" fill="var(--sheet)" opacity=".9"/>
    <polygon points="-13,-50 -8,-67 -1,-56" fill="var(--fur)"/><polygon points="13,-50 8,-67 1,-56" fill="var(--fur)"/>
    <circle cx="0" cy="-44" r="14" fill="var(--fur)"/>
    <path d="M-6,-55 l2,5 M0,-57 l0,5 M6,-55 l-2,5" stroke="var(--fur-dark)" stroke-width="1.6" stroke-linecap="round"/>
    ${eyes}
    <path d="M-1.5,-40 h3 l-1.5,2 z" fill="var(--bad)"/>
    <ellipse cx="-6" cy="-1" rx="5" ry="3" fill="var(--sheet)"/><ellipse cx="6" cy="-1" rx="5" ry="3" fill="var(--sheet)"/>
  </g>`;
}
// 뒤돌아 앉은 고양이
function catAway(x, y, sc=1){
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <ellipse cx="0" cy="-18" rx="18" ry="20" fill="var(--fur)"/>
    <path d="M-6,-30 q6,4 12,0 M-8,-22 q8,4 16,0" stroke="var(--fur-dark)" stroke-width="2" fill="none"/>
    <polygon points="-13,-50 -8,-67 -1,-56" fill="var(--fur)"/><polygon points="13,-50 8,-67 1,-56" fill="var(--fur)"/>
    <circle cx="0" cy="-44" r="14" fill="var(--fur)"/>
    <path d="M-14,-2 q-24,4 -20,-18" stroke="var(--fur)" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>`;
}
// 식빵 자세로 자는 고양이
function catLoaf(x, y, sc=1){
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <ellipse cx="0" cy="-12" rx="26" ry="14" fill="var(--fur)"/>
    <path d="M-6,-20 q4,3 8,0 M4,-22 q4,3 8,0" stroke="var(--fur-dark)" stroke-width="1.8" fill="none"/>
    <polygon points="12,-30 16,-44 22,-32" fill="var(--fur)"/><polygon points="28,-30 30,-44 36,-30" fill="var(--fur)"/>
    <circle cx="24" cy="-22" r="12" fill="var(--fur)"/>
    <path d="M17,-23 q3,2 5,0 M26,-23 q3,2 5,0" stroke="var(--paw)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-24,-6 q-6,6 6,6 h20" stroke="var(--fur-dark)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="40" y="-38" font-size="13" fill="var(--muted)">z z</text>
  </g>`;
}
// 사람 (기본은 정장, hoodie면 회색 후드티)
function person(x, y, opts={}){
  const face = opts.face || "neutral";
  const mouth = face==="sad" ? `<path d="M-5,-62 q5,-4 10,0" stroke="var(--paw)" stroke-width="1.8" fill="none"/>`
    : face==="happy" ? `<path d="M-5,-64 q5,5 10,0" stroke="var(--paw)" stroke-width="1.8" fill="none"/>`
    : `<path d="M-4,-63 h8" stroke="var(--paw)" stroke-width="1.8"/>`;
  let fur = "";
  const n = opts.fur || 0;
  for (let i=0;i<n;i++){
    const fx = -14 + ((i*37)%28), fy = -46 + ((i*23)%40);
    fur += `<path d="M${fx},${fy} l4,${(i%2?2:-2)}" stroke="var(--fur)" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const body = opts.body || (opts.hoodie ? "var(--hoodie)" : "var(--suit)");
  const collar = opts.hoodie
    ? `<path d="M-12,-50 q12,9 24,0" stroke="var(--line)" stroke-width="3" fill="none"/><path d="M-3,-46 v9 M3,-46 v9" stroke="var(--sheet)" stroke-width="1.5"/>`
    : `<polygon points="-5,-50 0,-38 5,-50" fill="var(--shirt)"/>`;
  const sparkle = opts.sparkle ? `<text x="18" y="-60" font-size="16" fill="var(--lamp)">★</text><text x="-30" y="-30" font-size="11" fill="var(--lamp)">★</text>` : "";
  return `<g transform="translate(${x},${y})">
    <rect x="-9" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/><rect x="2" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/>
    <rect x="-17" y="-50" width="34" height="44" rx="9" fill="${body}"/>
    ${collar}
    ${fur}
    <circle cx="0" cy="-68" r="14" fill="var(--skin)"/>
    <path d="M-14,-70 q2,-16 14,-14 q12,-2 14,14 q-8,-8 -28,0" fill="var(--hair)"/>
    <circle cx="-5" cy="-68" r="1.6" fill="var(--paw)"/><circle cx="5" cy="-68" r="1.6" fill="var(--paw)"/>
    ${mouth}
    ${opts.roller ? roller(22,-28,.6) : ""}
    ${sparkle}
  </g>`;
}
// 팀장님
function boss(x, y, mood){
  const mouth = mood==="angry" ? `<path d="M-5,-62 q5,-5 10,0" stroke="var(--paw)" stroke-width="2" fill="none"/>`
    : mood==="sigh" ? `<ellipse cx="0" cy="-62" rx="3" ry="2" fill="var(--paw)"/>`
    : `<path d="M-6,-64 q6,6 12,0" stroke="var(--paw)" stroke-width="2" fill="none"/>`;
  const brows = mood==="angry" ? `<path d="M-9,-75 l6,3 M9,-75 l-6,3" stroke="var(--paw)" stroke-width="2"/>` : "";
  return `<g transform="translate(${x},${y})">
    <rect x="-20" y="-50" width="40" height="50" rx="10" fill="var(--muted)"/>
    <polygon points="-3,-50 0,-30 3,-50" fill="var(--bad)"/>
    <circle cx="0" cy="-68" r="15" fill="var(--skin)"/>
    <path d="M-15,-72 q15,-18 30,0" fill="var(--paw)" opacity=".75"/>
    <circle cx="-5" cy="-68" r="1.7" fill="var(--paw)"/><circle cx="5" cy="-68" r="1.7" fill="var(--paw)"/>
    ${brows}${mouth}
  </g>`;
}
// 사장님 (안경, 흰머리, 휴대폰 속 치즈 고양이)
function ceo(x, y, phone){
  return `<g transform="translate(${x},${y})">
    <rect x="-9" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/><rect x="2" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/>
    <rect x="-19" y="-52" width="38" height="46" rx="10" fill="var(--door-edge)"/>
    <polygon points="-5,-52 0,-40 5,-52" fill="var(--shirt)"/>
    <rect x="-1.5" y="-46" width="3" height="14" fill="var(--good)"/>
    <circle cx="0" cy="-70" r="14" fill="var(--skin)"/>
    <path d="M-14,-72 q2,-14 14,-13 q12,-1 14,13 q-4,-6 -14,-7 q-10,1 -14,7" fill="var(--line)"/>
    <circle cx="-5" cy="-69" r="3.6" fill="none" stroke="var(--paw)" stroke-width="1.4"/><circle cx="5" cy="-69" r="3.6" fill="none" stroke="var(--paw)" stroke-width="1.4"/>
    <circle cx="-5" cy="-69" r="1.2" fill="var(--paw)"/><circle cx="5" cy="-69" r="1.2" fill="var(--paw)"/>
    <path d="M-5,-61 q5,4 10,0" stroke="var(--paw)" stroke-width="1.8" fill="none"/>
    ${phone ? `<line x1="14" y1="-40" x2="26" y2="-56" stroke="var(--door-edge)" stroke-width="6" stroke-linecap="round"/>
      <rect x="20" y="-84" width="20" height="30" rx="3" fill="var(--paw)"/><rect x="22" y="-81" width="16" height="24" rx="1" fill="var(--surface)"/>
      <circle cx="30" cy="-67" r="5" fill="var(--fur)"/><polygon points="25.5,-69 26.5,-75 29,-71" fill="var(--fur)"/><polygon points="34.5,-69 33.5,-75 31,-71" fill="var(--fur)"/>` : ""}
  </g>`;
}
function roller(x, y, sc=1){
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <rect x="-6" y="0" width="8" height="30" rx="3" fill="var(--muted)"/>
    <rect x="-22" y="-26" width="40" height="28" rx="12" fill="var(--sheet)" stroke="var(--line)" stroke-width="2"/>
    <path d="M-14,-22 v20 M-4,-22 v20 M6,-22 v20" stroke="var(--line)" stroke-width="1.5"/>
  </g>`;
}
function bowl(x, y, full, premium){
  return `<g transform="translate(${x},${y})">
    ${full?`<ellipse cx="0" cy="-12" rx="20" ry="6" fill="var(--kibble)"/><circle cx="-8" cy="-15" r="2.5" fill="var(--kibble)"/><circle cx="4" cy="-16" r="2.5" fill="var(--kibble)"/>`:""}
    <path d="M-24,-12 h48 l-6,12 h-36 z" fill="var(--bowl)"/>
    ${premium?`<text x="18" y="-22" font-size="15" fill="var(--lamp)">★</text>`:""}
    ${!full?`<text x="-12" y="-20" font-size="14" fill="var(--muted)">텅…</text>`:""}
  </g>`;
}
// 문틈으로 밀려 들어온 쥐 인형들
function toys(n){
  const col = ["var(--muted)","var(--bowl)","var(--lamp)"];
  let g = "";
  for (let i=0;i<Math.min(n,5);i++){
    const c = col[i%3], x = 226 + i*13, y = 191 + (i%2)*5;
    g += `<g transform="translate(${x},${y})"><ellipse cx="0" cy="-3" rx="6" ry="3.5" fill="${c}"/><circle cx="5" cy="-6" r="2" fill="${c}"/><path d="M-6,-3 q-5,-1 -7,3" stroke="${c}" stroke-width="1.4" fill="none"/></g>`;
  }
  return g;
}
const foodBag = (x, y, fav) => `<g transform="translate(${x},${y})"><path d="M-12,0 h24 l-2,-24 h-20 z" fill="var(--lamp)"/><rect x="-10" y="-28" width="20" height="5" rx="2" fill="var(--door-edge)"/>${fav?`<text x="-6" y="-8" font-size="11" fill="var(--paw)">★</text>`:`<circle cx="0" cy="-12" r="4" fill="var(--paw)" opacity=".5"/>`}</g>`;
const floor = (y=178) => `<rect x="0" y="${y}" width="320" height="${200-y}" fill="var(--floor)"/>`;

/* ================= 방 ================= */
function roomBg(rainy){
  const rain = rainy ? `<g class="rain">${[0,1,2,3,4,5].map(i=>`<line x1="${30+i*11}" y1="${42+(i%2)*10}" x2="${27+i*11}" y2="${52+(i%2)*10}" stroke="var(--sheet)" stroke-width="1.5" opacity=".7"/>`).join('')}</g>` : "";
  return `<rect width="320" height="200" fill="var(--wall)"/>
    <rect x="22" y="28" width="74" height="58" rx="4" fill="var(--sky)" stroke="var(--door-edge)" stroke-width="3"/>
    ${rainy?"":`<circle cx="74" cy="48" r="11" fill="var(--moon)"/><circle cx="80" cy="44" r="10" fill="var(--sky)"/><text x="36" y="48" font-size="10" fill="var(--moon)">★</text>`}
    ${rain}
    <line x1="59" y1="28" x2="59" y2="86" stroke="var(--door-edge)" stroke-width="2"/>
    ${floor()}
    <rect x="14" y="118" width="150" height="50" rx="8" fill="var(--sheet)"/>
    <rect x="14" y="108" width="14" height="62" rx="4" fill="var(--door-edge)"/>
    <ellipse cx="46" cy="122" rx="18" ry="9" fill="var(--sheet)" stroke="var(--line)" stroke-width="2"/>
    <circle cx="48" cy="114" r="10" fill="var(--skin)"/><path d="M38,112 q10,-14 20,0" fill="var(--hair)"/>
    <path d="M44,116 q2,2 4,0 M51,116 q2,2 4,0" stroke="var(--paw)" stroke-width="1.4" fill="none"/>
    <path d="M58,120 q50,-14 106,0 v38 h-106 z" fill="var(--blanket)"/>`;
}
function doorClosed(pawOp, dim){
  return `<rect x="216" y="44" width="74" height="132" rx="3" fill="var(--door)" stroke="var(--door-edge)" stroke-width="3"/>
    <circle cx="279" cy="114" r="4.5" fill="var(--lamp)"/>
    <rect x="216" y="175" width="74" height="4" fill="var(--gap)" opacity="${dim?.35:1}"/>
    ${s.hoodie?`<rect x="242" y="176" width="30" height="4" rx="2" fill="var(--hoodie)"/>`:""}
    <g fill="var(--paw)" opacity="${pawOp}"><ellipse cx="243" cy="178" rx="7" ry="3"/><ellipse cx="261" cy="178" rx="7" ry="3"/></g>`;
}

function suitStrands(n){
  let seed = s.day * 97 + s.slept * 13 + 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const zones = [[102,140,60,184],[180,218,60,184],[142,178,122,184],[64,94,92,182],[226,256,92,182]];
  const pickZone = [0,1,2,0,1,3,4];
  const out = [];
  for (let i=0;i<n;i++){
    const z = zones[pickZone[i % pickZone.length]];
    out.push({ x:Math.round(z[0] + rnd()*(z[1]-z[0])), y:Math.round(z[2] + rnd()*(z[3]-z[2])), a:Math.round(rnd()*170), on:true });
  }
  return out;
}

  if (!RL) return "";
  if (RL.left === 0) return "정장이 다시 까매졌다.";

  return `남은 털 ${RL.left}가닥${RL.left === RL.total ? " · 정장을 누른 채로 문지르기" : ""}`;

function takeStrand(i){
  const t = RL.strands[i];
  if (!t.on) return;
  t.on = false; RL.left--;
  const el = dom("st"+i); if (el) el.classList.add("gone");
  const fur = dom("rlfur");
  if (fur && RL.total - RL.left <= 14){
    const k = RL.total - RL.left, fx = -20 + (k*11) % 40, fy = -5 + (k*7) % 10;
    fur.insertAdjacentHTML("beforeend", `<path d="M${fx},${fy} l5,${k%2?2:-2}" stroke="var(--fur)" stroke-width="2.2" stroke-linecap="round"/>`);
  }

  rollUpdate();
}
// 돌돌이가 a에서 b로 지나간 자리의 털을 뗀다
function sweep(a, b){
  const d = Math.hypot(b.x-a.x, b.y-a.y), steps = Math.max(1, Math.ceil(d/4));
  for (let k=0;k<=steps;k++){
    const x = a.x + (b.x-a.x)*k/steps, y = a.y + (b.y-a.y)*k/steps;
    RL.strands.forEach((t,i)=>{ if (t.on && Math.abs(t.x-x) < 27 && Math.abs(t.y-y) < 12) takeStrand(i); });
  }
}
function showRoller(p){
  const g = dom("rl"); if (!g) return;
  g.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);

}
// 키보드(또는 테스트): 위에서부터 한 줄씩 민다
function rollBand(){
  if (!RL || RL.left === 0) return 0;
  const per = Math.ceil(RL.total / 5);
  const rest = RL.strands.map((t,i)=>[t,i]).filter(([t])=>t.on).sort((p,q)=>p[0].y-q[0].y).slice(0, per);
  rest.forEach(([,i])=>takeStrand(i));
  showRoller({ x:160, y:rest.length ? rest[rest.length-1][0].y : 120 });
  return RL.left;
}
function bindSuit(){
  const el = dom("suit");
  if (!el || !el.addEventListener) return;
  const svg = el.querySelector("svg");
  let down = false, last = null;
  const at = e => { const r = svg.getBoundingClientRect(); return { x:(e.clientX-r.left)*320/r.width, y:(e.clientY-r.top)*200/r.height }; };
  el.addEventListener("pointerdown", e => { down = true; last = at(e); try { el.setPointerCapture(e.pointerId); } catch(_){} showRoller(last); sweep(last, last); });
  el.addEventListener("pointermove", e => { const p = at(e); showRoller(p); if (down){ sweep(last, p); last = p; } });
  const up = () => { down = false; last = null; };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
  el.addEventListener("keydown", e => { if (e.key === " " || e.key === "Enter"){ e.preventDefault(); rollBand(); } });
  el.focus({preventScroll:true});
}

/* ================= 공통 입력 ================= */
function bindTap(id, fn){
  const el = document.getElementById(id); if (!el) return;
  el.addEventListener('click', e => { e.stopPropagation(); fn(); });
}
// 문지르기: 누른 채로 움직인 거리만큼 fn을 부른다
function bindRub(id, fn){
  const el = document.getElementById(id); if (!el) return;
  let down = false, acc = 0, last = null;
  el.addEventListener('pointerdown', e => { down = true; last = [e.clientX, e.clientY]; try{ el.setPointerCapture(e.pointerId); }catch(_){} });
  el.addEventListener('pointermove', e => { if (!down) return; acc += Math.hypot(e.clientX-last[0], e.clientY-last[1]); last = [e.clientX, e.clientY]; if (acc > 40){ acc = 0; fn(); } });
  const up = () => { down = false; }; el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  el.addEventListener('click', () => fn());
}
// 끌기: progress(p0,p)가 1이 되면 done
function bindDrag(id, progress, onMove, done, accept){
  const box = document.getElementById(id); if (!box) return;
  const svg = box.querySelector('svg');
  let p0 = null, fin = false;
  box.addEventListener('pointerdown', e => { const p = svgPoint(svg, e); if (accept && !accept(p)) return; p0 = p; try{ box.setPointerCapture(e.pointerId); }catch(_){} });
  box.addEventListener('pointermove', e => { if (!p0 || fin) return; const v = clamp(progress(p0, svgPoint(svg,e)),0,1); onMove(v); if (v >= 1){ fin = true; done(); } });
  const up = () => { if (!fin && p0) onMove(0); p0 = null; };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
}

function clockText(){ const m = Math.floor(MO.min); return `${String(7+Math.floor((45+m)/60)).padStart(2,'0')}:${String((45+m)%60).padStart(2,'0')}`; }
function startClock(onTick){
  CLK = { iv: setInterval(()=>{
    if (!MO) return;
    MO.min += (MO.petting ? 3 : 1) * 0.25;
    if (MO.min >= 20 && !MO.late){ MO.late = true; }
    const c = document.getElementById('clk'); if (c){ c.textContent = clockText(); if (MO.late) c.setAttribute('fill','#ff8a7a'); }
    if (onTick) onTick();
  }, 250 * SPEED) };
}
function morning(){
  MO = { min:0, items:{}, cat: catHere() ? "here" : (s.bond >= 2 ? "hide" : "none"), petting:false, pet:0, late:false, taps:{} };
  const label = dayLabel();
  const blur = s.tired >= 3 ? "blur2" : s.tired >= 2 ? "blur" : "";
  render(`${hud(label)}${scene(morningScene(), "sc", blur)}
    ${line(MO.cat==="none" ? "배웅이 없다" : "", true)}
    <div class="picks">
      ${pickLife("dressNext()","옷 입기","셔츠 → 정장 → 가방","dl")}
      ${MO.cat!=="none" ? pickCat("petTap()","쓰다듬기","꾹 누르면 시간이 빨리 간다","dc") : `<button class="pick" disabled>…</button>`}
    </div>
    ${nextBtn("leaveHome()","출근","nx",true)}`);
  bindMorning();
  startClock();
}
function bindMorning(){
  ["shirt","jacket","bag"].forEach(k => bindTap('it-'+k, ()=>dress(k)));
  const c = document.getElementById('cat');
  if (c){
    c.addEventListener('pointerdown', e => { e.preventDefault(); MO.petting = true; petTick(); });
    const up = () => { MO.petting = false; }; c.addEventListener('pointerup', up); c.addEventListener('pointerleave', up); c.addEventListener('pointercancel', up);
  }
}
const ORDER = ["shirt","jacket","bag"];
function dressNext(){ const k = ORDER.find(x=>!MO.items[x]); if (k) dress(k); }
function dress(k){
  if (!MO || MO.items[k]) return;
  // 피곤하면 손이 느리다: 같은 옷을 두세 번 눌러야 입혀진다
  const need = 1 + (s.tired >= 2 ? 1 : 0) + (s.tired >= 3 ? 1 : 0);
  MO.taps[k] = (MO.taps[k]||0) + 1;
  if (MO.taps[k] < need){ setLine("…손이 느리다"); return; }
  MO.items[k] = true;
  redrawMorning();
  if (ORDER.every(x=>MO.items[x])){ setLine(""); document.getElementById('dl').disabled = true; readyToLeave(); }
}
function petTap(){ if (!MO || MO.cat==="none") return; MO.pet++; petEffect(); }
function petTick(){ if (!MO || !MO.petting) return; MO.pet++; petEffect(); later(400, petTick); }
function petEffect(){
  if (MO.cat === "hide"){ MO.cat = "here"; redrawMorning(); setLine(`${CATi()} 나왔다`); return; }
  const svg = document.querySelector('#sc svg'); if (svg) hearts(svg, 200 + (MO.pet%3)*6, 140);
  if (MO.pet === 3){ setLine("골골골"); }
  if (!MO.petting) MO.min += 0.75;
}
function redrawMorning(){ const box = document.getElementById('sc'); box.innerHTML = morningScene(); bindMorning(); }
function readyToLeave(){ document.getElementById('nx').disabled = false; }
function leaveHome(){
  const L = dayLog();
  if (MO.pet >= 3){ L.pet = true; bond(1); }
  // 털: 문을 연 밤이나 옷장에서 잔 밤엔 정장에 털이 있다
  if (s.fur > 0 && !MO.rolled) return rollerMorning();
  finishMorning();
}
function finishMorning(){
  const L = dayLog();
  if (MO.late){ L.late = true; s.lates++; s.face = clamp(s.face - 1, 0, 5); }
  clearTimers(); MO.done = true;
  office();
}
/* ---- 돌돌이: 1~2막은 다 떼야 나간다, 3막엔 "이 정도면 돼" ---- */
function rollerMorning(){
  const n = s.fur;
  RL = { strands:suitStrands(n), left:n, total:n };
  const third = ACT(s.day) === 3;
  render(`${hud(dayLabel())}
    <div class="scene suit" id="suit" tabindex="0" role="button" aria-label="정장. 누른 채로 문지르면 털이 떨어진다. 키보드는 스페이스." aria-describedby="rollLeft">${sceneSuit()}</div>
    <p class="roll-left" id="rollLeft" aria-live="polite">${rollLeftText()}</p>
    <p class="line" style="font-size:15px">${wallClockInline()}</p>
    <div class="picks ${third?'':'one'}">

      ${third ? pickCat("rollEnough()","이 정도면 돼","몇 가닥쯤은","rollEnough") : ""}
    </div>`);
  document.getElementById('rollDone').disabled = true;

}
function wallClockInline(){ return `<span id="clk" style="color:${MO.late?'var(--bad)':'var(--lamp)'}">${clockText()}</span>`; }
function rollUpdate(){
  if (!RL) return;
  const b = dom("rollDone"); if (b && RL.left === 0) b.disabled = false;
  const e = dom("rollEnough"); if (e && RL.left <= 4) e.disabled = false;
}
function rollDone(){ if (!RL || RL.left > 0) return; RL = null; s.fur = 0; MO.rolled = true; finishMorning(); }
function rollEnough(){ if (!RL) return; s.furLeft = RL.left; RL = null; s.fur = 0; MO.rolled = true; finishMorning(); }

  setLine({curtain:"없다", bed:"없다", desk:"없다"}[k]);
}
// 옷장 맨 아래, 후드티 위. 대사 없이 그 시절이 한 컷 스친다.
function foundBori(){
  SR.found = true; s.found9 = true; bond(2); clearTimers();
  if (MO.min >= 20) MO.late = true;
  document.getElementById('sc').innerHTML = V(`<rect width="320" height="200" fill="var(--day)"/>${floor()}${wardrobe()}
    ${hoodieFolded(166,150,56)}${catLoaf(186,156,.75)}`);
  setLine(""); document.querySelector('.picks').innerHTML = "";
  later(1400, ()=>{
    document.getElementById('sc').insertAdjacentHTML('beforeend', `<div class="shade on" style="background:var(--warm);opacity:0;transition:opacity .6s" id="fl"></div>`);
    const f = document.getElementById('fl'); requestAnimationFrame(()=>{ f.style.opacity = .55; });
    later(700, ()=>{
      document.getElementById('sc').innerHTML = deskScene(1, 1).replace('fill="var(--wall)"', 'fill="var(--warm)"');
      later(1600, ()=>{
        document.getElementById('sc').innerHTML = V(`<rect width="320" height="200" fill="var(--day)"/>${floor()}${wardrobe()}${hoodieFolded(166,150,56)}${catLoaf(186,156,.75)}`);
        document.querySelector('.picks').outerHTML = nextBtn("meetingGo()","출근");
      });
    });
  });
}
function giveUp(){ s.found9 = false; bond(-2); clearTimers(); meetingGo(); }
function meetingGo(){ const L = dayLog(); if (MO.late || MO.min >= 20){ L.late = true; s.lates++; s.face = clamp(s.face-1,0,5); } office(); }
// 면담: 팀장님의 단 한 번 긴 대사
function meeting(){
  const L = dayLog();
  const good = s.prep >= 3 && s.lates <= 2;
  s.meet = good ? "good" : "watch";
  s.face = clamp(s.face + (good ? 1 : 0), 0, 5);
  const lines = [
    L.late ? "늦었네요." : "앉아요.",
    good ? "과제는 잘 봤어요." : "남은 기간, 지켜볼게요.",
    s.found9 === false ? "…얼굴이 안 좋네." : "",
    "나도 집에 지킬 게 있어서 6시에 가요.",
    "다 잘하는 사람은 없어요. 어디까지 할지 정하는 거지."
  ].filter(Boolean);
  let i = 0;
  const show = () => {
    document.getElementById('sc').innerHTML = V(`<rect width="320" height="200" fill="var(--wall)"/>${floor()}
      <rect x="110" y="128" width="110" height="10" rx="2" fill="var(--door-edge)"/>${crayon(150,108,1.1)}
      ${person(70,178,{face:"neutral"})}${boss(252,178,"smile")}${speech(lines[i], 230)}`);
    const b = document.getElementById('nx');
    if (i === lines.length-1){
      if (s.bossCat) setLine("지나가던 사장님: “호떡도 그래요.”");
      b.textContent = "…"; b.setAttribute('onclick', 'toSix()');
    }
  };
  render(`${hud(dayLabel("면담"))}${scene("")}${line("", true)}${nextBtn("meetNext()","다음")}`);
  window.meetNext = () => { i++; if (i < lines.length) show(); };
  show();
}
// 9일 저녁: 후드티를 꺼낸다 (3막 시작)
function hoodieScene(){
  render(`${hud(dayLabel("저녁"))}
    ${scene(V(`<rect width="320" height="200" fill="var(--wall)"/>${floor()}${wardrobe()}${hoodieFolded(166,150,56)}${person(70,178,{face:"neutral"})}${s.bond>=1?catSit(110,178,.55):""}`))}
    ${line("후드티를 꺼냈다. 어디에 둘까", true)}
    <div class="picks three">
      ${pickCat("putHoodie('door')","문 앞에","")}
      ${pickCat("putHoodie('wear')","입는다","퇴근하고")}
      ${pickCat("putHoodie('bed')","침대 발치","")}
    </div>`);
}
function putHoodie(k){
  s.hoodie = k; s.hoodieDoor = k === "door";
  const pic = k==="door" ? `${roomBg(false)}${doorClosed2(1)}` : k==="wear" ? `<rect width="320" height="200" fill="var(--wall)"/>${floor()}${person(150,178,{hoodie:true,face:"happy"})}${catSit(200,178,.7,{wag:true})}`
    : `${roomBg(false)}${doorClosed2(1)}${hoodieFolded(120,150,40)}`;
  render(`${hud(dayLabel("저녁"))}${scene(V(pic))}${line("", true)}${nextBtn("night()","밤")}`);
}

/* ================= 12일: 월급날 → 마지막 밤 ================= */
function payday(){
  render(`${hud(dayLabel("월급날"))}
    ${scene(V(`<rect width="320" height="200" fill="var(--wall)"/>${floor()}
      <rect x="40" y="30" width="96" height="150" rx="14" fill="var(--paw)"/><rect x="48" y="44" width="80" height="120" rx="6" fill="var(--surface)"/>
      <text x="58" y="78" font-size="13" fill="var(--muted)">급여 입금</text><text x="58" y="108" font-size="22" fill="var(--good)">첫 월급</text>
      ${foodBag(220,170,true)}${person(270,178,{hoodie:s.hoodie==="wear",face:"happy"})}`))}
    ${line("", true)}${nextBtn("night(true)","마지막 밤")}`);
}

/* ================= 엔딩: 굿·배드가 아니라 균형의 모양 ================= */
const ENDINGS = {
  lost:   { t:"나를 잃은 열이틀", c:"var(--bad)" },
  far:    { t:"닿지 않는 문", c:"var(--bad)" },
  hotteok:{ t:"호떡이 친구", c:"var(--lamp)" },
  night:  { t:"밤의 사람", c:"var(--cat)" },
  morning:{ t:"아침의 사람", c:"var(--cat)" },
  evening:{ t:"저녁의 사람", c:"var(--cat)" },
  hoodie: { t:"후드티의 사람", c:"var(--cat)" },
  all:    { t:"모든 시간의 사람", c:"var(--good)" }
};
const TOTAL_ENDINGS = Object.keys(ENDINGS).length;
function tally(){
  let n=0, m=0, e=0;
  for (let d=0; d<=12; d++){ const L = s.log[d]; if (!L) continue; if (L.open) n++; if (L.pet) m++; if (L.play) e++; }
  return { n, m, e };
}
function endingKey(){
  const { n, m, e } = tally();
  if (s.face <= 0 || s.lates >= 5) return "lost";
  if (s.bond <= 1) return "far";
  if (s.bossCat && s.bond >= 7 && s.meet === "good") return "hotteok";
  if (n >= 3 && m >= 3 && e >= 3) return "all";
  if (s.hoodie === "door" && n <= 3) return "hoodie";
  const best = Math.max(n, m, e);
  return best === n ? "night" : best === m ? "morning" : "evening";
}
function endingLines(k){
  const { n, m, e } = tally();
  const L = {
    lost:   ["수습 기간이 연장됐다.", `${CATe()} 매일 밤 내 옆에 있었다.`],
    far:    ["이름을 불렀다.", "거실 어딘가에서 소파가 한 번 삐걱였다."],
    hotteok:["사장님께 보낼 사진을 고른다.", `호떡이랑 ${CAT}, 같은 색.`],
    night:  [`같이 잔 밤 ${n}번.`, "아침은 늘 조금 늦었다."],
    morning:[`출근 전 쓰다듬은 아침 ${m}번.`, "현관에서 꼬리가 흔들렸다."],
    evening:[`같이 논 저녁 ${e}번.`, "낚싯대 끝이 다 닳았다."],
    hoodie: ["문은 닫혀 있다.", `문 앞의 후드티 위에서, ${CATi()} 잔다.`],
    all:    ["밤에도, 아침에도, 저녁에도.", "피곤하지만, 나쁘지 않다."]
  }[k];
  return L;
}
function ending(){
  const k = endingKey(); saveFound(k);
  const E = ENDINGS[k];
  const open = s.finalOpen;
  const pic = open
    ? `${roomBg(false)}${doorOpen()}${k==="far" ? "" : catLoaf(112,127,.6)}${s.hoodie==="bed"?hoodieFolded(120,150,40):""}`
    : `${roomBg(false)}${doorClosed2(k==="far"?0:1)}${s.hoodieDoor && k!=="far" ? catLoaf(244,172,.6) : ""}`;
  const strip = Array.from({length:12},(_,i)=>`<div>${dayIcon(i)}<span>${i===0?"전":i}</span></div>`).join('');
  render(`${hud("엔딩")}${scene(V(pic))}
    <p class="ending-title" style="color:${E.c}">${E.t}</p>
    ${endingLines(k).map(t=>`<p class="line">${t}</p>`).join('')}
    <div class="strip" aria-label="열이틀의 기록">${strip}</div>
    <p class="line quiet">문 · ☀ 아침 · ♪ 저녁 · ! 지각</p>
    <p class="line quiet">처음 문을 닫던 밤과 마지막 밤. 같은 문이었다.</p>
    ${nextBtn("goTitle()","처음부터")}
    ${foundLine()}`);
}
function getFound(){ try{ return JSON.parse(localStorage.getItem('catgame5-found')||'[]'); }catch(e){ return []; } }
function saveFound(k){ try{ const f=getFound(); if(!f.includes(k)){f.push(k); localStorage.setItem('catgame5-found',JSON.stringify(f));} }catch(e){} }
function foundLine(){ const f = getFound(); return f.length ? `<p class="found">찾은 엔딩 ${f.length} / ${TOTAL_ENDINGS}</p>` : ''; }
goTitle();
</script>

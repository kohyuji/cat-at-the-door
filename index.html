<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cat at the Door</title>
<link rel="stylesheet" href="src/life.css?v=936310d70d8c">
</head>
<body>
<main id="app">
  <section id="titleScreen" class="title-screen">
    <canvas id="titleCanvas" width="640" height="360" aria-hidden="true"></canvas>
    <div class="title-card">
      <h1>Cat at the Door</h1>
      <p class="subtitle">내 한 몸 건사하기도 힘든 세상에서 살아남기!!!</p>
      <label class="name-field">내 이름<input id="playerName" maxlength="8" autocomplete="off"></label>
      <div class="title-buttons">
        <button id="startButton" class="primary" disabled>시작</button>
        <button id="continueButton" hidden>이어서</button>
      </div>
    </div>
  </section>

  <section id="gameScreen" hidden>
    <header id="hud" class="hud">
      <div class="hud-time"><span id="hudDate" class="hud-date"></span><span id="hudClock" class="hud-clock"></span><span id="hudDue" class="hud-due" hidden></span></div>
      <div class="hud-stats">
        <span id="hudWallet" class="hud-stat hud-wallet" title="지갑"></span>
        <span id="hudFood" class="hud-stat hud-food" title="남은 사료"></span>
        <span id="hudEnergy" class="hud-stat hud-energy" title="내 체력"></span>
        <span id="hudHearts" class="hud-stat hud-hearts" title="고양이 마음"></span>
      </div>
      <div class="hud-right">
        <button id="phoneButton" class="icon-button" aria-label="휴대폰"><svg viewBox="0 0 24 30" aria-hidden="true"><rect x="4" y="2" width="16" height="26" rx="3" fill="#f4f2ec" stroke="currentColor" stroke-width="2.2"/><rect x="7" y="6" width="10" height="15" rx="1" fill="#8fb4d4"/><circle cx="12" cy="24.5" r="1.4" fill="currentColor"/></svg><i id="phoneBadge" hidden>!</i></button>
        <button id="soundButton" class="icon-button" aria-label="소리"></button>
        <button id="menuButton" class="icon-button" aria-label="메뉴">☰</button>
      </div>
    </header>
    <div id="stageWrap" class="stage-wrap">
      <canvas id="world" aria-label="게임 화면"></canvas>
      <div id="chips" class="chips" hidden></div>
      <button id="actionButton" class="action-button" hidden></button>
      <button id="backButton" class="back-button" hidden aria-label="돌아가기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"/></svg></button>
      <section id="dialogue" class="dialogue" hidden>
        <canvas id="portrait" width="128" height="128" aria-hidden="true"></canvas>
        <div class="dialogue-body"><div id="speaker" class="speaker"></div><div id="speech" class="speech"></div></div>
        <span class="dialogue-next" aria-hidden="true">▼</span>
      </section>
      <div id="toast" class="toast" hidden></div>
    </div>
  </section>

  <div id="pointer" class="pointer" hidden aria-hidden="true"><svg viewBox="-18 -2 36 42" width="30" height="35"><path d="M-7.5 38.5h15v-20h11L0 0-18.5 18.5h11z" fill="#2f2a33"/><path d="M-5 36h10V16h8L0 3-13 16h8z" fill="#ff8a3d"/><path d="M-3 33h3V17h-3z" fill="#ffc08f"/></svg></div>

  <div id="rotateHint" class="rotate-hint" aria-hidden="true"><svg viewBox="0 0 80 80" width="120" height="120"><g class="rot"><rect x="27" y="10" width="26" height="48" rx="5" fill="#2f2a33" stroke="#fffaf0" stroke-width="3"/><rect x="31" y="16" width="18" height="34" fill="#7aa5c8"/><circle cx="40" cy="54" r="1.8" fill="#fffaf0"/></g><path d="M60 22a26 26 0 0 1 5 22" fill="none" stroke="#ffb05a" stroke-width="3.5" stroke-linecap="round"/><path d="M58.5 39.5l6.5 5 4-7" fill="none" stroke="#ffb05a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <section id="blackScreen" class="black-screen" hidden><p id="blackText"></p><span class="black-next" aria-hidden="true">▼</span></section>

  <section id="phone" class="phone-modal" hidden>
    <div class="iphone">
      <div class="iphone-screen">
        <div class="ios-status"><span id="iosTime">10:42</span><span class="ios-island"></span><span class="ios-icons"><i class="sig"></i><i class="wifi"></i><i class="bat"></i></span></div>
        <div id="iosHome" class="ios-home"></div>
        <div id="iosList" class="ios-app" hidden></div>
        <div id="iosThread" class="ios-app" hidden></div>
        <div class="ios-homebar" id="iosHomebar"></div>
      </div>
    </div>
  </section>

  <section id="receipt" class="receipt-modal" hidden><div class="receipt-paper" id="receiptPaper"></div></section>

  <section id="naming" class="modal" hidden>
    <form id="nameForm" class="name-card"><label for="catName">이름을 뭐라고 부를까?</label><input id="catName" maxlength="8" autocomplete="off"><button id="catNameOk" class="primary" disabled>이걸로 할래</button></form>
  </section>

  <section id="gameOver" class="gameover" hidden>
    <h2>GAME OVER</h2>
    <p>이건 현실이 아니라 게임이니까.</p>
    <p>당신에게는 한 번의 기회가 더 있다.</p>
    <button id="retryShelf" class="primary">다시 진열대 앞으로</button>
  </section>

  <section id="menu" class="modal" hidden>
    <div class="menu-card"><h2>잠깐 쉬기</h2><button id="menuResume" class="primary">계속하기</button><button id="menuSave">저장하기</button><button id="menuTitle">저장하고 처음 화면으로</button><button id="menuRestart">처음부터 다시</button><p id="menuStatus" role="status"></p></div>
  </section>

  <section id="ending" class="ending" hidden>
    <div class="ending-top">
      <div class="ending-stage"><canvas id="endingCanvas" width="640" height="360"></canvas><div id="endingStamp" class="ending-stamp"></div></div>
      <div class="ending-words"><div id="endingGrade" class="ending-grade"></div><h1 id="endingTitle"></h1><div id="endingBody"></div></div>
    </div>
    <div class="ending-dex"><h3 id="dexTitle"></h3><div id="endingDex" class="dex-grid"></div></div>
    <div class="ending-books"><div class="ledger" id="ledger"></div><div class="diary" id="diary"></div></div>
    <div class="ending-buttons"><button id="epilogueButton" class="primary">문 너머의 열이틀</button><button id="restartButton">처음부터 다시</button></div>
  </section>
</main>

<script src="src/life-story.js?v=1bce0cb574b8"></script>
<script src="src/pixel-render.js?v=b2a8574b246c"></script>
<script src="src/pixel-icons.js?v=ec26c779689e"></script>
<script src="src/life-view.js?v=0ebe5a79ff31"></script>
<script src="src/life-ui.js?v=83b0a38a38e1"></script>
<script src="src/life-engine.js?v=95a6bbad62aa"></script>
<script src="src/life-home.js?v=c1b31ebe7e74"></script>
<script src="src/life-work.js?v=514096d2e599"></script>
<script src="src/life-game.js?v=ec2e6219fe62"></script>
</body>
</html>

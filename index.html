<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cat at the Door</title>
<style>
@font-face{font-family:'DungGeunMo';src:url(fonts/DungGeunMo.woff) format('woff');font-weight:400;font-style:normal;font-display:block}
:root{
  --bg:#e7eaf6; --surface:#ffffff; --ink:#24273f; --muted:#64688c;
  --lamp:#c4870f; --door:#c9b59a; --door-edge:#8f7a62; --gap:#f6d77e; --paw:#3a3045;
  --line:#cfd3e8; --bad:#b2433b; --good:#3f7d5c;
  --wall:#d9ddef; --floor:#c3c8e0; --sky:#4b5287; --moon:#fbe7a1;
  --fur:#e9a35c; --fur-dark:#b9732f; --skin:#f2cfae; --hair:#3b2f2f; --suit:#2f3350;
  --blanket:#8fa3d9; --sheet:#f4f1fa; --bowl:#7d8fd1; --kibble:#a9703c; --shirt:#ffffff;
  --hoodie:#a3a8bd; --shade:#0d0f1f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7;
    --lamp:#f3c969; --door:#6b5a4c; --door-edge:#443930; --gap:#f3c969; --paw:#151321;
    --line:#3a3f62; --bad:#ef8a80; --good:#8fd1aa;
    --wall:#2b2f4d; --floor:#23263f; --sky:#141629; --moon:#f3dc8f;
    --blanket:#4f5f99; --sheet:#c9c6d9; --suit:#151729; --shirt:#d9d6e8;
    --hoodie:#6f7494; --shade:#05060d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7;
  --lamp:#f3c969; --door:#6b5a4c; --door-edge:#443930; --gap:#f3c969; --paw:#151321;
  --line:#3a3f62; --bad:#ef8a80; --good:#8fd1aa;
  --wall:#2b2f4d; --floor:#23263f; --sky:#141629; --moon:#f3dc8f;
  --blanket:#4f5f99; --sheet:#c9c6d9; --suit:#151729; --shirt:#d9d6e8;
  --hoodie:#6f7494; --shade:#05060d;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DungGeunMo',monospace;line-height:1.75;font-size:16px;-webkit-font-smoothing:none;-moz-osx-font-smoothing:grayscale;font-synthesis:none}
main{max-width:34rem;margin:0 auto;padding:1.25rem 1.25rem 3rem}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);min-height:2rem}
.boss{font-size:1.4rem;display:flex;align-items:center;gap:.4rem}
.boss-label{font-size:12px;color:var(--muted)}
.scene{position:relative;margin:.75rem 0 1.25rem;border-radius:1.2rem;overflow:hidden;border:1.5px solid var(--line);background:var(--wall)}
.scene svg{display:block;width:100%;height:auto}
.scene text{font-family:'DungGeunMo',monospace}
strong,b,h1{font-weight:400}
.text p{margin:0 0 1rem}
.quiet{color:var(--muted)}
.choices{display:flex;flex-direction:column;gap:.7rem;margin-top:1.5rem}
button{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.9rem;padding:.9rem 1rem;cursor:pointer;text-align:left}
button:hover:not(:disabled){border-color:var(--lamp)}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
button small{display:block;color:var(--muted);font-size:12px}
button.ghost{background:transparent;border-style:dashed}
h1{font-size:32px;line-height:1.3;font-weight:400;margin:1.5rem 0 .25rem;text-align:center}
.sub{text-align:center;color:var(--muted);margin:0 0 1rem}
.ending-title{font-size:24px;line-height:1.3;margin:.5rem 0}
.ending-title.bad{color:var(--bad)} .ending-title.good{color:var(--good)} .ending-title.secret{color:var(--lamp)} .ending-title.mid{color:var(--muted)}
.ledger{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:.8rem 0;margin:1rem 0;font-size:14px}
.ledger div{display:flex;justify-content:space-between}
.found{color:var(--muted);font-size:14px;text-align:center;margin-top:1.5rem}
.names{display:flex;flex-direction:column;gap:.7rem;margin-top:1rem}
.names label{display:flex;flex-direction:column;gap:.3rem;font-size:14px;color:var(--muted)}
.names input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.6rem;padding:.7rem .9rem}
.names input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.hint{margin:0;font-size:12px;color:var(--muted)}
.cost{color:var(--bad)} .ledger .cost{color:var(--bad)}
.diary{list-style:none;margin:1rem 0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.diary li{display:grid;grid-template-columns:2.4rem 1fr;gap:.75rem;align-items:start;font-size:15px;line-height:1.6}
.diary li > div{min-width:0}
.diary svg{display:block;width:2.4rem;height:auto}
.diary .n{display:block;font-size:12px;color:var(--muted)}
.reveal{border-top:1px dashed var(--line);padding-top:1rem;margin-top:1rem;font-size:14px;color:var(--muted)}
.reveal p{margin:0 0 .6rem}
.shade{position:absolute;inset:0;background:var(--shade);opacity:0;pointer-events:none;animation:shade var(--hes,3.4s) ease-in forwards}
@keyframes shade{to{opacity:.82}}
.linger{animation:linger var(--hes,3.4s) linear forwards}
@keyframes linger{to{opacity:.25}}
.fade{animation:fade .5s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.wag{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
.blink{animation:blink 1.4s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.rain line{animation:rain .8s linear infinite}
@keyframes rain{from{transform:translateY(-6px)}to{transform:translateY(8px)}}
/* 돌돌이: 정장 위를 직접 민다 */
.suit{touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;-webkit-tap-highlight-color:transparent}
.suit:active{cursor:grabbing}
.suit:focus-visible{outline:3px solid var(--lamp);outline-offset:-3px}
.suit .strand{transition:opacity .25s ease}
.suit .strand.gone{opacity:0}
.roll-left{font-size:14px;color:var(--muted);text-align:center;margin:-.6rem 0 0;min-height:1.75em}
@media (prefers-reduced-motion:reduce){.fade,.wag,.blink,.rain line,.linger{animation:none}.shade{animation:none;opacity:.6}.suit .strand{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
/* ================= 이야기 데이터 ================= */
// 밤마다 바뀌는 회사·생활 이야기 (고양이 쪽 묘사는 상태에 따라 따로 붙는다)
const NIGHTS = [
  "알람을 세 개나 맞추고 누웠다. 방금 내 손으로 닫은 문이 낯설다.",
  "첫날을 겨우 버텼다. 열두 명의 이름을 외우느라 머리가 터질 것 같다.",
  "비가 온다. 천둥이 칠 때마다 창문이 덜컹거린다.",
  "내일은 첫 보고서 마감이다. 노트북을 덮고 나니 새벽 한 시.",
  "내일은 처음으로 회의에서 발표를 한다. 대본을 세 번 읽고 누웠다.",
  "퇴근길에 팀장님이 말했다. “내일 사장님이 팀을 둘러보세요. 다들 옷차림 신경 쓰고요.”",
  "야근하고 자정이 넘어 들어왔다. 씻고 나니 눈이 저절로 감긴다.",
  "회식에서 누가 물었다. “집에 기다리는 사람 있어요?” 고양이요, 했더니 다들 웃었다.",
  "팀장님이 수습 평가 얘기를 꺼냈다. 다음 주에 결과가 나온다고 한다.",
  "내일은 첫 월급날. 통장 앱을 괜히 몇 번이나 열어 봤다."
];
const FIXED = 130, FOOD_BASIC = 5, FOOD_FAV = 30, ROLLER = 20, REFILL = 20;
const TOTAL_ENDINGS = 7;
const KN = ["","한 개","두 개","세 개","네 개","다섯 개","여섯 개","일곱 개","여덟 개","아홉 개","열 개"];
const KB = ["","한 번","두 번","세 번","네 번","다섯 번","여섯 번","일곱 번","여덟 번","아홉 번","열 번"];
let HES = 1;          // 망설임 시간 배율 (테스트할 때 줄일 수 있음)
let hTimer = null;
let s;
function reset(){
  s = { day:0, salary:3000, slept:0, cold:0, firstFur:true, roller:false, food:null, offers:0, wantOffer:false,
        rollerDays:0, scolds:0, refills:0, prevLevel:null, memo:null,
        streak:0, toys:0, closetDone:false, closet:null, hoodie:false, bossCat:null, hist:[], pend:null };
}
const $app = document.getElementById('app');

/* ================= drawing kit ================= */
const V = (body, h=200) => `<svg viewBox="0 0 320 ${h}" role="img">${body}</svg>`;

// 앉은 고양이 (정면)
function catSit(x, y, sc=1, opts={}){
  const eyes = opts.closed
    ? `<path d="M-8,-45 q3,3 6,0 M2,-45 q3,3 6,0" stroke="var(--paw)" stroke-width="1.8" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="-5" cy="-45" rx="2.2" ry="3" fill="var(--paw)"/><ellipse cx="5" cy="-45" rx="2.2" ry="3" fill="var(--paw)"/>`;
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <path class="${opts.wag?'wag':''}" d="M14,-6 q26,-2 18,-30" stroke="var(--fur)" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-18" rx="18" ry="20" fill="var(--fur)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="12" fill="var(--sheet)" opacity=".9"/>
    <polygon points="-13,-50 -8,-67 -1,-56" fill="var(--fur)"/><polygon points="13,-50 8,-67 1,-56" fill="var(--fur)"/>
    <circle cx="0" cy="-44" r="14" fill="var(--fur)"/>
    <path d="M-6,-55 l2,5 M0,-57 l0,5 M6,-55 l-2,5" stroke="var(--fur-dark)" stroke-width="1.6" stroke-linecap="round"/>
    ${eyes}
    <path d="M-1.5,-40 h3 l-1.5,2 z" fill="var(--bad)"/>
    <ellipse cx="-6" cy="-1" rx="5" ry="3" fill="var(--sheet)"/><ellipse cx="6" cy="-1" rx="5" ry="3" fill="var(--sheet)"/>
  </g>`;
}
// 뒤돌아 앉은 고양이
function catAway(x, y, sc=1){
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <ellipse cx="0" cy="-18" rx="18" ry="20" fill="var(--fur)"/>
    <path d="M-6,-30 q6,4 12,0 M-8,-22 q8,4 16,0" stroke="var(--fur-dark)" stroke-width="2" fill="none"/>
    <polygon points="-13,-50 -8,-67 -1,-56" fill="var(--fur)"/><polygon points="13,-50 8,-67 1,-56" fill="var(--fur)"/>
    <circle cx="0" cy="-44" r="14" fill="var(--fur)"/>
    <path d="M-14,-2 q-24,4 -20,-18" stroke="var(--fur)" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>`;
}
// 식빵 자세로 자는 고양이
function catLoaf(x, y, sc=1){
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <ellipse cx="0" cy="-12" rx="26" ry="14" fill="var(--fur)"/>
    <path d="M-6,-20 q4,3 8,0 M4,-22 q4,3 8,0" stroke="var(--fur-dark)" stroke-width="1.8" fill="none"/>
    <polygon points="12,-30 16,-44 22,-32" fill="var(--fur)"/><polygon points="28,-30 30,-44 36,-30" fill="var(--fur)"/>
    <circle cx="24" cy="-22" r="12" fill="var(--fur)"/>
    <path d="M17,-23 q3,2 5,0 M26,-23 q3,2 5,0" stroke="var(--paw)" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M-24,-6 q-6,6 6,6 h20" stroke="var(--fur-dark)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="40" y="-38" font-size="13" fill="var(--muted)">z z</text>
  </g>`;
}
// 사람 (기본은 정장, hoodie면 회색 후드티)
function person(x, y, opts={}){
  const face = opts.face || "neutral";
  const mouth = face==="sad" ? `<path d="M-5,-62 q5,-4 10,0" stroke="var(--paw)" stroke-width="1.8" fill="none"/>`
    : face==="happy" ? `<path d="M-5,-64 q5,5 10,0" stroke="var(--paw)" stroke-width="1.8" fill="none"/>`
    : `<path d="M-4,-63 h8" stroke="var(--paw)" stroke-width="1.8"/>`;
  let fur = "";
  const n = opts.fur || 0;
  for (let i=0;i<n;i++){
    const fx = -14 + ((i*37)%28), fy = -46 + ((i*23)%40);
    fur += `<path d="M${fx},${fy} l4,${(i%2?2:-2)}" stroke="var(--fur)" stroke-width="2.2" stroke-linecap="round"/>`;
  }
  const body = opts.body || (opts.hoodie ? "var(--hoodie)" : "var(--suit)");
  const collar = opts.hoodie
    ? `<path d="M-12,-50 q12,9 24,0" stroke="var(--line)" stroke-width="3" fill="none"/><path d="M-3,-46 v9 M3,-46 v9" stroke="var(--sheet)" stroke-width="1.5"/>`
    : `<polygon points="-5,-50 0,-38 5,-50" fill="var(--shirt)"/>`;
  const sparkle = opts.sparkle ? `<text x="18" y="-60" font-size="16" fill="var(--lamp)">★</text><text x="-30" y="-30" font-size="11" fill="var(--lamp)">★</text>` : "";
  return `<g transform="translate(${x},${y})">
    <rect x="-9" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/><rect x="2" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/>
    <rect x="-17" y="-50" width="34" height="44" rx="9" fill="${body}"/>
    ${collar}
    ${fur}
    <circle cx="0" cy="-68" r="14" fill="var(--skin)"/>
    <path d="M-14,-70 q2,-16 14,-14 q12,-2 14,14 q-8,-8 -28,0" fill="var(--hair)"/>
    <circle cx="-5" cy="-68" r="1.6" fill="var(--paw)"/><circle cx="5" cy="-68" r="1.6" fill="var(--paw)"/>
    ${mouth}
    ${opts.roller ? roller(22,-28,.6) : ""}
    ${sparkle}
  </g>`;
}
// 팀장님
function boss(x, y, mood){
  const mouth = mood==="angry" ? `<path d="M-5,-62 q5,-5 10,0" stroke="var(--paw)" stroke-width="2" fill="none"/>`
    : mood==="sigh" ? `<ellipse cx="0" cy="-62" rx="3" ry="2" fill="var(--paw)"/>`
    : `<path d="M-6,-64 q6,6 12,0" stroke="var(--paw)" stroke-width="2" fill="none"/>`;
  const brows = mood==="angry" ? `<path d="M-9,-75 l6,3 M9,-75 l-6,3" stroke="var(--paw)" stroke-width="2"/>` : "";
  return `<g transform="translate(${x},${y})">
    <rect x="-20" y="-50" width="40" height="50" rx="10" fill="var(--muted)"/>
    <polygon points="-3,-50 0,-30 3,-50" fill="var(--bad)"/>
    <circle cx="0" cy="-68" r="15" fill="var(--skin)"/>
    <path d="M-15,-72 q15,-18 30,0" fill="var(--paw)" opacity=".75"/>
    <circle cx="-5" cy="-68" r="1.7" fill="var(--paw)"/><circle cx="5" cy="-68" r="1.7" fill="var(--paw)"/>
    ${brows}${mouth}
  </g>`;
}
// 사장님 (안경, 흰머리, 휴대폰 속 치즈 고양이)
function ceo(x, y, phone){
  return `<g transform="translate(${x},${y})">
    <rect x="-9" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/><rect x="2" y="-8" width="7" height="8" rx="2" fill="var(--paw)"/>
    <rect x="-19" y="-52" width="38" height="46" rx="10" fill="var(--door-edge)"/>
    <polygon points="-5,-52 0,-40 5,-52" fill="var(--shirt)"/>
    <rect x="-1.5" y="-46" width="3" height="14" fill="var(--good)"/>
    <circle cx="0" cy="-70" r="14" fill="var(--skin)"/>
    <path d="M-14,-72 q2,-14 14,-13 q12,-1 14,13 q-4,-6 -14,-7 q-10,1 -14,7" fill="var(--line)"/>
    <circle cx="-5" cy="-69" r="3.6" fill="none" stroke="var(--paw)" stroke-width="1.4"/><circle cx="5" cy="-69" r="3.6" fill="none" stroke="var(--paw)" stroke-width="1.4"/>
    <circle cx="-5" cy="-69" r="1.2" fill="var(--paw)"/><circle cx="5" cy="-69" r="1.2" fill="var(--paw)"/>
    <path d="M-5,-61 q5,4 10,0" stroke="var(--paw)" stroke-width="1.8" fill="none"/>
    ${phone ? `<line x1="14" y1="-40" x2="26" y2="-56" stroke="var(--door-edge)" stroke-width="6" stroke-linecap="round"/>
      <rect x="20" y="-84" width="20" height="30" rx="3" fill="var(--paw)"/><rect x="22" y="-81" width="16" height="24" rx="1" fill="var(--surface)"/>
      <circle cx="30" cy="-67" r="5" fill="var(--fur)"/><polygon points="25.5,-69 26.5,-75 29,-71" fill="var(--fur)"/><polygon points="34.5,-69 33.5,-75 31,-71" fill="var(--fur)"/>` : ""}
  </g>`;
}
function roller(x, y, sc=1){
  return `<g transform="translate(${x},${y}) scale(${sc})">
    <rect x="-6" y="0" width="8" height="30" rx="3" fill="var(--muted)"/>
    <rect x="-22" y="-26" width="40" height="28" rx="12" fill="var(--sheet)" stroke="var(--line)" stroke-width="2"/>
    <path d="M-14,-22 v20 M-4,-22 v20 M6,-22 v20" stroke="var(--line)" stroke-width="1.5"/>
  </g>`;
}
function bowl(x, y, full, premium){
  return `<g transform="translate(${x},${y})">
    ${full?`<ellipse cx="0" cy="-12" rx="20" ry="6" fill="var(--kibble)"/><circle cx="-8" cy="-15" r="2.5" fill="var(--kibble)"/><circle cx="4" cy="-16" r="2.5" fill="var(--kibble)"/>`:""}
    <path d="M-24,-12 h48 l-6,12 h-36 z" fill="var(--bowl)"/>
    ${premium?`<text x="18" y="-22" font-size="15" fill="var(--lamp)">★</text>`:""}
    ${!full?`<text x="-12" y="-20" font-size="14" fill="var(--muted)">텅…</text>`:""}
  </g>`;
}
// 문틈으로 밀려 들어온 쥐 인형들
function toys(n){
  const col = ["var(--muted)","var(--bowl)","var(--lamp)"];
  let g = "";
  for (let i=0;i<Math.min(n,5);i++){
    const c = col[i%3], x = 226 + i*13, y = 191 + (i%2)*5;
    g += `<g transform="translate(${x},${y})"><ellipse cx="0" cy="-3" rx="6" ry="3.5" fill="${c}"/><circle cx="5" cy="-6" r="2" fill="${c}"/><path d="M-6,-3 q-5,-1 -7,3" stroke="${c}" stroke-width="1.4" fill="none"/></g>`;
  }
  return g;
}
const foodBag = (x, y, fav) => `<g transform="translate(${x},${y})"><path d="M-12,0 h24 l-2,-24 h-20 z" fill="var(--lamp)"/><rect x="-10" y="-28" width="20" height="5" rx="2" fill="var(--door-edge)"/>${fav?`<text x="-6" y="-8" font-size="11" fill="var(--paw)">★</text>`:`<circle cx="0" cy="-12" r="4" fill="var(--paw)" opacity=".5"/>`}</g>`;
const floor = (y=178) => `<rect x="0" y="${y}" width="320" height="${200-y}" fill="var(--floor)"/>`;

/* ================= 방 ================= */
function roomBg(rainy){
  const rain = rainy ? `<g class="rain">${[0,1,2,3,4,5].map(i=>`<line x1="${30+i*11}" y1="${42+(i%2)*10}" x2="${27+i*11}" y2="${52+(i%2)*10}" stroke="var(--sheet)" stroke-width="1.5" opacity=".7"/>`).join('')}</g>` : "";
  return `<rect width="320" height="200" fill="var(--wall)"/>
    <rect x="22" y="28" width="74" height="58" rx="4" fill="var(--sky)" stroke="var(--door-edge)" stroke-width="3"/>

    ${rain}

const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hasJong(w){ const c = w.charCodeAt(w.length-1); if (c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28 !== 0; }
const J = (w,a,b) => w + (hasJong(w) ? a : b);
let ME = "김신입", CAT = "보리";
const CATi = () => J(CAT,"이","가"), CATe = () => J(CAT,"은","는"), CATo = () => J(CAT,"을","를"), CATw = () => J(CAT,"과","와");

  }
  if (s.cold <= 1) return `${CATi()} 문 앞에서 운다. 같이 자자고.`;
  if (s.cold <= 3) return `${CATi()} 한 번, 짧게 운다. 그러고는 기다린다.`;
  if (s.cold <= 5) return "울음소리는 없다. 문 앞에 앉아 있는 기척만 느껴진다.";

  if (s.day===0 || s.memo==null) return "";

  return [`오늘 아침엔 ${CATi()} 현관까지 배웅 나왔다.`,`오늘 아침엔 ${CATi()} 소파에서 고개만 들었다.`,`오늘 아침엔 ${CATi()} 배웅을 나오지 않았다.`,`요즘은 아침에 ${CATo()} 본 기억이 없다.`][s.memo];
}
function compareLine(){
  if (s.day===0 || s.prevLevel==null) return "";

  if (now > prev) return now===3 ? "어제는 문 밖에 있었는데, 오늘은 기척도 없다." : "어제보다 소리가 작다.";

    : s.cold <= 3 ? `나갈 때 ${CATi()} 소파에서 고개만 들었다.`
    : s.cold <= 5 ? `나갈 때 ${CATe()} 보이지 않았다.`
    : `언제부턴가 ${CATi()} 배웅을 나오지 않는다. 바빠서 몰랐다.`;
}
function openLine(wasCold, late){
  if (wasCold) return `거실 소파 끝에서 ${CATe()} 혼자 자고 있었다. 옆에 누우니 잠깐 쳐다보더니, 다시 눈을 감았다.`;
  if (late) return `결국 이불을 걷고 일어났다. 문을 열자 ${CATi()} 잠깐 나를 올려다보고는, 베개 옆으로 갔다.`;
  if (s.hoodie) return `문을 열자 ${CATi()} 후드티를 반쯤 끌고 들어왔다. 골골 소리를 들으며 잠들었다.`;
  if (s.day===0) return `문을 열자마자 ${CATi()} 원래 자리인 베개 옆으로 갔다. 골골 소리를 들으며 잠들었다.`;
  return `문을 열자마자 ${CATi()} 이불 속으로 파고들었다. 골골 소리를 들으며 잠들었다.`;
}
const PRAISE = () => [
  `팀장님이 “${ME}씨, 첫날치고 괜찮네요.” 하고 지나갔다.`,
  "열두 명의 이름을 다 외웠다. 옆자리 선배가 놀란 눈치다.",
  "비 오는 출근길에도 지각하지 않았다.",
  "첫 보고서가 한 번에 통과됐다.",
  "발표가 무사히 끝났다. 팀장님이 고개를 끄덕였다.",
  "",
  "야근 다음 날인데도 머리가 맑다. 팀장님이 커피를 사 주셨다.",
  "회식 다음 날, 혼자 멀쩡한 얼굴로 출근했다.",
  `“역시 ${ME}씨, 믿고 맡길 만하네요.” 수습 평가가 기대된다.`,
  "월급날 아침이라 그런지 사무실 공기가 들떠 있다."
][s.day];

/* ================= flow ================= */
function render(html, focus=true){

  window.scrollTo(0,0);
  if (focus){ const b = $app.querySelector('input, button:not(:disabled)'); if (b) b.focus({preventScroll:true}); }
}
const topBar = label => `<div class="top"><span>${label}</span><span class="boss" title="체면"><span class="boss-label">체면</span>${bossFace()}</span></div>`;
const plainTop = label => `<div class="top"><span>${label}</span></div>`;
const scene = svg => `<div class="scene">${svg}</div>`;
const paras = lines => lines.map(l=>`<p>${l}</p>`).join('');

function goTitle(){

      <text x="40" y="50" font-size="10" fill="var(--moon)">★</text><text x="140" y="34" font-size="8" fill="var(--moon)">★</text>

      <text x="190" y="96" font-size="22" fill="var(--lamp)" class="blink">야옹?</text>`))}

function startGame(skip){
  const p = document.getElementById('pname').value.trim(), c = document.getElementById('cname').value.trim();

  skip ? night() : prologue(0);

/* ---- 프롤로그: 문이 늘 열려 있던 시절 ---- */
function prologue(i){
  const P = [
    { tag:"작년 겨울", pic:sceneStore, btn:"우산을 기울여 준다", lines:[
      "서른한 번째 불합격 문자를 받은 밤이었다.",
      "편의점 앞 우산꽂이 옆에서, 젖은 치즈색 새끼 고양이가 울고 있었다." ]},
    { tag:"취준생의 밤들", pic:sceneBaseline, btn:"불을 끄고 같이 잔다", lines:[
      `${J(CAT,"이라고","라고")} 이름을 붙였다. 그해 겨울 내내, 우리는 베개 하나를 나눠 썼다.`,
      `자소서를 쓰다 새벽에 누우면 ${CATi()} 베개 옆으로 와서 몸을 말았다. 회색 후드티는 늘 털투성이였지만, 볼 사람도 없었다.`,
      "방문은 늘 열려 있었다." ]},
    { tag:"지난주", pic:scenePass, btn:"방문을 닫는다", lines:[
      "합격 문자가 왔다.",
      `난생처음 검은 정장을 샀다. ${CATi()} 냄새를 맡더니 재채기를 했다.`,
      "검은 정장에 치즈색 털은 너무 잘 보인다. 내일은 첫 출근이다." ]}
  ];
  const p = P[i];
  render(`
    ${plainTop(p.tag)}
    ${scene(p.pic())}
    <div class="text">${paras(p.lines)}</div>
    <div class="choices"><button onclick="${i < P.length-1 ? `prologue(${i+1})` : "night()"}">${p.btn}</button></div>
  `);
}

/* ---- 밤: 문을 열까, 이불을 덮어쓸까 ---- */
function night(){
  const away = s.cold >= 6;
  const mem = memoryLine(), cmp = compareLine(), extra = nightExtra();
  render(`
    ${topBar(`${s.day+1}번째 밤 · 월급날까지 ${10-s.day}일`)}
    ${scene(sceneNight())}
    <div class="text"><p>${NIGHTS[s.day]}</p>${mem?`<p class="quiet">${mem}</p>`:""}${extra?`<p>${extra}</p>`:""}<p class="${s.cold>3?'quiet':''}">${cmp?cmp+" ":""}${cryLine()}</p></div>
    <div class="choices">
      <button onclick="choose(true)">${away ? `거실로 나가 ${CATo()} 찾는다` : "문을 열고 같이 잔다"}</button>
      <button onclick="hesitate()">${away ? "그냥 잔다" : "이불을 머리끝까지 덮는다"}<small>내일도 출근이니까</small></button>
    </div>
  `);
}
// 거절은 버튼 한 번으로 끝나지 않는다: 화면이 어두워지는 동안 아직 일어날 수 있다
function hesitate(){
  const lv = cryLevel(s.cold), away = lv === 3;
  const ms = Math.round((away ? 2200 : 3400) * HES);
  const msg = away ? "조용하다. 이불 속이 이상하게 넓다."
    : lv===0 ? "이불 속까지 소리가 들린다. 눈을 꼭 감았다."
    : lv===1 ? (s.hoodie ? "한 번 울고는 조용해졌다. 후드티 위에 자리를 잡는 소리가 난다." : "한 번 울고는 조용해졌다. 그래서 더 신경 쓰인다.")
    : "소리는 없다. 그래도 문 앞에 있다는 걸 안다.";
  render(`
    ${topBar(`${s.day+1}번째 밤`)}
    <div class="scene" style="--hes:${ms}ms">${sceneNight()}<div class="shade"></div></div>
    <div class="text"><p>${msg}</p></div>
    <div class="choices"><button class="linger" style="--hes:${ms}ms" onclick="choose(true,true)">${away ? "…그래도 일어나서 찾아본다" : "…일어나서 문을 연다"}</button></div>
  `, false);
  clearTimeout(hTimer);
  hTimer = setTimeout(()=>{ hTimer = null; choose(false); }, ms);
}
function choose(sleep, late=false){
  clearTimeout(hTimer); hTimer = null;
  s.prevLevel = cryLevel(s.cold);
  const rec = { open:sleep, late, cold:s.cold, rain:s.day===2, toy:false, place:"" };
  s.hist.push(rec);
  const lines = [];
  if (sleep){
    const wasCold = s.cold >= 6;
    rec.place = wasCold ? "sofa" : "bed";
    s.slept++; s.cold = Math.max(0, s.cold - 2); s.memo = "slept"; s.streak = 0;
    lines.push(openLine(wasCold, late));
    return morningWork(lines, true, false);
  }
  s.streak++;
  // 이틀 연속 문을 닫으면, 고양이는 내 냄새가 나는 곳을 찾아간다
  if (!s.closetDone && s.streak >= 2 && s.day >= 1 && s.day <= 7 && s.cold < 6){
    rec.place = "closet";
    s.cold++;
    return closetMorning();
  }
  rec.place = s.hoodie ? "hoodie" : s.cold >= 6 ? "away" : "door";
  if (s.cold <= 3){ s.toys++; rec.toy = true; }
  s.cold = s.hoodie ? Math.min(3, s.cold + 1) : s.cold + 1;
  s.memo = s.hoodie ? "hoodie" : cryLevel(s.cold);
  lines.push("푹 잤다. 정장은 깔끔하고 머리도 맑다.");
  if (rec.toy) lines.push(s.toys===1 ? "아침에 보니 문틈으로 쥐 인형 하나가 밀려 들어와 있었다." : `문 앞의 쥐 인형이 ${KN[s.toys]}로 늘었다.`);
  lines.push(`<span class="quiet">${seeOffLine()}</span>`);
  morningWork(lines, false, false);
}

/* ---- 곁가지 1: 옷장 속 정장 ---- */
function closetMorning(){
  render(`
    ${topBar(`${s.day+1}일째 아침`)}
    ${scene(sceneCloset())}
    <div class="text">
      <p>출근하려고 옷장을 열었다.</p>
      <p>바닥에 떨어진 정장 위에서 ${CATi()} 몸을 동그랗게 말고 자고 있었다. 소매에 얼굴을 묻은 채로.</p>
      <p>어젯밤엔 같이 자지도 않았는데, 검은 정장이 치즈색이 됐다.</p>
    </div>
    <div class="choices">
      <button onclick="closetChoice('lock')">옷장 문을 꼭 닫아 둔다<small>정장은 이제 안전하다</small></button>
      <button onclick="closetChoice('hoodie')">옷장 맨 아래 회색 후드티를 꺼낸다<small>방문 앞에 깔아 준다</small></button>
    </div>
  `);
}
function closetChoice(k){
  s.closetDone = true; s.closet = k;
  const lines = [];
  if (k === "lock"){
    s.cold++; s.memo = "closet";
    lines.push(`정장을 털어 다시 걸고, 옷장 문을 꼭 닫았다. 닫히는 소리에 ${CATi()} 귀를 납작하게 했다.`);
  } else {
    s.hoodie = true; s.memo = "hoodie-new";
    s.cold = Math.min(3, Math.max(0, s.cold - 1));
    lines.push("옷장 맨 아래에서 회색 후드티를 꺼냈다. 매일 자소서를 쓰던 그 옷이다.");
    lines.push(`방문 앞에 깔아 주자 ${CATi()} 한참 냄새를 맡더니, 그 위에서 식빵을 구웠다.`);
  }
  morningWork(lines, true, true);
}

/* ---- 아침: 털이 붙었는지에 따라 회사가 달라진다 ---- */
function morningWork(lines, fur, viaCloset){
  if (s.day === 5) return ceoVisit(lines, fur);
  if (!fur){
    s.salary += 200;
    lines.push(PRAISE());
    return finishDay(lines, sceneSeeOff());
  }
  s.wantOffer = true;
  if (s.firstFur){
    s.salary -= 600; s.firstFur = false;
    let pic;
    if (s.day === 0){
      pic = sceneOffice("first","첫날부터…?");
      lines.push(`아침. 검은 정장이 털 범벅이다. 팀장님이 위아래로 훑어보더니 말했다. “${ME}씨, 첫날부터 이러면 곤란한데요.”`);
    } else {
      pic = sceneOffice("first","옷이 그게…?");
      lines.push(`${viaCloset ? "" : "아침. "}출근한 지 ${s.day+1}일째, 처음으로 털 범벅이 됐다. 팀장님 눈썹이 꿈틀한다. “${ME}씨, 거래처 미팅 있는 날인데 옷이 그게 뭐예요?”`);
    }
    return finishDay(lines, pic);
  }
  if (s.roller){ s.pend = lines; return rollerMorning(); }
  scold(lines, false);
}
function scold(lines, skippedRoller){
  s.scolds++;
  let S, kind = "sigh";
  if (s.bossCat){
    s.salary -= 100; kind = "soft";
    S = [
      ["팀장님이 내 소매를 보더니 “호떡이 생각나네요.” 하고 지나간다.","호떡…"],
      ["털이 좀 붙었지만, 팀장님은 이제 못 본 척해 준다.","험험"],
      ["옆자리 선배가 내 어깨의 털을 떼어 주며 웃는다. 팀장님도 피식했다.","…"]
    ][(s.scolds-1) % 3];
  } else {
    s.salary -= 250;
    S = skippedRoller ? [
      ["리필을 아끼려고 돌돌이를 두고 나왔다. 팀장님이 말없이 한숨을 쉰다.","하아…"],
      ["손으로 털어 봤지만 소용없다. 회의 중에 털이 날려 옆 사람이 재채기를 했다.","에취"],
      [`“${ME}씨, 돌돌이 안 써요? 티 나네요.” 웃으면서 하는 말인데 눈은 안 웃는다.`,"티 나네요"],
      ["돌돌이는 현관에 걸려만 있다. 팀장님이 내 소매를 한참 쳐다본다.","…"]
    ][(s.scolds-1) % 4] : [
      ["또 털이 붙었다. 팀장님이 말없이 한숨을 쉰다.","하아…"],
      ["회의 중에 털이 날려 옆 사람이 재채기를 했다. 분위기가 싸해졌다.","에취"],
      [`“${ME}씨, 고양이 키워요? 티 나네요.” 웃으면서 하는 말인데 눈은 안 웃는다.`,"티 나네요"],
      ["손으로 털어 봤지만 소용없다. 팀장님이 내 소매를 한참 쳐다본다.","…"]
    ][(s.scolds-1) % 4];
    if (s.day === 4) S = ["발표하는 내내 팀장님 시선이 내 소매에 가 있었다.","…"];
  }
  lines.push("아침. " + S[0]);
  finishDay(lines, sceneOffice(kind, S[1]));
}
/* ---- 곁가지 2: 고양이를 좋아하는 사장님 ---- */
function ceoVisit(lines, fur, rolled=false){
  if (fur){
    if (s.roller && !rolled){ s.pend = lines; return rollerMorning(true); }
    if (s.roller){
      s.salary -= 10; s.refills++;
      lines.push("아침. 돌돌이로 앞판, 뒤판, 소매까지 싹 밀었다. 오늘은 사장님이 오시는 날이니까.");
      lines.push(`<span class="cost">돌돌이 리필 한 롤 사용 · 월급날 ${REFILL}만원 청구 (이번 달 ${s.refills}롤째)</span>`);
    } else {
      lines.push("아침. 정장에 붙은 털을 손으로 대충 털고 나왔다. 하필 사장님이 오시는 날이다.");
    }
    lines.push(rolled
      ? "사장님이 팀을 한 바퀴 돌다가 내 앞에서 멈췄다. 그렇게 밀었는데도 어깨에 한 가닥이 남아 있었나 보다. 사장님이 치즈색 털 한 가닥을 집어 든다. 팀장님 얼굴이 하얘졌다."
      : "사장님이 팀을 한 바퀴 돌다가 내 앞에서 멈췄다. 내 어깨에서 치즈색 털 한 가닥을 집어 든다. 팀장님 얼굴이 하얘졌다.");
    lines.push("“…치즈 고양이죠? 우리 집 호떡이랑 색이 똑같네.” 사장님이 휴대폰 배경화면을 보여 줬다. 동그란 치즈 고양이가 하품을 하고 있었다.");
    lines.push("그날 오후, 팀장님이 지나가며 작게 말했다. “…사장님 고양이 이름이 호떡이래요.”");
    s.bossCat = true; s.firstFur = false; s.salary += 100;
    return finishDay(lines, sceneCeo(true));
  }
  s.bossCat = false; s.salary += 200;
  lines.push("사장님이 팀을 한 바퀴 돌았다. 깔끔한 내 정장을 보고 고개를 끄덕이고는 지나갔다.");
  finishDay(lines, sceneCeo(false));
}
function finishDay(lines, pic){
  s.day++;
  const offerNow = !s.roller && s.wantOffer && s.offers < 2 && s.day < 10;
  s.wantOffer = false;
  const next = offerNow ? "rollerEvent()" : s.day >= 10 ? "payday()" : "night()";
  render(`
    ${topBar(`${s.day}일째 출근`)}
    ${scene(pic)}
    <div class="text">${paras(lines)}</div>
    <div class="choices"><button onclick="${next}">${s.day>=10?"월급날 아침":"퇴근하고 집으로"}</button></div>
  `);
}
/* ---- 돌돌이 ---- */
function rollerMorning(ceo=false){
  const n = Math.min(18, 9 + s.slept);
  RL = { strands:suitStrands(n), left:n, total:n, ceo };
  render(`
    ${topBar(`${s.day+1}일째 아침`)}
    <div class="text">${paras(s.pend)}
      <p>${ceo ? "아침. 정장이 털 범벅이다. 하필 오늘은 사장님이 오시는 날이다." : "아침. 정장이 털 범벅이다. 현관에 돌돌이가 걸려 있다."}</p>
      <p class="cost">리필은 한 롤에 ${REFILL}만원. 이번 달 ${s.refills}롤 썼다.</p></div>
    <div class="scene suit" id="suit" tabindex="0" role="button" aria-label="정장. 누른 채로 문지르면 돌돌이가 털을 뗀다. 키보드는 스페이스로 한 줄씩." aria-describedby="rollLeft">${sceneSuit()}</div>

function suitStrands(n){
  let seed = s.day * 97 + s.slept * 13 + 7;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const zones = [[102,140,60,184],[180,218,60,184],[142,178,122,184],[64,94,92,182],[226,256,92,182]];
  const pickZone = [0,1,2,0,1,3,4];
  const out = [];
  for (let i=0;i<n;i++){
    const z = zones[pickZone[i % pickZone.length]];
    out.push({ x:Math.round(z[0] + rnd()*(z[1]-z[0])), y:Math.round(z[2] + rnd()*(z[3]-z[2])), a:Math.round(rnd()*170), on:true });
  }
  return out;
}

function sweep(a, b){
  const d = Math.hypot(b.x-a.x, b.y-a.y), steps = Math.max(1, Math.ceil(d/4));
  for (let k=0;k<=steps;k++){
    const x = a.x + (b.x-a.x)*k/steps, y = a.y + (b.y-a.y)*k/steps;
    RL.strands.forEach((t,i)=>{ if (t.on && Math.abs(t.x-x) < 27 && Math.abs(t.y-y) < 12) takeStrand(i); });
  }
}

  const rest = RL.strands.map((t,i)=>[t,i]).filter(([t])=>t.on).sort((p,q)=>p[0].y-q[0].y).slice(0, per);

function bindSuit(){

  let down = false, last = null;
  const at = e => { const r = svg.getBoundingClientRect(); return { x:(e.clientX-r.left)*320/r.width, y:(e.clientY-r.top)*200/r.height }; };
  el.addEventListener("pointerdown", e => { down = true; last = at(e); try { el.setPointerCapture(e.pointerId); } catch(_){} showRoller(last); sweep(last, last); });
  el.addEventListener("pointermove", e => { const p = at(e); showRoller(p); if (down){ sweep(last, p); last = p; } });

  if (s.closet === "lock") return "옷장 문은 아직 꼭 닫혀 있다.";
  if (s.toys >= 3) return `문 앞의 쥐 인형 ${KN[s.toys]}는 아직 치우지 못했다.`;
  return "";
}
function ending(key){
  const e = ENDINGS[key];
  saveFound(key);
  const cb = callback(key);
  render(`
    ${topBar("엔딩")}
    ${scene(sceneEnding(key))}
    <p class="ending-title ${e.cls}">${e.title}</p>
    <div class="text">
      ${paras(e.body())}
      ${cb ? `<p class="quiet">${cb}</p>` : ""}
      <div class="ledger">
        <div><span>${CATw()} 같이 잔 밤</span><span>${s.slept} / 10</span></div>
        <div><span>최종 연봉</span><span>${Math.max(0,s.salary).toLocaleString()}만원</span></div>
      </div>
    </div>
    <div class="choices">
      <button onclick="otherSide()">문 너머의 열 밤<small>${CAT}의 쪽에서 다시 보기</small></button>
      <button class="ghost" onclick="goTitle()">처음부터 다시</button>
    </div>
    ${foundLine()}
  `);
}
/* ---- 관점 바꾸기: 같은 열 밤을 고양이 쪽에서 ---- */
function catSide(r, i){
  if (r.place === "sofa") return "소파 끝에서 혼자 자는데, 그 사람이 나왔다. 옆에 누웠다. 오랜만이었다.";
  if (r.open){
    if (r.rain) return "하늘이 쾅 했다. 문이 열렸다. 이불 속으로 숨었다.";
    if (r.late) return "오래 불렀다. 늦게, 문이 열렸다.";
    if (i === 0) return "문이 닫혔다가, 다시 열렸다. 베개 옆, 원래 내 자리.";
    return ["문이 열렸다. 베개 옆, 내 자리.","문이 열렸다. 그 사람 숨소리를 들으며 잤다.","문이 열렸다. 이불 속이 따뜻했다."][i % 3];
  }
  if (r.place === "closet") return "문이 열리지 않아서 옷장에 들어갔다. 까만 옷에서 그 사람 냄새가 났다.";
  if (r.place === "hoodie") return r.rain ? "하늘이 쾅 했다. 그 사람 옷에 얼굴을 묻었다." : "문 앞에 그 사람 옷이 있었다. 거기서 잤다.";
  if (r.place === "away") return i % 2 ? "문 앞에 가지 않았다." : "오늘은 문 앞에 가지 않았다. 소파도 괜찮다.";
  if (r.rain) return "하늘이 쾅 했다. 문에 등을 붙이고 있었다. 문은 열리지 않았다.";
  if (i === 0) return "문이 닫혔다. 처음이다. 오래 불렀다.";
  if (r.toy && r.cold <= 1) return s.hist.slice(0, i).some(x => x.toy) ? "쥐를 또 문 밑으로 넣어 줬다. 이번에도 문은 열리지 않았다." : "제일 좋아하는 쥐를 문 밑으로 넣어 줬다. 문은 열리지 않았다.";
  if (r.cold <= 1) return "문 앞에서 불렀다. 문틈의 불빛이 꺼졌다.";
  if (r.cold <= 3) return r.toy ? "쥐를 하나 더 넣어 줬다. 한 번만 불렀다." : "한 번만 불렀다. 그리고 기다렸다.";
  return "부르지 않았다. 문 앞에 앉아만 있었다.";
}
function reveals(){
  const r = [];
  if (s.bossCat === false) r.push("사장님 휴대폰 배경화면은 동그란 치즈 고양이다. 이름은 호떡. 이번에는 끝내 몰랐다.");
  if (s.closet === "lock") r.push("옷장 맨 아래의 회색 후드티는 이번에도 꺼내지 않았다.");
  if (s.toys) r.push(`문 밑으로 들어온 쥐 인형은 모두 ${KN[s.toys]}였다.`);
  return r;
}
function otherSide(){
  const items = s.hist.map((r,i)=>`<li>${doorIcon(r)}<div><span class="n">${i+1}번째 밤${r.rain?" · 비":""}</span>${catSide(r,i)}</div></li>`).join('');
  const rv = reveals();
  render(`
    ${plainTop("문 너머")}
    ${scene(sceneOtherSide())}
    <p class="ending-title">${CAT}의 열 밤</p>
    <ol class="diary">${items}</ol>
    ${rv.length ? `<div class="reveal">${paras(rv)}</div>` : ""}
    <div class="text"><p>처음 문을 닫던 밤과 마지막 밤. 같은 문이었다.</p></div>
    <div class="choices"><button onclick="goTitle()">처음부터 다시</button></div>
    ${foundLine()}
  `);
}
function getFound(){ try{ return JSON.parse(localStorage.getItem('catgame4-found')||'[]'); }catch(e){ return []; } }
function saveFound(k){ try{ const f=getFound(); if(!f.includes(k)){f.push(k); localStorage.setItem('catgame4-found',JSON.stringify(f));} }catch(e){} }
function foundLine(){ const f = getFound(); return f.length ? `<p class="found">찾은 엔딩 ${f.length} / ${TOTAL_ENDINGS}</p>` : ''; }
goTitle();
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cat at the Door</title><link rel="stylesheet" href="life.css"></head>
<body>
<main id="app">
 <section id="titleScreen" class="title-screen"><canvas id="titleCanvas" width="640" height="360" aria-hidden="true"></canvas><div class="title-menu"><h1>Cat at the Door</h1><label>내 이름<input id="playerName" maxlength="8" placeholder="김신입" autocomplete="off"></label><button id="startButton" disabled>시작</button></div></section>
 <section id="gameScreen" hidden>
  <header class="topbar"><span id="dateLabel"></span><span id="timeLabel"></span><button id="moneyButton" aria-label="가방과 생활비">가방</button><button id="soundButton" aria-label="소리 켜고 끄기">소리 켬</button><button id="helpButton" aria-label="조작 안내">?</button></header>
  <div class="stage-wrap"><canvas id="world" width="640" height="360" tabindex="0" role="application" aria-label="WASD나 방향키로 이동. E로 가까운 사물과 상호작용. 인물을 선택해 대화."></canvas><button id="contextButton" class="context-button" hidden></button><div id="sceneNotice" class="notice" role="status" hidden></div></div>
  <section id="dialogue" class="dialogue" aria-live="polite" hidden><canvas id="portrait" width="48" height="64" aria-hidden="true"></canvas><div class="dialogue-body"><div id="speaker" class="speaker"></div><div id="speech" class="speech"></div><div id="choices" class="choices"></div></div><button id="dialogueNext" aria-label="대화 이어 듣기">▾</button></section>
  <div id="minigameBar" class="mini-bar" hidden><strong id="miniLabel"></strong><span id="miniHint"></span><button id="miniExit">내려놓기</button></div>
  <div id="touchControls"><div class="dpad"><button data-key="w" aria-label="위로">▲</button><button data-key="a" aria-label="왼쪽">◀</button><button data-key="s" aria-label="아래로">▼</button><button data-key="d" aria-label="오른쪽">▶</button></div><button id="touchInteract">E</button></div>
 </section>
 <aside id="inventory" class="drawer" aria-label="가방과 기록" hidden><button id="inventoryClose" aria-label="닫기">×</button><div id="inventoryBody"></div></aside>
 <section id="naming" class="modal" hidden><form id="nameForm"><label for="catName">이름을 뭐라고 부를까?</label><input id="catName" placeholder="보리" maxlength="8" autocomplete="off"><button>불러본다</button></form></section>
 <section id="endingScreen" class="ending" hidden><canvas id="endingCanvas" width="640" height="360" role="img" aria-label="우리 집에 남은 마지막 밤의 모습"></canvas><h1 id="endingTitle"></h1><div id="endingText"></div><button id="restartButton">처음의 문으로</button></section>
</main>
<script src="life-state.js"></script><script src="life-story.js"></script><script src="pixel-render.js"></script><script src="life-view.js"></script><script src="life-game.js"></script>
</body></html>

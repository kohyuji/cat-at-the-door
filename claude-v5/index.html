<style>
@font-face{font-family:'DungGeunMo';src:url(fonts/DungGeunMo.woff) format('woff');font-weight:400;font-style:normal;font-display:block}

  --lamp:#c4870f; --door:#c9b59a; --door-edge:#8f7a62; --gap:#f6d77e; --paw:#3a3045;

  --wall:#dfe2f2; --wall-n:#3b3f66; --floor:#c3c8e0; --floor-n:#2c2f4f; --sky:#4b5287; --moon:#fbe7a1;

  --suit:#2f3350; --suit-d:#1f2238; --shirt:#ffffff; --tie:#5d7fd6; --tee:#f4f4f7; --pants:#6d7088;
  --pj:#a9bde6; --pj-d:#7f95c8; --hoodie:#a3a8bd; --hoodie-d:#858aa3;
  --boss:#8c7a5c; --boss-d:#5e5140; --ceo:#5f7f6a; --ceo-d:#40584a;
  --blanket:#8fa3d9; --sheet:#f4f1fa; --wood:#b08d68; --wood-d:#8a6a4b;
  --day:#f4f0e2; --sun:#ffe9a8; --warm:#f3c48a; --hint:#ffd84d; --think:#eef0ff;

}

  :root:not([data-theme="light"]){
    --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7; --line:#3a3f62;

  }
}

  --bg:#1c1f33; --surface:#272b47; --ink:#ebe7f5; --muted:#a2a5c7; --line:#3a3f62;
  --wall:#c9cde3; --day:#e6e1d0;

*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DungGeunMo',monospace;line-height:1.6;font-size:17px;-webkit-font-smoothing:none;font-synthesis:none}
main{max-width:32rem;margin:0 auto;padding:12px 16px 28px}
.stage{position:relative;width:100%;max-width:min(100%, calc((100vh - 36px) * .75));margin:0 auto;aspect-ratio:3/4;border-radius:18px;overflow:hidden;border:2px solid var(--line);background:#14162a;touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.stage text{font-family:'DungGeunMo',monospace}

.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;background:rgba(12,14,30,.86);color:#fff;font-size:26px;pointer-events:none;animation:card 2.2s ease forwards}

.sepia #pxc,.sepia #pxbg{filter:sepia(.75) saturate(1.3) brightness(1.05)}
/* 그림 속 움직임 */
.pourfall rect{animation:pourf .5s linear infinite}

@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}

@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.6px)}}

@keyframes breath{50%{transform:scaleY(1.03)}}

@keyframes flk{from{transform:translate(0,-10px)}to{transform:translate(var(--dx,0px),118px)}}

@keyframes flks{from{transform:translateX(-3px)}to{transform:translateX(3px)}}

@keyframes spin{to{transform:rotate(360deg)}}
.pawIn{animation:pawIn 3s ease-in-out infinite}
@keyframes pawIn{0%,28%{transform:translateY(-18px)}42%,52%{transform:translateY(0)}58%{transform:translateY(-4px)}64%{transform:translateY(0)}78%,100%{transform:translateY(-18px)}}
@keyframes snow{from{transform:translateY(-10px)}to{transform:translateY(18px)}}
.mover{transition:transform 1s ease-in-out}
.mover.fast{transition-duration:.45s}
.pop{animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.float{animation:float 1.1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-26px)}}
.jump{animation:jump .5s ease-out}
@keyframes jump{45%{transform:translateY(-58px)}}
.shake{animation:shake .4s ease}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ring-pulse{animation:ringp 1.4s ease-in-out infinite}
@keyframes ringp{0%,100%{opacity:.25}50%{opacity:.95}}
.sway{transform-box:fill-box;transform-origin:50% 0%;animation:sway 2.4s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(3deg)}}
.zz{animation:zz 2s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translate(0,4px)}40%{opacity:1}100%{opacity:0;transform:translate(6px,-12px)}}
.lightning{animation:lightning 2.8s steps(1) infinite}
@keyframes lightning{0%,88%,94%,100%{opacity:0}90%,96%{opacity:.85}}
.snowfall circle{animation:fall linear infinite}
@keyframes fall{from{transform:translate(0,-20px)}to{transform:translate(-30px,510px)}}
.tg{opacity:0;transition:opacity .15s;pointer-events:none}
#sc.dragging .tg{opacity:.8}
.tg.over{opacity:1}
.tg.over rect,.tg.over ellipse{stroke-width:5}
.flutter{transform-box:fill-box;transform-origin:center;animation:flutter .22s ease-in-out infinite alternate}
@keyframes flutter{to{transform:scaleY(.35)}}
.scratching{animation:scratching .28s ease-in-out infinite alternate}
@keyframes scratching{to{transform:translateY(9px)}}
.vib{animation:vib .1s linear infinite}
@keyframes vib{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.blinkR{animation:blinkr 1s steps(1) infinite}
@keyframes blinkr{50%{opacity:.25}}
.knead{animation:knead .35s ease-in-out infinite alternate}
@keyframes knead{to{transform:translateY(3px)}}
.hop{animation:hop .45s ease-out}
@keyframes hop{40%{transform:translateY(-22px)}}
.dimmer{transition:opacity 2.6s linear}
.glowring{animation:ringp 1.4s ease-in-out infinite}
.title-sign{font-size:30px}
.typing{animation:typingb .28s ease-in-out infinite alternate}
@keyframes typingb{to{transform:translateY(2px)}}
/* 시범을 보이는 손 */
.gh{pointer-events:none}
.gh .h-tap{animation:htap 1.1s ease-in-out infinite}
@keyframes htap{0%,100%{transform:translate(0,10px)}45%,60%{transform:translate(0,0)}}
.gh .rip{transform-box:fill-box;transform-origin:center;animation:rip 1.1s ease-out infinite}
@keyframes rip{0%,40%{transform:scale(.3);opacity:0}55%{opacity:1}100%{transform:scale(1.8);opacity:0}}
.gh .h-drag{animation:hdrag 2s ease-in-out infinite}
@keyframes hdrag{0%{transform:translate(0,0);opacity:0}12%{transform:translate(0,0);opacity:1}72%{transform:translate(var(--dx),var(--dy));opacity:1}88%,100%{transform:translate(var(--dx),var(--dy));opacity:0}}
.gh .h-rub{animation:hrub .75s ease-in-out infinite alternate}
@keyframes hrub{from{transform:translate(-18px,0) rotate(-8deg)}to{transform:translate(18px,0) rotate(8deg)}}
.gh .h-hold{animation:hhold 2.4s ease-in-out infinite}
@keyframes hhold{0%,100%{transform:translate(0,8px)}15%,85%{transform:translate(0,0)}}
.gh .holdring{stroke-dasharray:100;stroke-dashoffset:100;animation:holdr 2.4s linear infinite}
@keyframes holdr{0%,15%{stroke-dashoffset:100}85%,100%{stroke-dashoffset:0}}
.gh .trail{animation:trail 1s linear infinite}
@keyframes trail{to{stroke-dashoffset:-14}}
.holdbar{stroke-dasharray:100;stroke-dashoffset:100;animation:holdbar var(--hes,3s) linear forwards}
@keyframes holdbar{to{stroke-dashoffset:0}}
/* 아래쪽(타이틀, 엔딩) */
h1{font-size:32px;line-height:1.3;font-weight:400;margin:1rem 0 .2rem;text-align:center}
.names{display:flex;gap:.6rem;margin-top:1rem}
.names label{flex:1;display:flex;flex-direction:column;gap:.3rem;font-size:14px;color:var(--muted)}
.names input{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;width:100%;min-width:0}
button{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:.9rem;padding:.8rem 1rem;cursor:pointer;line-height:1.4}
button:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.wide{display:block;width:100%;margin-top:.8rem}
.wide.ghost{background:transparent}
.ending-title{font-size:28px;text-align:center;margin:1rem 0 .2rem}
.end-line{text-align:center;margin:.1rem 0}
.strip{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:1rem 0 .3rem}
.strip div{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.strip svg{width:100%;height:auto;display:block}
.found{color:var(--muted);font-size:14px;text-align:center;margin-top:1rem}
.quiet{color:var(--muted);font-size:14px;text-align:center}
@media (prefers-reduced-motion:reduce){
  .wag,.shiver,.breath,.bob,.arrowb,.tapping,.rain line,.snow circle,.pop,.jump,.shake,.ring-pulse,.sway,.zz,.lightning,.card,.fadein,.flutter,.scratching,.vib,.blinkR,.knead,.hop,.glowring{animation:none}
  .snowfall circle{animation-duration:12s!important}
  .flk{animation-duration:16s!important}
  .flks,.spin,.pawIn{animation:none}
  .card{display:none}
  .mover,.stage.through svg,.stage.out svg{transition:none}
  .gh .h-tap,.gh .h-drag,.gh .h-rub,.gh .h-hold{animation-duration:3s}
}
</style>

<body>
<main id="app"></main>
<script>
const esc = t => String(t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hasJong(w){ const c = w.charCodeAt(w.length-1); if (c<0xAC00||c>0xD7A3) return false; return (c-0xAC00)%28 !== 0; }
const J = (w,a,b) => w + (hasJong(w) ? a : b);
let ME = "김신입", CAT = "보리";
const CATi = () => J(CAT,"이","가"), CATe = () => J(CAT,"은","는"), CATo = () => J(CAT,"을","를"), CATw = () => J(CAT,"과","와");
/* ================= Cat at the Door v5 (뼈대부터 다시) =================
   그림이 곧 게임이다. 고르기 버튼은 없다.
   - 문, 이불, 옷, 보리, 노트북을 그림 안에서 직접 끌고, 문지르고, 누른다.
   - 처음 하는 동작은 흰 손이 한 번 시범을 보인다. 한참 가만히 있으면 다시 보여 준다.
   - 글은 편지, 시계, 달력처럼 그림 속 물건에만 있다. 말은 팀장님과 사장님만 가끔 한다.
   - 결과는 숫자 대신 다음 장면의 보리와 내 얼굴로 보인다.
   - 문이 닫히면 카메라가 문을 지나 바닥 높이로 내려가서 보리가 된다.
*/
const VW = 360, VH = 480, FLOOR = 410;
const DAYS = 12;
const WD = ["월","화","수","목","금","토","일","월","화","수","목","금"];
const ACT = d => d <= 5 ? 1 : d <= 9 ? 2 : 3;
let SPEED = 1;                       // 테스트에서 시간을 줄인다
let s, timers = [], ticks = [];
const $app = document.getElementById('app');
const SEEN = {};                     // 이미 시범을 본 동작
function reset(){
  s = { day:0, bond:5, tired:0, face:3, prep:0, lates:0, slept:0, fur:0,
        lastOpen:false, catSpot:null, closetN:0, toys:0, laptopNight:false,
        hoodie:null, bossCat:false, found9:null, meet:null, log:[], finalOpen:null,
        furLeft:0, satWork:0, satPlay:false,
        food:3, foodMax:4, foodKind:"tuna", order:null, hungry:0, hungryToday:false,
        work:0, workMiss:0, overtime:0, curtain:false };
}
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const bond = d => { s.bond = clamp(s.bond + d, 0, 10); };
const rnd = (seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647)(7);
function later(ms, fn){ const t = setTimeout(fn, ms * SPEED); timers.push(t); return t; }
function every(ms, fn){ const t = setInterval(fn, ms * SPEED); ticks.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); ticks.forEach(clearInterval); timers = []; ticks = []; }
function dayLog(){ if (!s.log[s.day]) s.log[s.day] = { open:null, pet:false, play:false, late:false, work:false }; return s.log[s.day]; }
const $ = id => document.getElementById(id);

/* ================= 화면 틀 ================= */
// show: 장면 하나를 그린다. o.card: 날짜 같은 짧은 제목을 잠깐 덮어 보여 준다. o.below: 장면 아래 HTML (타이틀, 엔딩만)
// 키 큰 폰에서는 장면 위아래(벽과 바닥)를 더 보여 줘서 화면을 채운다
let EXT = { top:0, bot:0 };
function computeExt(){
  const W = Math.min(window.innerWidth - 32, 512), H = window.innerHeight - 40;
  if (window.innerWidth >= 700 || W <= 0) return { top:0, bot:0 };
  const E = clamp(Math.round(VW * H / W - VH), 0, 170);
  return { top: Math.round(E * .45), bot: E - Math.round(E * .45) };
}
function show(world, o={}){
  clearTimers(); idleKill(); G = null; HIT = {};
  EXT = o.flat ? { top:0, bot:0 } : computeExt();
  const TH = VH + EXT.top + EXT.bot;
  world = topFix(world);
  PLATE = o.bg || null;
  $app.innerHTML = `<div class="stage ${o.cls||''} fadein" id="sc" style="aspect-ratio:${VW}/${TH};max-width:min(100%, calc((100svh - 36px) * ${(VW/TH).toFixed(4)}))">
      ${o.bg ? plateDiv(o.bg, TH) : ""}
      <svg viewBox="0 ${-EXT.top} ${VW} ${TH}" role="img" aria-label="${o.label||''}"><g id="world">${world}</g><g id="fx"></g><g id="ghost" pointer-events="none"></g></svg>
      ${o.card ? `<div class="card">${o.card}</div>` : ""}
    </div>${o.below || ""}`;
  window.scrollTo(0,0);
  sndButton();
  bindScene();
  pxAttach();
}
// 화면 맨 위(키 큰 폰에서는 더 위)에 붙는 표시는 __TOP__ 자리에 실제 맨 위 + 34를 넣는다
const topFix = html => String(html).split('__TOP__').join(String(34 - EXT.top));
function world(html){ const w = $('world'); if (w) w.innerHTML = topFix(html); }
function putFx(id, html){ const L = $('fx'); if (!L) return; const old = $(id); if (old) old.remove(); L.insertAdjacentHTML('beforeend', html); }
function dropFx(...ids){ ids.forEach(id => { const e = $(id); if (e) e.remove(); }); }
// 장면 전환: 살짝 어두워졌다가 다음 장면
function fadeTo(fn, ms=450){ const st = $('sc'); if (st) st.classList.add('out'); idleKill(); HIT = {}; const t = setTimeout(fn, ms * Math.min(1, SPEED*2)); timers.push(t); }
// 문을 지나 반대편으로: 문 쪽으로 다가가며 어두워진다
function throughDoor(fn, ox="76%", oy="52%"){
  const st = $('sc'); if (!st) return fn(); idleKill(); HIT = {};
  const svg = st.querySelector('svg'); svg.style.transformOrigin = `${ox} ${oy}`; const cv = $('pxc'); if (cv) cv.style.transformOrigin = `${ox} ${oy}`;
  const bg = $('pxbg'); if (bg){ const r = st.getBoundingClientRect(), b = bg.getBoundingClientRect(); bg.style.transformOrigin = `${ox} ${(parseFloat(oy) / 100 * r.height - (b.top - r.top)).toFixed(1)}px`; }
  st.classList.add('through');
  const t = setTimeout(fn, 1000 * Math.min(1, SPEED*2)); timers.push(t);
}
function moveEl(id, x, y, extra=""){ const e = $(id); if (!e) return; requestAnimationFrame(()=>requestAnimationFrame(()=>{ e.style.transform = `translate(${x}px,${y}px) ${extra}`; })); }

/* ================= 입력: 장면 하나에 이벤트를 걸고 data-hit 이름으로 나눈다 ================= */
// HIT[name] = { tap, rub:{fn,per}, drag:{ghost,targets,miss}, pull:{progress,move,done}, hold:{start,release}, key }
let HIT = {}, G = null;
// 알림이나 휴대폰 주문 창이 떠 있는 동안 장면이 손 판정을 바꾸면, 창을 닫은 뒤에 쓰도록 맡아 둔다 (창의 버튼은 그대로)
let MODAL = null;
const modalOn = () => MODAL && $(MODAL.id);
function hits(m){ if (modalOn()){ MODAL.m = m; return; } HIT = m; }
function addHits(m){ if (modalOn()){ Object.assign(MODAL.m, m); return; } Object.assign(HIT, m); }
function modalOpen(id, handlers){ MODAL = { id, m: HIT }; HIT = Object.assign({ _bg: null }, handlers); }
function modalClose(id){ dropFx(id); if (MODAL && MODAL.id === id){ HIT = MODAL.m; MODAL = null; } }
const hitA = (name, label) => `data-hit="${name}" tabindex="0" role="button" aria-label="${label}"`;
function svgPt(svg, e){ const r = svg.getBoundingClientRect(); return { x:(e.clientX-r.left)*VW/r.width, y:-EXT.top + (e.clientY-r.top)*(VH+EXT.top+EXT.bot)/r.height }; }
const ptIn = (p, r) => p.x >= r[0] && p.x <= r[0]+r[2] && p.y >= r[1] && p.y <= r[1]+r[3];
function ghost(html){ const g = $('ghost'); if (g) g.innerHTML = html; }
function bindScene(){
  const box = $('sc'); if (!box) return;
  const svg = () => box.querySelector('svg');
  box.addEventListener('pointerdown', e => {
    idlePoke();
    const el = e.target.closest && e.target.closest('[data-hit]');
    const name = el ? el.dataset.hit : null;
    const h = (name && HIT[name]) || HIT._bg;
    if (!h) return;
    e.preventDefault();
    const p = svgPt(svg(), e);
    G = { name, h, p0:p, last:p, moved:0, acc:0, t0:Date.now(), el };
    try { box.setPointerCapture(e.pointerId); } catch(_){}

  if (nx * side < -.05 || (Math.abs(nx) <= .05 && ny < 0)){ nx = -nx; ny = -ny; }

/* ================= 그림 3: ChatGPT 배경판 위에 얹는 것들 =================
   배경판에 이미 그려진 방문, 옷걸이, 책상, 창문 자리에 맞춰 움직이는 부분만 그린다. */
// 침실(오른쪽) 배경판 속 자리
const BRD = { x:213, y:54, w:102, h:258 };            // 방문 (경첩은 오른쪽)
const RACK = { x0:72, x1:178, bar:112, shelf:292 };   // 옷걸이 봉과 아래 선반
const BFLOOR = 312;                                    // 벽과 바닥이 만나는 선
// 책상(가운데) 배경판 속 자리
const DESK = { x0:139, x1:318, top:226, win:[32, 68, 118, 104], curL:-20, curR:148 };
// 문. 닫혀 있으면 배경판의 문이 그대로 보이고 틈, 발, 후드티만 얹는다. 열리면 문짝을 그린다.
function doorG(D, open, o={}){
  const E = "#3c4058";
  if (open > 0){
    const hx = D.x + D.w, ww = Math.max(9, D.w * (1 - open * .86));
    return `<g><rect x="${D.x}" y="${D.y}" width="${D.w}" height="${D.h}" fill="${o.beyond || '#1c1f3a'}"/>
      <rect x="${D.x}" y="${D.y + D.h * .74}" width="${D.w}" height="${D.h * .26}" fill="${o.floorB || '#2a2e52'}"/>
      ${o.inDoor || ""}
      <path d="M${hx},${D.y} L${hx - ww},${D.y + 9 * open} L${hx - ww},${D.y + D.h - 7 * open} L${hx},${D.y + D.h} Z" fill="${o.leaf || '#e4e5ec'}" stroke="${E}" stroke-width="2"/>
      ${ww > 34 ? `<rect x="${hx - ww + 8}" y="${D.y + 22}" width="${ww - 16}" height="${D.h * .38}" fill="none" stroke="${o.panel || '#c9cbd6'}" stroke-width="2"/><circle cx="${hx - ww + 10}" cy="${D.y + D.h * .54}" r="5" fill="#d9dae2" stroke="${E}" stroke-width="1.5"/>` : ""}</g>`;
  }
  return `<g>${o.gap ? `<rect x="${D.x + 3}" y="${D.y + D.h - 4}" width="${D.w - 6}" height="5" fill="${o.gap}"/>` : ""}
    ${o.paws ? pawsUnder(D) : ""}
    ${o.hoodie ? `<rect x="${D.x + D.w * .2}" y="${D.y + D.h - 2}" width="${D.w * .6}" height="6" rx="3" fill="var(--hoodie)"/>` : ""}
    ${o.scratch ? `<path d="M${D.x + D.w * .3},${D.y + D.h - 44} l5,26 M${D.x + D.w * .42},${D.y + D.h - 48} l5,28 M${D.x + D.w * .54},${D.y + D.h - 44} l5,26" stroke="#9a9cab" stroke-width="2.2" stroke-linecap="round"/>` : ""}</g>`;
}
// 옷걸이에 걸린 정장. o.fallen: 정장이 선반에 떨어져 있음(보리가 그 위에서 잤다)
function rackSuit(o={}){
  if (o.none) return "";
  if (o.fallen) return `<g><path d="M90,${RACK.shelf - 2} q38,-16 76,0 v8 h-76 z" fill="var(--suit)"/><path d="M104,${RACK.shelf - 8} l14,6 l-6,6 z" fill="#fff"/><path d="M112,${RACK.shelf - 6} l4,8 l-3,3 z" fill="var(--tie)"/>${furOnSuit(o.fur || 0, 96, RACK.shelf - 10, 64, 10)}</g>`;
  return `<g>${hangSuit(125, RACK.bar + 8, 1.12)}${furOnSuit(o.fur || 0, 98, RACK.bar + 30, 54, 50)}</g>`;
}
function furOnSuit(n, x0, y0, w, h){ let g = ""; for (let i = 0; i < n; i++){ const fx = x0 + (i * 37 + 11) % w, fy = y0 + (i * 23 + 7) % h; g += `<path d="M${fx},${fy} q3,${i % 2 ? -3 : 3} 7,${i % 2 ? 1 : -1}" stroke="var(--fur)" stroke-width="2.6" fill="none" stroke-linecap="round"/>`; } return g; }
// 사료 봉지. level 0..1, kind: tuna(보리가 좋아함) | chick(싼 사료)
function foodBag(x, y, o={}){
  const lv = clamp(o.level == null ? 1 : o.level, 0, 1), big = o.kind === "chick";
  const w = big ? 40 : 32, h = big ? 52 : 42, c = big ? "#e3b75e" : "#6f9fd8", c2 = big ? "#b98a34" : "#4b77b3";
  const wy = y - h + 12, wh = h - 22, fill = wh * lv;
  return `<g transform="translate(${x},${y}) rotate(${o.tilt || 0}) translate(${-x},${-y})">
    <path d="M${x - w/2},${y} L${x - w/2 + 2},${y - h} L${x + w/2 - 2},${y - h} L${x + w/2},${y} Z" fill="${c}"/>
    <rect x="${x - w/2 + 2}" y="${y - h - 4}" width="${w - 4}" height="6" rx="1" fill="${c2}"/>
    <rect x="${x - 6}" y="${wy}" width="12" height="${wh}" rx="2" fill="#f4efe2"/>
    ${fill > 0 ? `<rect x="${x - 6}" y="${wy + wh - fill}" width="12" height="${fill}" rx="2" fill="#a0673a"/>` : ""}
    ${big ? `<path d="M${x + 8},${y - h + 14} q8,-2 8,6 q0,6 -6,5 l-4,6 l-3,-2 l3,-6 q-4,-4 2,-9 z" fill="#fff" opacity=".85"/>`
          : `<path d="M${x + 6},${y - h + 18} q6,-6 12,0 q-6,6 -12,0 z M${x + 18},${y - h + 18} l4,-4 v8 z" fill="#fff" opacity=".9"/>`}
  </g>`;
}
// 밥그릇. food: 0 빈 그릇, .5 반쯤, 1 가득
function bowl(x, y, food=0){
  return `<g><ellipse cx="${x}" cy="${y - 2}" rx="20" ry="6" fill="#d9534f"/>
    <path d="M${x - 20},${y - 6} q0,10 6,12 h28 q6,-2 6,-12 z" fill="#d9534f"/><path d="M${x - 17},${y - 4} q0,6 4,8 h26 q4,-2 4,-8" fill="none" stroke="#b5403b" stroke-width="2"/>
    ${food > 0 ? `<ellipse cx="${x}" cy="${y - 7 - food * 2}" rx="${10 + food * 6}" ry="${2 + food * 3}" fill="#a0673a"/><circle cx="${x - 5}" cy="${y - 9 - food * 3}" r="2" fill="#c08452"/><circle cx="${x + 4}" cy="${y - 10 - food * 3}" r="2" fill="#c08452"/>` : `<ellipse cx="${x}" cy="${y - 6}" rx="14" ry="3" fill="#8f3430"/>`}</g>`;
}
// 쏟아지는 사료 알갱이
function kibbleFall(x, y0, y1, n=7){ let g = `<g class="pourfall">`; for (let i = 0; i < n; i++) g += `<rect x="${x - 6 + (i * 5) % 12}" y="${y0 + (i * 13) % Math.max(4, y1 - y0)}" width="4" height="4" fill="#a0673a"/>`; return g + `</g>`; }
// 빗줄기 (창 유리 위)
function rainOn(x, y, w, h, n=9){ let g = `<g class="rain">`; for (let i = 0; i < n; i++){ const xx = x + 6 + i * (w - 12) / (n - 1); g += `<line x1="${xx.toFixed(1)}" y1="${y + 6 + (i % 3) * 18}" x2="${(xx - 4).toFixed(1)}" y2="${y + 20 + (i % 3) * 18}" stroke="#aab4d8" stroke-width="2"/><line x1="${(xx - 3).toFixed(1)}" y1="${y + 50 + (i % 2) * 22}" x2="${(xx - 7).toFixed(1)}" y2="${y + 64 + (i % 2) * 22}" stroke="#aab4d8" stroke-width="2"/>`; } return g + `</g>`; }
// 커튼을 닫는다. v: 0 열림 ~ 1 닫힘. 배경판의 크림색 커튼이 가운데로 모인다.
function curtainPull(x, y, w, h, v){
  if (v <= 0) return "";
  const cw = w / 2 * v;
  const fold = (x0, ww) => { let g = ""; for (let k = 1; k < 4; k++) g += `<path d="M${(x0 + ww * k / 4).toFixed(1)},${y + 6} V${y + h - 4}" stroke="#e7d9c6" stroke-width="2.4"/>`; return g; };
  return `<g><rect x="${x}" y="${y - 6}" width="${cw.toFixed(1)}" height="${h + 14}" fill="#fbf1e4"/>${fold(x, cw)}
    <rect x="${(x + w - cw).toFixed(1)}" y="${y - 6}" width="${cw.toFixed(1)}" height="${h + 14}" fill="#fbf1e4"/>${fold(x + w - cw, cw)}</g>`;
}
// 앞쪽에 크게 보이는 침대 (누워서 보는 밤). y: 매트리스 윗면
function bedFront(y=382){

    <ellipse cx="62" cy="${y - 10}" rx="50" ry="18" fill="#fbf7ef" stroke="#d6d2c8" stroke-width="2"/></g>`;
}
function blanketFront(lx, ty, rx=290){

// 화면 위쪽에 늘 보이는 작은 표시: 사료 봉지 (남은 횟수만큼 칸)
function hudFood(){

  const n = s.food, max = s.foodMax || 4, low = n <= 1;

}
// 사료 알림 (남은 양을 눌러 봐도, 모자라면 저절로도 뜬다)
function foodNotice(then){
  const n = s.food || 0;
  const art = `<g transform="scale(1.5)">${foodBag(0, 24, { level: s.foodMax ? n / s.foodMax : 0, kind: s.foodKind })}</g>`;
  const like = s.foodKind === "chick" ? "닭고기 사료" : `${CATi()} 좋아하는 참치 사료`;
  let lines;
  if (MO && MO.parcel && !MO.gone && n <= 1) lines = ["주문한 사료가 왔어요.", "현관 앞 상자를 눌러 열어요."];
  else if (s.order) lines = [`주문한 사료는 내일 아침에 와요.`, `지금 남은 사료: ${n}번`];
  else if (n <= 0) lines = ["사료가 다 떨어졌어요.", "저녁에 휴대폰으로 주문해요."];
  else if (n === 1) lines = ["사료가 한 번 남았어요.", "저녁에 휴대폰으로 주문해요."];
  else lines = [like, `남은 사료: ${n}번`];
  notice(lines, art, typeof then === "function" ? then : null);
}

// 잘라서 보이기: (x,y,w,h) 안쪽만 그린다. 픽셀 그림(data-clip)과 그냥 SVG(overflow) 둘 다.
const clipBox = (x, y, w, h, inner) => `<svg x="${x}" y="${y}" width="${w}" height="${h}" overflow="hidden"><g data-clip="0 0 ${w} ${h}"><g transform="translate(${-x},${-y})">${inner}</g></g></svg>`;
// 책상 창의 유리 두 장 (가운데 창틀 빼고)
const PANES = [[34, 70, 54, 103], [97, 70, 49, 103]];
// 창밖 계절 (프롤로그 2): 유리 뒤에서 눈, 꽃잎, 낙엽이 흩날린다
function seasonGlass(kind){
  let seed = { winter:11, spring:23, summer:37, fall:41 }[kind] || 5;
  const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const fly = (x, y, shape, dur, dx, sway) => `<g class="flk" style="--dx:${dx.toFixed(1)}px;animation-duration:${dur.toFixed(2)}s;animation-delay:${(-R() * dur).toFixed(2)}s"><g class="flks" style="animation-duration:${sway.toFixed(2)}s">${shape(x, y)}</g></g>`;
  const pane = ([x, y, w, h]) => {
    let g = "";
    if (kind === "winter"){
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#e6ecf6" opacity=".38"/>`;
      g += `<path d="M${x},${y + h} v-4 q${w*.25},-4 ${w*.5},-2 q${w*.25},2 ${w*.5},-1 v7 z" fill="#fff" opacity=".95"/>`;
      for (let i = 0; i < 13; i++){ const r = R() < .4 ? 2 : 2.8; g += fly(x + 3 + R() * (w - 6), y - 4, (a, b) => `<circle cx="${a.toFixed(1)}" cy="${b}" r="${r}" fill="#fff" opacity=".95"/>`, 4.5 + R() * 3, -6 + R() * 12, 1.6 + R()); }
    }
    if (kind === "spring"){
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#fde7ee" opacity=".22"/>`;
      for (let i = 0; i < 9; i++) g += fly(x + 2 + R() * (w - 4), y - 4, (a, b) => `<ellipse class="spin" style="animation-duration:${(1.8 + R()).toFixed(2)}s" cx="${a.toFixed(1)}" cy="${b}" rx="3.8" ry="2.3" fill="${R() < .5 ? '#f7b3c6' : '#fbd0dc'}" opacity=".95"/>`, 5 + R() * 3, 10 + R() * 14, 1.2 + R() * .8);
    }
    if (kind === "summer"){
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#8fd0f6" opacity=".28"/>
        <g class="sway" style="transform-origin:${x + w/2}px ${y + h}px"><circle cx="${x + w*.3}" cy="${y + h - 4}" r="${w*.42}" fill="#5aa257"/><circle cx="${x + w*.8}" cy="${y + h + 4}" r="${w*.36}" fill="#6fb46b"/></g>`;
    }
    if (kind === "fall"){
      g += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="#f2b56a" opacity=".26"/>`;
      const cols = ["#d9822b", "#c4542f", "#e0a63a"];
      for (let i = 0; i < 7; i++){ const c = cols[i % 3]; g += fly(x + 2 + R() * (w - 4), y - 6, (a, b) => `<path class="spin" style="animation-duration:${(2.2 + R()).toFixed(2)}s" d="M${a.toFixed(1)},${b - 5} q5,4 0,10 q-5,-6 0,-10 z" fill="${c}" opacity=".95"/>`, 5.5 + R() * 3, 14 + R() * 18, 1.4 + R()); }
    }
    return clipBox(x, y, w, h, g);
  };
  return PANES.map(pane).join('');
}
// 닫힌 문 밑으로 고양이 발이 나왔다 들어갔다 한다 (문 아래로만 보인다)
function pawsUnder(D){
  const y0 = D.y + D.h;
  const paw = (cx, d) => `<g class="pawIn" style="animation-delay:${d}s"><ellipse cx="${cx}" cy="${y0 + 3}" rx="11" ry="8.5" fill="var(--fur)"/><path d="M${cx - 4},${y0 + 7} v3.5 M${cx},${y0 + 8} v3.5 M${cx + 4},${y0 + 7} v3.5" stroke="#9a5b2a" stroke-width="1.4" stroke-linecap="round"/></g>`;
  return clipBox(D.x, y0 - 1, D.w, 20, paw(D.x + D.w * .38, 0) + paw(D.x + D.w * .64, -1.5));
}

let PS = null;
function p1(){
  PS = { tilt:0, stage:"snow" };
  show(p1World(), { card:"2년 전 겨울", label:"눈 오는 밤, 상자 속 새끼 고양이", bg:"street" });
  p1Hits();
  later(2400, () => teach("drag", 156, 160, 250, 206, { key:"umbrella" }));
}
function p1World(){
  const t = PS.tilt, st = PS.stage;
  const covered = st !== "snow";
  const held = st === "held";
  const hand = [34 + t*44, -170 + t*34];
  const kit = held ? "" : `<g class="${covered ? '' : 'shiver'}">${catSit(262, 402, .72, { sad:!covered, happy:st === "look" })}
      ${covered ? "" : `<circle cx="256" cy="364" r="2.6" fill="#fff"/><circle cx="268" cy="367" r="2.2" fill="#fff"/><circle cx="262" cy="376" r="2" fill="#fff"/>`}</g>`;
  const meSnow = covered ? `<circle cx="112" cy="252" r="2.6" fill="#fff"/><circle cx="126" cy="249" r="2.2" fill="#fff"/><circle cx="104" cy="262" r="2" fill="#fff"/><circle cx="134" cy="258" r="2.2" fill="#fff"/>` : "";
  const me = held
    ? person(150, 436, { wear:"hoodie", face:"happy", pose:"hold", held:`<g transform="translate(0,22)">${catSit(0, 0, .55, { happy:true })}</g>` })
    : person(120, 436, { wear:"hoodie", face: covered ? "soft" : "worry", hands:{ L:[-30,-76], R:hand } });
  const umb = held ? `<g transform="translate(210,430) rotate(100)">${umbrella(0, 0, 0)}</g>`
    : st === "snow" ? `<g ${hitA("umb","우산을 기울이기")}>${umbrella(120 + hand[0], 436 + hand[1], t*40)}<rect x="${86 + t*40}" y="${120 + t*30}" width="140" height="96" fill="transparent"/></g>`
    : umbrella(120 + hand[0], 436 + hand[1], t*40);
  const kitHit = st === "look" ? `<rect ${hitA("kit","고양이를 안기")} x="222" y="364" width="80" height="70" fill="transparent"/>` : "";
  return `${snowLayer()}${kit}${cardBox(262, 432)}${me}${meSnow}${umb}${kitHit}
    <g id="tgs"><g class="tg" id="tg-me"><rect x="68" y="236" width="110" height="200" rx="14" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g></g>`;
}
function p1Hits(){
  hits({
    umb: { pull: { progress:(a,b) => (b.x - a.x) / 90, move: v => { PS.tilt = v; world(p1World()); }, done: p1Cover, tapped: p1Cover }, key: p1Cover },
    kit: { drag: { ghost:(x,y) => `<g transform="translate(${x},${y+24})">${catSit(0, 0, .6, {})}</g>`,
                   targets:[{ key:"me", r:[60, 220, 130, 230], fn: p1Hold }], miss: tap => { if (tap) p1Hold(); } }, key: p1Hold }
  });
}
function p1Cover(){
  if (PS.stage !== "snow") return;
  PS.tilt = 1; PS.stage = "look"; world(p1World()); p1Hits();
  later(500, () => sound('nya', '냐아', 300, 372, { fs:15 }));
  later(1300, () => teach("drag", 262, 396, 128, 330, { key:"kitten" }));
}
function p1Hold(){
  if (PS.stage !== "look") return;
  PS.stage = "held"; idleKill(); dropFx('nya');
  world(p1World()); hits({});
  [0, 300, 600].forEach((d, i) => later(d, () => heart(150 + i*8, 300 - i*6)));
  later(2600, () => fadeTo(() => p2(0), 700));
}

/* ================= 프롤로그 2: 그 뒤로 2년. 메일, 불합격, 무릎 위 보리 ================= */
const SEASONS = ["winter", "spring", "summer", "fall", "winter"];
function p2(i){
  PS = { i, stage:"mail", rubs:0 };
  show(p2World(), { label:"책상 앞, 노트북 메일", bg:"bedD-day" });
  hits({ mail: { tap: p2Open, key: p2Open } });
  if (i === 0) later(900, () => teach("tap", 262, 104, 0, 0, { key:"mail" }));
  else if (i === 2 || i === 3) later(700, p2Open);
  else teach("tap", 262, 104, 0, 0, { key:"mail" });
}
function p2World(){
  const P = PS, last = P.i === 4, st = P.stage;
  const catSc = .5 + P.i * .08;
  const near = st === "comfort" || st === "better";
  const catX = near ? 204 : 178;
  const lap = laptopFront(262, 226, { progress:.3 });
  const cat = st === "cheer"
    ? `<g class="hop">${catSit(catX, 226, catSc, { flip:true })}</g>`
    : catSit(catX, 226, catSc, { flip: near, happy: st === "better", wag: st === "better" });
  return `${seasonGlass(SEASONS[P.i])}
    ${calendarW(204, 46, { x: P.i * 5 + (st !== "mail" && !last ? 4 : 0) })}
    <g transform="translate(262,226) scale(.62) translate(-262,-226)">${lap}</g>
    <g id="pcat">${cat}</g>
    ${personBack(238, 300, { wear:"hoodie", slump: st === "sad" || st === "comfort", cheer: st === "cheer", reach: st === "better" })}
    ${st === "mail" ? `<g ${hitA("mail","메일 열기")}>${envelope(262, 112)}<rect x="226" y="80" width="72" height="62" fill="transparent"/></g>` : ""}
    ${st === "comfort" ? `<rect ${hitA("pet","쓰다듬기")} x="166" y="160" width="84" height="76" fill="transparent"/>` : ""}
    ${st === "cheer" ? `<text x="${catX}" y="150" text-anchor="middle" font-size="16" fill="#fff" stroke="#24273f" stroke-width="3.5" paint-order="stroke">냥!</text>` : ""}`;
}
function p2Open(){
  if (PS.stage !== "mail") return;
  idleKill();
  const last = PS.i === 4, quick = PS.i === 2 || PS.i === 3;
  PS.stage = "read"; world(p2World()); hits({});
  putFx('letter', letterFx(last));
  later(quick ? 1200 : 2000, () => {
    dropFx('letter');
    if (last){ PS.stage = "cheer"; world(p2World()); later(2200, () => fadeTo(p3, 700)); return; }
    PS.stage = "sad"; world(p2World());
    later(quick ? 600 : 1100, () => {
      PS.stage = "comfort"; world(p2World());
      if (quick){ [0, 350, 700].forEach((d, k) => later(d + 300, () => heart(204 + k*6, 180 - k*5))); later(1400, p2Better); return; }
      hits({ pet: { rub: { fn: p2Rub, per: 50 }, key: p2Rub } });
      later(400, () => teach("rub", 206, 196, 0, 0, { key:"petp", now: PS.i === 0 }));
    });
  });
}
function p2Rub(){
  if (PS.stage !== "comfort") return;
  PS.rubs++; heart(200 + (PS.rubs % 3) * 7, 180); idlePoke();
  if (PS.rubs >= 3) p2Better();
}
function p2Better(){
  if (PS.stage !== "comfort") return;
  PS.stage = "better"; world(p2World()); hits({}); idleKill();
  sound('gol', '골골', 214, 160, { fs:14 });
  later(1700, () => fadeTo(() => p2(PS.i + 1), 600));
}

/* ================= 프롤로그 3: 지난주. 후드티를 벗어 서랍에, 정장을 입는다 ================= */

    <g id="me">${me}</g>

    <g id="bori" class="mover" style="transform:translate(${P.catX || 320}px,444px)">${catSit(0, 0, .95, { flip: (P.catX || 320) < 236 })}</g>
    <g class="tg" id="tg-drawer"><rect x="${dx-6}" y="${dy+dh-56}" width="${dw+12}" height="64" rx="8" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g>
    <g class="tg" id="tg-me"><rect x="${X-48}" y="240" width="96" height="200" rx="14" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g>`;
}
function p3Hits(){

    hood: { pull: { progress:(a,b) => (a.y - b.y) / 80, move: v => { PS.lift = v; world(p3World()); }, done: p3Off, tapped: () => {} }, key: p3Off },
    hood2: { drag: { ghost:(x,y) => hoodieFold(x-28, y-10, 56), targets:[{ key:"drawer", r:[DR3[0]-16, DR3[1]+DR3[3]-80, DR3[2]+32, 110], fn: p3Store }] }, key: p3Store },
    suit: { drag: { ghost:(x,y) => hangSuit(x, y-40, .7), targets:[{ key:"me", r:[184, 230, 104, 214], fn: p3Suit }] }, key: p3Suit }
  });
}
function p3Off(){
  if (PS.stage !== "hoodie") return;
  PS.stage = "hold"; PS.lift = 0; world(p3World()); p3Hits(); idleKill();
  later(500, () => teach("drag", 236, 336, 212, 286, { key:"hoodiein" }));
}
function p3Store(){
  if (PS.stage !== "hold") return;
  PS.stage = "stored"; world(p3World()); p3Hits(); idleKill();
  sound('tak', '탁', 212, 260, { fs:16 });
  later(700, () => { PS.catX = 180; walk('bori', 180, 444, 1, 900, ""); });
  later(1700, () => { const b = $('bori'); if (b) b.innerHTML = catSit(0, 0, .95, { flip:true }); sound('kk', '킁킁', 180, 364, { fs:14 }); });
  later(2600, () => { dropFx('kk', 'tak'); teach("drag", 70, 170, 236, 330, { key:"suiton" }); });
}
function p3Suit(){
  if (PS.stage !== "stored") return;
  PS.stage = "suit"; world(p3World()); hits({}); idleKill();
  later(900, () => { PS.catX = 290; walk('bori', 290, 444, 1, 700); });
  later(1800, () => sound('sneeze', '에취!', 292, 364, { fs:18 }));
  later(3400, () => fadeTo(p4, 700));
}

  later(1200, () => { dropFx('tak'); sound('meow', '야옹?', BRD.x + 50, BRD.y + BRD.h - 30, { fs:16 }); PS.meow = true; world(p4World()); });
  later(2800, () => { PS.stage = "dark"; world(p4World()); sound('click', '딸깍', 150, 230, { fs:14 }); });
  later(4200, () => throughDoor(() => { s.day = 0; catNight(); }, "82%", "62%"));
}

/* ================= 보리의 밤: 문이 닫히면 카메라가 바닥으로 내려와 보리가 된다 ================= */
let CN = null;
const CSPOT = {
  start: [252, 476, 2.0],
  door:  [246, 414, 1.45],
  toy:   [150, 452, 1.7],
  drawer:[150, 444, 1.6],
  hoodie:[64, 446, 1.6],
  moon:  [118, 458, 1.8],
  hdoor: [236, 418, 1.5],
};
function catNight(){
  const first = s.day === 0;
  const hoodieAt = s.hoodie === "door" ? "door" : (s.hoodie === "wear" || s.hoodie === "bed") ? "room" : "drawer";
  CN = { acts:0, busy:false, at:"start", strokes:0, toy:true, moth:true, drawer:0, hoodieAt,
         gap: first ? "lamp" : (s.laptopNight ? "blue" : "dark"), done:{} };
  PLATE = "cat-dark";
  show(cnWorld(), { label:"거실 바닥, 닫힌 방문 앞. 나는 고양이", bg:"cat-dark" });
  cnHits();
  if (first) later(1600, () => { CN.gap = "dark"; part('doorL', cnDoor()); sound('click', '딸깍', 324, 366, { fs:14 }); later(900, () => dropFx('click')); });
  if (CN.gap === "blue") every(900, () => { if (!CN || CN.end) return; sound('tak', '타닥타닥', 300, 386, { fs:12, color:"#cfe0ff" }); later(500, () => dropFx('tak')); });
  if (first) later(first ? 2600 : 600, () => teach("tap", 250, 300, 0, 0, { key:"catdoor" }));
  else cnTeach();
}
const cnDoor = () => bigDoor({ gap: CN.gap, scratch: Math.min(4, CN.strokes), hoodie: CN.hoodieAt === "door" && !CN.end });
const cnDresser = () => bigDresser({ open: CN.drawer, sleeve: CN.hoodieAt === "drawer" && CN.drawer === 0, furClue: s.closetN > 0 });
function cnWorld(){
  const [x, y, sc] = CSPOT[CN.at];
  return `<g id="dresL">${cnDresser()}</g>
    <g id="hoodL">${CN.drawer >= 1 ? cnHoodieFloor() : ""}</g>
    <g id="doorL">${cnDoor()}</g>
    <g id="toyL">${CN.toy ? `<g ${hitA("toy","쥐 인형")}>${mouseToy(96, 452, 1.5)}<rect x="56" y="420" width="80" height="44" fill="transparent"/></g>` : ""}</g>
    <g id="mothL">${CN.moth ? `<g ${hitA("moth","나방")}>${moth(70, 300)}<circle cx="70" cy="300" r="30" fill="transparent"/></g>` : ""}</g>
    <rect ${hitA("door","방문")} x="144" y="0" width="216" height="404" fill="transparent"/>
    ${CN.hoodieAt === "drawer" ? `<rect ${hitA("sleeve","서랍 틈 소매")} x="56" y="310" width="66" height="96" fill="transparent"/>` : ""}
    <g id="slideL"></g>
    <g id="bori" class="mover" pointer-events="none" style="transform:translate(${x}px,${y}px) scale(${sc})">${catAway(0, 0, 1)}</g>
    <g class="tg" id="tg-gap"><rect x="150" y="380" width="204" height="34" rx="8" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g>
    <rect id="cnDim" class="dimmer" x="0" y="-150" width="${VW}" height="${VH+300}" fill="#05060d" opacity="0" pointer-events="none"/>`;
}
const cnHoodieFloor = () => `<path d="M-10,470 q10,-46 70,-50 q60,-2 76,44 z" fill="var(--hoodie)"/><path d="M14,452 q40,-22 96,-6" stroke="var(--hoodie-d)" stroke-width="4" fill="none"/><path d="M46,436 v14 M58,434 v14" stroke="#e8e9f1" stroke-width="2"/>`;
function cnHits(){
  hits({
    door: { rub: { fn: cnDoorRub, per: 46 }, key: cnDoorRub },
    toy: { drag: { ghost:(x,y) => mouseToy(x, y+8, 1.5), targets:[{ key:"gap", r:[144, 360, 216, 70], fn: cnToy }], from: on => { if (on) part('toyL', ""); else if (CN && CN.toy) part('toyL', `<g ${hitA("toy","쥐 인형")}>${mouseToy(96, 452, 1.5)}<rect x="56" y="420" width="80" height="44" fill="transparent"/></g>`); } }, key: cnToy },
    moth: { tap: cnMoth, key: cnMoth },
    sleeve: { pull: { progress:(a,b) => Math.hypot(b.x - a.x, b.y - a.y) / 70, move: v => { if (CN.drawer < 1){ CN.drawer = v; part('dresL', cnDresser()); } }, done: cnSleeve, tapped: () => { if (cnFree()) cnGo("drawer"); } }, key: cnSleeve }
  });
}
function cnTeach(){
  const L = [];
  if (!CN.done.door) L.push(["tap", 250, 300]);
  if (CN.toy) L.push(["drag", 96, 446, 250, 398]);
  if (CN.hoodieAt === "drawer" && CN.drawer === 0) L.push(["drag", 92, 360, 40, 420]);
  if (CN.moth) L.push(["tap", 70, 300]);
  if (L.length) teachCycle(L, { key:"catmenu", wait:5000 });
}
// 보리가 걸어간다 (걷는 중이면 도착한 뒤에 이어서 간다)
function cnGo(spot, then, ms=900){
  if (!CN) return;
  if (CN.busy){ later(200, () => cnGo(spot, then, ms)); return; }
  if (CN.at === spot){ if (then) then(); return; }
  CN.busy = true;
  const [x, y, sc] = CSPOT[spot];
  part('bori', spot === "door" || spot === "hdoor" ? catAway(0, 0, 1) : catSit(0, 0, 1, { flip: x < CSPOT[CN.at][0] }));
  walk('bori', x, y, sc, ms);
  later(ms + 60, () => { CN.at = spot; CN.busy = false; if (then) then(); });
}
// 한 번에 한 가지만 한다
const cnFree = () => CN && !CN.end && !CN.acting;
function cnAct(name){
  CN.acting = null; CN.acts++; CN.done[name] = true;
  if (CN.pulled || CN.end) return;
  if (CN.acts >= 2){ CN.end = true; hits({}); idleKill(); later(700, cnSleepy); }
  else later(700, cnTeach);
}
function cnDoorRub(){
  if (!cnFree()) return;
  if (CN.at !== "door"){ cnGo("door"); idlePoke(); return; }
  if (CN.busy) return;
  CN.strokes++;
  part('bori', catStand(0, 0, 1));
  sound('bak', '박박', 210 + (CN.strokes % 2) * 70, 300, { fs:17 });
  part('doorL', cnDoor());
  if (CN.strokes === 3){
    CN.acting = "door";
    later(500, () => { part('bori', catAway(0, 0, 1)); dropFx('bak'); sound('meow', s.day === 0 ? '야옹?' : '야옹', 250, 250, { fs:20 }); });
    later(1700, () => { dropFx('meow'); cnAct("door"); });
  } else {
    clearTimeout(CN.standT);
    CN.standT = later(700, () => { if (CN && !CN.acting && CN.at === "door") { part('bori', catAway(0, 0, 1)); dropFx('bak'); } });
  }
}
function cnToy(){
  if (!cnFree() || !CN.toy) return;
  CN.acting = "toy"; CN.toy = false; part('toyL', ""); idleKill();
  // 문 밑 틈(y 398) 아래쪽만 보이게 잘라 두고, 인형을 바닥에서 틈 쪽으로 밀어 넣는다
  part('slideL', clipBox(150, 398, 190, 90, `<g id="slideT">${mouseToy(206, 440, 1.25)}</g>`));
  cnGo("door", () => {
    part('bori', catSit(0, 0, 1, {}));
    const e = $('slideT'); if (e){ e.style.transition = `transform ${800*SPEED}ms ease-in`; requestAnimationFrame(() => requestAnimationFrame(() => { e.style.transform = 'translate(6px,-52px)'; })); }

  world(saWorld({ noCat:true, me:"" }) + `<g transform="translate(118,226) scale(.86) translate(0,168)">${headG({ face:"sleep" })}</g>
    ${catLoaf(74 + B*40, 312, .85, { zz:true })}`);
  sound('zz', 'z z', 150, 200, { fs:16 });
  later(2600, () => { dropFx('zz'); saNext(); });
}

/* ================= 7일 일요일: 보리의 낮. 보리가 되어 나를 본다 ================= */
let SU = null;
function sunday(){
  const busy = s.satWork >= 2;
  SU = { busy, acts:0, at:"start", lock:false, mouse:true }; s.hungryToday = false;
  show(suWorld(), { card: dayCard(), label:"일요일. 고양이 높이에서 본 나", bg:"sofa-day" });
  suHits();
  later(2400, () => teachCycle([["tap", 176, 270], ["drag", 60, 446, 176, 330], ["tap", 120, 450]], { key:"sun", each:2000 }));
}
function suMe(o={}){
  const B = SU.busy;
  return person(176, 398, Object.assign({ sc:1.25, wear:"hoodie", noLegs:true, face: B ? "tired" : "smile", pose: B ? "type" : "hold", held: B ? "" : `<g transform="scale(.4)">${phone(0, -6, { screen:"#cfe0ff" })}</g>` }, o));
}
function suWorld(meO, catHTML){
  return `<path d="M24,436 L196,436 L226,480 L-6,480 Z" fill="#ffe9a0" opacity=".4"/>
    <g id="sume">${suMe(meO)}</g>
    ${SU.busy ? `<g transform="translate(176,350) scale(.9) translate(-176,-350)">${laptopBack(176, 350, { glow:true })}</g>` : ""}
    <rect ${hitA("sunp","햇볕 자리")} x="10" y="432" width="200" height="48" fill="transparent"/>
    ${SU.mouse ? `<g ${hitA("mouse","쥐 인형")}>${mouseToy(60, 452, 1.5)}<rect x="18" y="420" width="84" height="48" fill="transparent"/></g>` : ""}
    <rect ${hitA("me","나에게")} x="100" y="150" width="160" height="270" fill="transparent"/>
    <g id="bori" class="mover" pointer-events="none" style="transform:translate(150px,478px) scale(1.9)">${catHTML || catAway(0, 0, 1)}</g>`;
}
function suHits(){
  hits({ me: { tap: suMeTap, key: suMeTap }, sunp: { tap: suSun, key: suSun },
         mouse: { drag: { ghost:(x,y) => mouseToy(x, y+8, 1.5), targets:[{ key:"me", r:[90, 140, 190, 280], fn: suMouse }] }, key: suMouse } });
}
function suAct(){ SU.acts++; SU.lock = false; if (SU.acts >= 2) later(1400, () => fadeTo(() => night(false), 700)); else { world(suWorld()); suHits(); armIdle(); } }
function suMeTap(){
  if (SU.lock) return; SU.lock = true; idleKill();
  walk('bori', 246, 404, 1.3, 900);
  later(950, () => {
    if (SU.busy){
      part('bori', catLoaf(0, 0, 1, { awake:true }));
      later(600, () => {
        if (s.bond >= 6){ part('sume', suMe({ face:"happy", pose:"pet" })); heart(220, 300); bond(1); }
        else { part('sume', suMe({ face:"soft", pose:"reach" })); bond(0); }
      });
      later(2200, () => { if (s.bond < 6){ walk('bori', 150, 476, 1.8, 700); part('bori', catSit(0, 0, 1, {})); } suAct(); });
    } else {
      part('bori', catLoaf(0, 0, 1, { zz:true }));
      part('sume', suMe({ face:"happy", pose:"hold", held:"" }));
      [0, 300, 600].forEach((d, i) => later(d, () => heart(230 + i*6, 320 - i*6)));
      bond(2);
      later(2200, suAct);
    }
  });
}
function suMouse(){
  if (SU.lock || !SU.mouse) return; SU.lock = true; SU.mouse = false; idleKill();
  world(suWorld()); hits({});
  walk('bori', 200, 446, 1.6, 700);
  later(800, () => {
    part('sume', suMe({ face: SU.busy ? "neutral" : "happy", pose:"wave" }));
    putFx('flyM', `<g id="flyM" style="transition:transform ${800*SPEED}ms ease-out">${mouseToy(220, 300, 1.3)}</g>`);
    later(60, () => { const m = $('flyM'); if (m) m.style.transform = 'translate(-150px,150px)'; });
    later(400, () => { walk('bori', 76, 470, 1.8, 600); part('bori', catLeap(0, 0, 1)); });
    later(1200, () => { dropFx('flyM'); part('bori', catSit(0, 0, 1, { happy:true, wag:true })); bond(1); });
    later(2200, suAct);
  });
}
function suSun(){
  if (SU.lock) return; SU.lock = true; idleKill();
  walk('bori', 110, 462, 1.7, 800);
  later(850, () => { part('bori', catLoaf(0, 0, 1, { zz:true })); sound('zz', '골골', 116, 388, { fs:14 }); });
  later(2600, () => { dropFx('zz'); SU.acts = 2; suAct(); });
}

/* ================= 12일 금요일: 첫 월급 ================= */
function paydayEvening(){
  const D = BRD;
  const W = s.hoodie === "wear" ? "hoodie" : "tee";
  const draw = (st) => `${clockFace("ck", 128, 70, 24, 7, 30)}
    ${doorG(D, 0, { hoodie: s.hoodie === "door" })}${rackSuit({})}${bedSide(0, 418, 156, { hoodie: s.hoodie === "bed" })}
    ${st === "box" ? person(170, 448, { wear: W, face:"happy", pose:"hold", held:`<g transform="translate(0,30)">${cardBox(0, 0, 70, 40)}<path d="M-35,-20 h70 M0,-40 v40" stroke="#e5484d" stroke-width="4"/></g>` })
      : person(170, 448, { wear: W, face:"happy", pose: st === "laugh" ? "cheer" : "stand" })}
    ${st === "box" ? "" : `<g>${cardBox(270, 452, 84, 46)}${st === "in" || st === "laugh" ? `<g transform="translate(270,420)">${catSit(0, 0, .9, { happy:true })}</g>${cardBox(270, 452, 84, 30)}` : ""}</g>`}
    ${st === "box" ? catSit(262, 448, 1, { flip:true, wag:true }) : ""}
    ${st === "box" ? `<rect ${hitA("gift","선물 상자")} x="130" y="330" width="80" height="70" fill="transparent"/>` : ""}
    <g class="tg" id="tg-cat"><rect x="220" y="370" width="90" height="84" rx="10" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="7 6"/></g>
    ${hudFood()}`;
  show(draw("box"), { label:"월급날 저녁. 선물 상자", bg:"bedR-eve" });
  const give = () => {
    idleKill(); hits({});
    world(draw("open")); sound('rip', '부욱', 270, 380, { fs:15 });
    later(1200, () => { world(draw("in")); sound('nya', '냥!', 280, 336, { fs:17 }); });
    later(2600, () => { dropFx('nya'); world(draw("laugh")); sound('ha', '하하', 170, 236, { fs:15 }); });
    later(4400, () => fadeTo(() => night(true), 700));
  };
  hits({ gift: { drag: { ghost:(x,y) => cardBox(x, y+20, 70, 40), targets:[{ key:"cat", r:[210, 340, 120, 140], fn: give }] }, key: give } });
  later(600, () => teach("drag", 170, 360, 266, 410, { key:"gift" }));
}
function payPhone(){
  putFx('ph', `<g id="ph" class="vib" ${hitA("phone","휴대폰")}><g transform="translate(112,284) scale(.45)">${phone(0, 0, { screen:"#cfe0ff", inner:`<text x="0" y="8" text-anchor="middle" font-size="26">₩</text>` })}</g><rect x="86" y="250" width="52" height="70" fill="transparent"/></g>`);
  sound('zing', '징-', 112, 240, { fs:14 });
  hits({ phone: { tap: payOpen, key: payOpen } });
  teach("tap", 112, 286, 0, 0, { key:"pay" });
}
function payOpen(){
  if (!$('ph')) return;
  dropFx('ph', 'zing'); idleKill(); hits({});
  putFx('pay', `<g id="pay" class="pop" pointer-events="none"><rect x="0" y="-150" width="${VW}" height="${VH+300}" fill="#0b0d1c" opacity=".45"/>
    <rect x="96" y="80" width="168" height="290" rx="22" fill="#24273f"/><rect x="108" y="102" width="144" height="246" rx="6" fill="#fff"/>
    <text x="180" y="150" text-anchor="middle" font-size="16" fill="#64688c">급여 입금</text>
    <text x="180" y="200" text-anchor="middle" font-size="24" fill="#2f9e6a">첫 월급</text>
    <path d="M128,226 h104" stroke="#d6dbef" stroke-width="4"/></g>`);
  later(1900, () => { dropFx('pay'); OF.meCheer = true; part('me', ofMe()); sound('ya', '야호!', SEAT[0], 226, { fs:16 }); });
  later(3300, () => { dropFx('ya'); OF.meCheer = false; part('me', ofMe()); ofToSix(); });
}

/* ================= 엔딩: 열이틀 동안 무엇을 가장 많이 했는지 ================= */
const ENDINGS = {
  lost:   { t: () => "수습 기간 연장" },
  hungry: { t: () => "빈 밥그릇" },
  far:    { t: () => `멀어진 ${CAT}` },
  hotteok:{ t: () => "고양이 키우는 사장님" },
  night:  { t: () => "매일 밤 같이 잤다" },
  morning:{ t: () => "아침마다 인사했다" },
  evening:{ t: () => "저녁마다 같이 놀았다" },
  hoodie: { t: () => "문 앞의 후드티" },
  all:    { t: () => "밤, 아침, 저녁 다 함께" }
};
const TOTAL_ENDINGS = Object.keys(ENDINGS).length;
function tally(){ let n = 0, m = 0, e = 0; for (let d=0; d<=12; d++){ const L = s.log[d]; if (!L) continue; if (L.open) n++; if (L.pet) m++; if (L.play) e++; } return { n, m, e }; }
function endingKey(){
  const { n, m, e } = tally();
  if (s.face <= 0 || s.lates >= 5) return "lost";
  if (s.hungry >= 3) return "hungry";
  if (s.bond <= 1) return "far";
  if (n >= 3 && m >= 3 && e >= 3 && s.lates <= 2) return "all";
  if (s.bossCat && s.bond >= 7 && s.meet === "good") return "hotteok";
  if (s.hoodie === "door" && n <= 3) return "hoodie";
  const best = Math.max(n, m, e);
  return best === n ? "night" : best === m ? "morning" : "evening";
}
function endingLines(k){
  const { n, m, e } = tally();
  return {
    lost:   ["지각이 잦아서 수습 기간이 한 달 늘어났다.", n >= 6 ? `그래도 ${CATw()} 거의 매일 밤 같이 잤다.` : `${CATe()} 거의 매일 밤 방문 앞에서 잤다.`],
    hungry: [`밥을 못 준 아침 ${s.hungry}번.`, `${CATe()} 빈 밥그릇 앞에서 자주 울었다.`],
    far:    [`${CATe()} 이제 불러도 잘 오지 않는다.`, "거실 구석에서 혼자 잔다."],
    hotteok:[`사장님께 ${CAT} 사진을 보냈다.`, "호떡이 사진이 답장으로 왔다."],
    night:  [`같이 잔 밤 ${n}번.`, "그 대신 아침은 늘 조금 바빴다."],
    morning:[`나가기 전에 쓰다듬은 아침 ${m}번.`, `${CATe()} 매일 방문 앞까지 배웅했다.`],
    evening:[`같이 논 저녁 ${e}번.`, "낚싯대 끝 깃털이 다 닳았다."],
    hoodie: ["방문은 닫고 잤다.", `대신 문 앞 후드티 위에서 ${CATi()} 잤다.`],
    all:    ["밤에도, 아침에도, 저녁에도 같이 있었다.", "조금 피곤했지만 다 해냈다."]
  }[k];
}
function ending(){
  const k = endingKey(); saveFound(k);
  const open = s.finalOpen, { n, m, e } = tally();
  let pic;
  if (open){
    PLATE = "bedR-dark";
    pic = `${doorG(ND, 1, { beyond:"#141629" })}${bedFront(382)}
      <g transform="translate(62,352) scale(1.15) translate(0,168)">${headG({ face:"sleep" })}</g>
      ${blanketFront(86, 380)}
      ${k === "far" ? "" : catLoaf(150, 384, 1.05, { zz:true })}
      ${k === "hungry" ? `<g transform="translate(300,452) scale(1.3)">${bowl(0, 0, 0)}</g>` : ""}`;
  } else {
    PLATE = "cat-dark";
    pic = `${bigDresser({ sleeve: s.hoodie == null })}${bigDoor({ gap:"dark", hoodie: s.hoodie === "door" })}
      ${k === "far" ? `<g transform="translate(40,470) scale(1.2)">${catLoaf(0, 0, 1, { zz:true })}</g>` : `<g transform="translate(222,420) scale(1.5)">${catLoaf(0, 0, 1, { zz:true })}</g>`}
      ${k === "hungry" ? `<g transform="translate(112,454) scale(1.5)">${bowl(0, 0, 0)}</g>` : ""}`;
  }
  const strip = Array.from({ length:13 }, (_, i) => `<div>${stripIcon(s.log[i])}<span>${i === 0 ? "전" : i}</span></div>`).join('');
  show(pic, { flat:true, label:"엔딩", bg: open ? "bedR-dark" : "cat-dark", below: `
    <p class="ending-title">${ENDINGS[k].t()}</p>
    ${endingLines(k).map(t => `<p class="end-line">${t}</p>`).join('')}
    <div class="strip" aria-label="열이틀의 기록">${strip}</div>
    <p class="quiet">같이 잔 밤 ${n} · 쓰다듬은 아침 ${m} · 같이 논 저녁 ${e}<br>지각 ${s.lates} · 야근 ${s.overtime} · 밥 거른 아침 ${s.hungry}</p>
    <button class="wide" id="again">처음부터</button>
    ${foundLine()}` });
  $('again').onclick = goTitle;
}
function getFound(){ try { return JSON.parse(localStorage.getItem('catgame5-found') || '[]'); } catch(e){ return []; } }
function saveFound(k){ try { const f = getFound(); if (!f.includes(k)){ f.push(k); localStorage.setItem('catgame5-found', JSON.stringify(f)); } } catch(e){} }
function foundLine(){ const f = getFound(); return f.length ? `<p class="found">찾은 엔딩 ${f.length} / ${TOTAL_ENDINGS}</p>` : ''; }

goTitle();
</script>

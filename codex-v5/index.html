<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cat at the Door</title><link rel="stylesheet" href="src/life.css?v=dc1224bbf620"></head>
<body>
<main id="app">
 <section id="titleScreen" class="title-screen"><canvas id="titleCanvas" width="640" height="360" aria-hidden="true"></canvas><div class="title-menu"><h1>Cat at the Door</h1><p class="subtitle">내 한 몸 건사하기도 힘든 세상에서 살아남기!!!</p><label>내 이름<input id="playerName" maxlength="8" placeholder="김신입" autocomplete="off"></label><button id="startButton" disabled>시작</button><button id="continueButton" class="resume-button" hidden>이어서</button></div></section>
 <section id="gameScreen" hidden>
  <header class="topbar"><div id="clockWidget" class="clock-widget" hidden><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="clock-face" cx="32" cy="32" r="28"/><path class="clock-marks" d="M32 7v5M57 32h-5M32 57v-5M7 32h5"/><path id="clockHour" class="clock-hour" d="M32 32V18"/><path id="clockMinute" class="clock-minute" d="M32 32V11"/><circle cx="32" cy="32" r="2"/></svg><span id="clockPeriod"></span></div><span id="dateLabel"></span><span id="timeLabel"></span><button id="foodLabel" aria-label="사료 확인과 슈퍼 방문"></button><span id="energyLabel"></span><span id="cashLabel"></span><button id="phoneButton" aria-label="휴대폰 열기"><svg viewBox="0 0 24 28" aria-hidden="true"><rect x="4" y="2" width="16" height="24" rx="3" fill="#edf3f1" stroke="currentColor" stroke-width="2"/><path d="M8 6h8M8 11h8M8 15h6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="22" r="1.4" fill="currentColor"/></svg><i id="phoneBadge" hidden>!</i></button><button id="soundButton" aria-label="소리 끄기"></button><button id="menuButton" aria-label="저장과 게임 메뉴">☰</button></header>
  <div id="objectiveBar"><span id="objectiveText"></span><span id="timeChange" hidden></span><button id="routineToggle">오늘 챙길 것</button></div>
  <div id="routineChecklist" class="routine-checklist" aria-label="오늘 챙길 것"></div><div id="dayRhythm" class="time-track" aria-label="하루의 흐름"><div id="dayLight" class="day-light"><span id="dayMarker"></span></div><span id="elapsedAction" aria-live="polite"></span></div><div id="shiftProgress" hidden></div><div id="eveningOptions" hidden></div><div id="nightBanner" class="night-banner" hidden></div>
  <div class="stage-wrap"><canvas id="world" width="640" height="360" tabindex="0" role="application" aria-label="WASD나 방향키로 이동. 화살표가 가리키는 사물을 클릭하거나 끌어 조작합니다."></canvas><div id="hotspots"></div><div id="shopPrices" class="shop-prices" aria-hidden="true" hidden></div></div><div id="sceneNotice" class="notice" role="status" hidden></div><button id="reopenDoor" class="reopen-door" hidden>문을 다시 열어 둔다</button>
  <section id="dialogue" class="dialogue" aria-live="polite" hidden><canvas id="portrait" width="192" height="192" aria-hidden="true"></canvas><div class="dialogue-body"><div id="speaker" class="speaker"></div><div id="speech" class="speech"></div><div id="purchaseSummary" class="purchase-summary" hidden></div><div id="choices" class="choices"></div></div><button id="dialogueNext" aria-label="대화 이어 듣기">▾</button></section>
  <div id="minigameBar" class="mini-bar" hidden><strong id="miniLabel"></strong><span id="miniHint"></span><button id="miniExit">그만하기</button></div><div id="taskSource" hidden></div><div id="miniActions" hidden></div>
  <div id="touchControls"><div class="dpad"><button data-key="w" aria-label="위로">▲</button><button data-key="a" aria-label="왼쪽">◀</button><button data-key="s" aria-label="아래로">▼</button><button data-key="d" aria-label="오른쪽">▶</button></div></div>
 </section>
 <section id="blackScreen" class="black-screen" tabindex="0" aria-label="클릭 또는 Enter, Space로 이어 읽기" hidden><p id="blackText" aria-live="polite"></p><span aria-hidden="true">▾</span></section>
 <section id="phone" class="modal" hidden><div class="phone-shell"><button id="phoneClose" aria-label="휴대폰 닫기">×</button><div id="phoneBody"></div></div></section>
 <section id="acknowledge" class="modal" hidden><div class="ack-card"><p id="ackText"></p><div id="ackActions"></div></div></section>
 <section id="naming" class="modal" hidden><form id="nameForm"><label for="catName">이름을 뭐라고 부를까?</label><input id="catName" placeholder="예시) 보리" maxlength="8" autocomplete="off"><button>불러본다</button></form></section>
 <section id="pauseScreen" class="modal session-menu" hidden><div class="session-card"><h2>잠깐 쉬기</h2><button id="resumePlay">계속하기</button><button id="saveButton">저장하기</button><button id="saveExitButton">저장하고 시작 화면으로</button><button id="newGameButton">처음부터 다시하기</button><p id="saveStatus" role="status"></p></div></section>
 <section id="endingScreen" class="ending" hidden><canvas id="endingCanvas" width="640" height="360" role="img" aria-label="마지막 날 집의 모습"></canvas><h1 id="endingTitle"></h1><div id="endingText"></div><button id="restartButton">다시 시작</button></section>
</main>

</body></html>

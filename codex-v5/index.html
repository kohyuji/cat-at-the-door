<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cat at the Door</title><link rel="stylesheet" href="src/life.css"></head>
<body>
<main id="app">
 <section id="titleScreen" class="title-screen"><canvas id="titleCanvas" width="640" height="360" aria-hidden="true"></canvas><div class="title-menu"><h1>Cat at the Door</h1><label>내 이름<input id="playerName" maxlength="8" placeholder="김신입" autocomplete="off"></label><button id="startButton" disabled>시작</button></div></section>
 <section id="gameScreen" hidden>
  <header class="topbar"><span id="dateLabel"></span><span id="timeLabel"></span><button id="foodLabel" aria-label="사료 확인과 주문"></button><span id="energyLabel"></span><button id="phoneButton" aria-label="휴대폰 열기"><svg viewBox="0 0 24 28" aria-hidden="true"><rect x="4" y="2" width="16" height="24" rx="3" fill="#edf3f1" stroke="currentColor" stroke-width="2"/><path d="M8 6h8M8 11h8M8 15h6" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="22" r="1.4" fill="currentColor"/></svg><i id="phoneBadge" hidden>!</i></button><button id="soundButton" aria-label="소리 끄기"></button></header>
  <div id="objectiveBar"><span id="objectiveText"></span><span id="timeChange" hidden></span></div><div id="eveningOptions" hidden></div>
  <div class="stage-wrap"><canvas id="world" width="640" height="360" tabindex="0" role="application" aria-label="WASD나 방향키로 이동. 화살표가 가리키는 사물을 클릭하거나 끌어 조작합니다."></canvas><div id="hotspots"></div><div id="sceneNotice" class="notice" role="status" hidden></div></div>
  <section id="dialogue" class="dialogue" aria-live="polite" hidden><canvas id="portrait" width="80" height="80" aria-hidden="true"></canvas><div class="dialogue-body"><div id="speaker" class="speaker"></div><div id="speech" class="speech"></div><div id="choices" class="choices"></div></div><button id="dialogueNext" aria-label="대화 이어 듣기">▾</button></section>
  <div id="minigameBar" class="mini-bar" hidden><strong id="miniLabel"></strong><span id="miniHint"></span><button id="miniExit">그만하기</button></div><div id="taskSource" hidden></div><div id="miniActions" hidden></div>
  <div id="touchControls"><div class="dpad"><button data-key="w" aria-label="위로">▲</button><button data-key="a" aria-label="왼쪽">◀</button><button data-key="s" aria-label="아래로">▼</button><button data-key="d" aria-label="오른쪽">▶</button></div></div>
 </section>
 <section id="phone" class="modal" hidden><div class="phone-shell"><button id="phoneClose" aria-label="휴대폰 닫기">×</button><div id="phoneBody"></div></div></section>
 <section id="acknowledge" class="modal" hidden><div class="ack-card"><p id="ackText"></p><div id="ackActions"></div></div></section>
 <section id="naming" class="modal" hidden><form id="nameForm"><label for="catName">이름을 뭐라고 부를까?</label><input id="catName" placeholder="보리" maxlength="8" autocomplete="off"><button>불러본다</button></form></section>
 <section id="endingScreen" class="ending" hidden><canvas id="endingCanvas" width="640" height="360" role="img" aria-label="마지막 날 집의 모습"></canvas><h1 id="endingTitle"></h1><div id="endingText"></div><button id="restartButton">다시 시작</button></section>
</main>
<script src="src/life-state.js"></script><script src="src/life-story.js"></script><script src="src/pixel-render.js"></script><script src="src/life-view.js"></script><script src="src/life-game.js"></script>
</body></html>
